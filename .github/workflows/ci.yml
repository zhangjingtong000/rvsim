name: CI

# 三套回归：riscv-tests（82 官方 + 9 定向）、能力契约、界面 e2e。
# 本地等价命令：./scripts/ci.sh（内核）+ scripts/ui/ci-e2e.ps1（Windows 侧界面）。
#
# 这份工作流在真实 GitHub runner 上跑过：内核 job 通过；界面 job 曾在 head
# 636898b 那轮整片失败（e2e 137/153，13.15 起连续 16 条「内核没有响应」），
# 根因是内核 trap 入口的嵌套 trap 与 exit 路径漏切 satp，已修（见 README
# 「CI 实际结论」）。改这里的步骤后请在 Actions 页面确认结论，不要只看本地
# scripts/ci.sh 的结果。

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: 内核（构建 + 指令测试 + 能力契约）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 RISC-V 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-unknown-elf make python3 curl git

      - name: 拉第三方依赖（capstone / riscv-tests / dtb 工具）
        run: ./scripts/fetch_deps.sh all

      - name: 构建
        run: make -j"$(nproc)"

      - name: 构建定向测试
        run: make directed

      - name: 内核回归
        run: ./tests/run_tests.sh all

      - name: 确认内核镜像已同步到 web/images
        run: |
          test -f web/images/kernel.elf
          cmp build/kernel.elf web/images/kernel.elf

  ui:
    name: 界面 e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 RISC-V 工具链（e2e 需要 kernel.elf）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-unknown-elf make python3 curl git

      - name: 拉第三方依赖
        run: ./scripts/fetch_deps.sh all

      - name: 构建
        run: make -j"$(nproc)"

      - name: 安装 Playwright 与 chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: 跑界面 e2e
        env:
          # e2e.js 会自动探测 chromium，这里显式给一下更稳
          CHROME: ""
        run: |
          set -o pipefail
          python3 -m http.server 8799 --directory web &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8799/index.html
          node scripts/ui/e2e.js 2>&1 | tee e2e.log

      - name: 失败时保留日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e.log
            *.log
          if-no-files-found: warn
