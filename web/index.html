  for (let i = 0; i < 16; i++) {
    const nm = readStrAt(ram + (FILE_SYNC_PA - 0x80000000) + i * 40, 24);
    if (nm === name) return A[base + i * 10 + 7] === 1;
  }
  return false;
}

function joinPath(nm) { return (fsCwd ? fsCwd + "/" : "") + String(nm).replace(/^\/+/, ""); }
function refreshFiles() { fileSig = ""; panelsRender(); }

/* 路径栏文本。内核里存的是规范名（ui-dir），显示成 /ui-dir 才像路径。 */
function fsPathText() { return fsCwd ? "/" + fsCwd : "/"; }

/* 文件操作失败时在路径栏上留一句话。
   以前失败是静默的：点完「重命名」什么都不变，用户不知道是没点到还是内核拒绝了。 */
let filesToastTimer = null, filesToastMsg = "";
/* 提示做成状态而不是一次性写文本：文件列表一变就会重渲染路径栏，
   之前写完马上被 panelsRender 覆盖，用户只看到路径栏闪了一下红色，
   错误文字一次都没出现过。 */
function filesToast(msg) {
  filesToastMsg = msg;
  clearTimeout(filesToastTimer);
  filesToastTimer = setTimeout(() => { filesToastMsg = ""; panelsRender(); }, 3000);
  panelsRender();
}

/* 窗口内的小输入框：不用 window.prompt（浅色系统弹窗在深色桌面上很突兀） */
function filesAsk(title, value) {
  return new Promise((resolve) => {
    const body = (winEls[2] && winEls[2].body) || $("os");
    if (!body) return resolve(null);
    const old = body.querySelector(".fdlg");
    if (old) old.remove();
    const d = document.createElement("div");
    d.className = "fdlg";
    d.innerHTML = '<div class="fdlg-box"><div class="fdlg-t"></div>'
      + '<input spellcheck="false" autocomplete="off"><div class="fdlg-b">'
      + '<button data-r="0">取消</button><button class="pri" data-r="1">确定</button></div></div>';
    d.querySelector(".fdlg-t").textContent = title;
    const inp = d.querySelector("input");
    inp.value = value || "";
    body.appendChild(d);
    inp.focus();
    inp.select();
    const done = (v) => { d.remove(); resolve(v); };
    d.querySelector(".fdlg-b").onclick = (e) => {
      const b = e.target.closest("button");
      if (b) done(b.dataset.r === "1" ? inp.value.trim() : null);
    };
    inp.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); done(inp.value.trim()); }
      else if (e.key === "Escape") { e.preventDefault(); done(null); }
      e.stopPropagation();
    };
  });
}

function filesDelete(name) {
  filesAsk("删除 " + name + "？（输入 yes 确认）", "").then((v) => {
    if (v !== "yes") return;
    window.rv.fsRemove(name).then((rc) => {
      if (rc !== 0) filesToast("删除失败");
      refreshFiles();
    }).catch((e) => filesToast("删除失败：" + e.message));
  });
}

function filesRename(name) {
  const slash = name.lastIndexOf("/");
  const base = name.slice(slash + 1);
  const parent = slash > 0 ? name.slice(0, slash) : "";
  filesAsk("重命名 " + base, base).then((nm) => {
    if (!nm || nm === base) return;
    window.rv.fsRename(name, (parent ? parent + "/" : "") + nm).then((rc) => {
      if (rc === 2) filesToast("重命名失败：名字不合法或太长（上限 23 字节）");
      else if (rc === 3) filesToast("重命名失败：已经有同名文件");
      else if (rc !== 0) filesToast("重命名失败");
      refreshFiles();
    }).catch((e) => filesToast("重命名失败：" + e.message));
  });
}

/* 行右键菜单 */
function fileCtx(name, isDir, x, y) {
  showCtx([
    { label: isDir ? "打开文件夹" : (/\.elf$/i.test(name) ? "运行程序" : "打开"),
      action: () => openFileByName(name) },
    { label: "重命名…", action: () => filesRename(name) },
    "-",
    { label: "删除", action: () => filesDelete(name) },
  ], x, y);
}

/* 双击/「打开」的统一入口 */
function openFileByName(name) {
  if (!M) return;
  if (fsIsDir(name)) { fsCwd = name; fileSig = ""; panelsRender(); return; }
  if (/\.elf$/i.test(name)) { ensureTerm(); sendCmd("run " + name); return; }
  openEditor(name);
}

/* 导入本地 .elf：写进 RAMFS 之后双击就能 run。
   没有这一步，这台机器永远只能跑出厂那 4 个二进制。 */
function importProgram() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".elf,.bin";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const buf = new Uint8Array(rd.result);
      const nm = joinPath(f.name);
      /* 走 UART 传二进制不现实，直接按字节写进宿主与内核约定的数据页，
         再让内核把它当文件存下来。 */
      if (buf.length > HCMD_DATA_MAX) {
        filesToast("程序 " + buf.length + " 字节，超过 " + HCMD_DATA_MAX + " 上限");
        return;
      }
      M.HEAPU8.set(buf, guestByte(HCMD_DATA_PA));
      hostCmdRaw(1, nm, "", 0, buf.length).then((rc) => {
        if (rc !== 0) filesToast("导入失败（名字太长或文件槽已满）");
        refreshFiles();
      }).catch((e) => filesToast("导入失败：" + e.message));
    };
    rd.readAsArrayBuffer(f);
  };
  inp.click();
}

/* 已经自己把数据写进数据页时用这个：len 由调用方给 */
function hostCmdRaw(op, p0, p1, a0, len) {
  return new Promise((resolve, reject) => {
    if (!M) return reject(new Error("未就绪"));
    const baseW = guestOff(HCMD_PA), baseB = guestByte(HCMD_PA);
    const A = M.HEAPU32, B = M.HEAPU8;
    const put = (str, off) => {
      B.fill(0, off, off + 64);
      const b = _enc.encode(str || "");
      for (let i = 0; i < Math.min(b.length, 63); i++) B[off + i] = b[i];
    };
    put(p0, baseB + HCMD_HDR);
    put(p1, baseB + HCMD_HDR + 64);
    const i = baseW;
    A[i] = 0;
    A[i + 1] = ++hcmdSeq;
    A[i + 2] = op;
    A[i + 3] = a0 >>> 0;
    A[i + 4] = len >>> 0;
    A[i + 5] = 0xFFFFFFFF;
    A[i] = HCMD_MAGIC;
    const t0 = Date.now();
    const tick = () => {
      if (!M) return reject(new Error("已卸载"));
      if (A[i] !== HCMD_MAGIC) return resolve(A[i + 5] >>> 0);
      if (Date.now() - t0 > 4000) return reject(new Error("超时"));
      setTimeout(tick, 16);
    };
    setTimeout(tick, 16);
  });
}

/* 工具栏：绑定一次，行数据重渲染不影响 */
function bindFilesBar(fs) {
  const bar = fs.querySelector(".fbar");
  if (!bar || bar.dataset.bound) return;
  bar.dataset.bound = "1";
  bar.querySelectorAll("button[data-tip]").forEach((b) => {
    b.addEventListener("pointerenter", () => tipShow(b, b.dataset.tip));
    b.addEventListener("pointerleave", tipHide);
  });
  bar.addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-f]");
    if (!b) return;
    const act = b.dataset.f;
    const sel = fs.querySelector("tr.sel");
    const selName = sel && sel.dataset.name;
    if (act === "up") {
      if (!fsCwd) return;
      const i = fsCwd.lastIndexOf("/");
      fsCwd = i > 0 ? fsCwd.slice(0, i) : "";
      fileSig = "";
      panelsRender();
    } else if (act === "new") {
      filesAsk("新建文件", "untitled.txt").then((nm) => {
        if (nm) window.rv.fsWrite(joinPath(nm), "").then((rc) => {
      if (rc === 2) filesToast("新建失败：文件槽已满（最多 16 个）");
      else if (rc !== 0) filesToast("新建失败：名字不合法或太长（上限 23 字节）");
      refreshFiles();
    }).catch((e) => filesToast("新建失败：" + e.message));
      });
    } else if (act === "mkdir") {
      filesAsk("新建文件夹", "docs").then((nm) => {
        if (nm) window.rv.fsMkdir(joinPath(nm)).then((rc) => {
      if (rc === 2) filesToast("新建失败：文件槽已满（最多 16 个）");
      else if (rc !== 0) filesToast("新建失败：名字不合法或太长（上限 23 字节）");
      refreshFiles();
    }).catch((e) => filesToast("新建文件夹失败：" + e.message));
      });
    } else if (act === "rename") {
      if (selName) filesRename(selName);
      else filesAsk("先点一行选中，再重命名", "");
    } else if (act === "del") {
      if (selName) filesDelete(selName);
      else filesAsk("先点一行选中，再删除", "");
    } else if (act === "import") {
      importProgram();
    }
  });
}

/* ══ 文本编辑器（宿主窗口）══ */
const EDIT_ICO = '<svg viewBox="0 0 16 16" fill="none" stroke="#A9B4C4" stroke-width="1.4"'
  + ' stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 2.5h6l3 3v8h-9z"/>'
  + '<path d="M9.5 2.5v3h3"/><path d="M5.5 8.5h5M5.5 11h3.5"/></svg>';

function openEditor(path) {
  const id = "editor:" + path;
  if (hostWins.has(id)) { hostWinFocus(id); return; }
  window.rv.fsRead(path).then((txt) => {
    if (txt == null) { ensureTerm(); sendCmd("cat " + path); return; }
    buildEditor(id, path, txt);
  }).catch(() => { ensureTerm(); sendCmd("cat " + path); });
}

function buildEditor(id, path, text) {
  const layer = $("winlayer");
  if (!layer) return;
  const n = hostWins.size;
  const size = [430, 330];
  const el = document.createElement("div");
  el.className = "win host-win solid";   /* 读写界面不该有底噪，整窗不透明 */
  el.style.width = size[0] + "px";
  el.style.height = size[1] + "px";
  el.style.left = Math.round(150 + n * 26) + "px";
  el.style.top = Math.round(108 + n * 22) + "px";
  el.style.zIndex = ++hostZ;
  el.innerHTML =
    '<div class="win-bar"><span class="win-ico">' + EDIT_ICO + '</span>'
    + '<span class="win-title">' + esc(path) + '</span>'
    + '<span class="win-ctl">'
    + '<button class="min" title="最小化"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="currentColor" stroke-width="1.2"/></svg></button>'
    + '<button class="close" title="关闭"><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>'
    + '</span></div><div class="win-body"></div>';
  layer.appendChild(el);
  const body = el.querySelector(".win-body");
  body.innerHTML = '<div class="ed-wrap">'
    + '<div class="ed-bar"><span class="ed-path"></span>'
    + '<button class="pri ed-save">保存</button><button class="ed-reload">还原</button></div>'
    + '<textarea class="ed-area" spellcheck="false"></textarea>'
    + '<div class="ed-st">保存写回 RAMFS；刷新页面会丢</div></div>';
  body.querySelector(".ed-path").textContent = path;
  const ta = body.querySelector(".ed-area");
  ta.value = text;
  const st = body.querySelector(".ed-st");
  const save = () => {
    /* 保存前先确认文件还在。以前不管三七二十一直接写，文件被删了
       也会被静默重建——用户以为自己是在改一个已经不存在的东西。 */
    const names = window.rv.state.files.map((f) => f.name);
    if (names.indexOf(path) < 0) {
      if (!window.confirm("「" + path + "」已经被删除了。\n\n要重新创建它吗？")) {
        st.textContent = "文件已删除，未保存";
        return;
      }
    }
    window.rv.fsWrite(path, ta.value).then((rc) => {
      st.textContent = rc === 0
        ? "已保存 " + _enc.encode(ta.value).length + " 字节"
        : "保存失败（rc=" + rc + "）";
      refreshFiles();
    }).catch((e) => { st.textContent = "保存失败：" + e.message; });
  };
  body.querySelector(".ed-save").onclick = save;
  body.querySelector(".ed-reload").onclick = () => {
    window.rv.fsRead(path).then((t) => { ta.value = t == null ? "" : t; st.textContent = "已还原"; });
  };
  ta.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
  });
  wireHostWin(id, el, size, { name: path });
  ta.focus();
}

function panelsRender() {
  if (!M) return;
  const A = M.HEAPU32, ram = M._rv_ram_ptr();

  /* 系统状态 */
  const sb = (ram + (SYS_SYNC_PA - 0x80000000)) >>> 2;
  if (A[sb] === 0x53595331) {
    sysInfo.nproc = A[sb + 4];
    sysInfo.nfile = A[sb + 5];
    sysInfo.nrun = A[sb + 6];
    /* 追加字段：累计缺页次数。压测要它来判断页池有没有泄漏。 */
    sysInfo.pf = A[sb + 8];
  }

  /* 进程表 */
  const mon = winEls[1] && winEls[1].body;
  if (mon) {
    const base = (ram + (PROC_SYNC_PA - 0x80000000)) >>> 2;
    const rows = [];
    for (let i = 0; i < 8; i++) {
      const b = base + i * 5;
      if (!A[b + 4]) continue;
      const st = ["READY", "RUN", "EXIT", "—", "SUSPEND"][A[b + 1]] || "?";
      rows.push({ pid: A[b], st, pc: "0x" + (A[b + 2] >>> 0).toString(16) });
    }
    const sig = JSON.stringify(rows);
    if (sig !== procSig) {
      procSig = sig;
      let h = '<table class="ptab"><colgroup><col style="width:44px"><col style="width:68px"><col></colgroup>'
        + '<thead><tr><th>PID</th><th>STATE</th><th>PC</th></tr></thead><tbody>';
      for (const r of rows)
        h += '<tr data-pid="' + r.pid + '" data-st="' + r.st + '"'
           + (r.st === "RUN" ? ' class="run"' : '') + '><td>' + r.pid
           + '</td><td>' + r.st + '</td><td>' + r.pc + '</td></tr>';
      h += '</tbody></table>';
      mon.innerHTML = '<div class="pscroll">' + h + '</div>';
    }
    panelRowHeight(mon, rows.length);
    /* 行右键：任务管理器里「结束任务」的位置。
       绑定放在签名比较之外，表格重渲染不需要重绑。 */
    if (!mon.dataset.ctx) {
      mon.dataset.ctx = "1";
      mon.addEventListener("contextmenu", (ev) => {
        const tr = ev.target.closest("tr[data-pid]");
        if (!tr) return;
        ev.preventDefault();
        ev.stopPropagation();
        const pid = +tr.dataset.pid, st = tr.dataset.st;
        const items = [];
        if (st === "SUSPEND") {
          items.push({ label: "恢复", action: () => window.rv.resumeProc(pid) });
        } else {
          items.push({ label: "终止进程", action: () => window.rv.killProc(pid) });
          if (st === "READY") items.push({ label: "挂起", action: () => window.rv.suspendProc(pid) });
        }
        items.push("-");
        items.push({ label: "复制 PID " + pid, action: () => { try { navigator.clipboard.writeText(String(pid)); } catch (e) {} } });
        showCtx(items, ev.clientX, ev.clientY);
      });
    }
  }

  /* 文件表 */
  const fs = winEls[2] && winEls[2].body;
  if (fs) {
    if (!fs.dataset.built) {
      fs.dataset.built = "1";
      const I = (d) => '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"'
        + ' stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
      fs.innerHTML = '<div class="fbar">'
        + '<button data-f="up" data-tip="上一级" aria-label="上一级">' + I('<path d="M8 12.5V4M4.2 7.4L8 3.6l3.8 3.8"/>') + '</button>'
        + '<span class="sep"></span>'
        + '<button data-f="new" data-tip="新建文件" aria-label="新建文件">' + I('<path d="M3.5 2.5h6l3 3v8h-9z"/><path d="M9.5 2.5v3h3"/><path d="M8 8.6v3.2M6.4 10.2h3.2"/>') + '</button>'
        + '<button data-f="mkdir" data-tip="新建文件夹" aria-label="新建文件夹">' + I('<path d="M2.5 4.6h4l1.2 1.6h5.8v7.2h-11z"/><path d="M8 9.2v3M6.5 10.7h3"/>') + '</button>'
        + '<button data-f="rename" data-tip="重命名" aria-label="重命名">' + I('<path d="M2.6 13.4l.9-2.9 7-7 2 2-7 7z"/><path d="M9.5 4.5l2 2"/>') + '</button>'
        + '<button data-f="del" data-tip="删除" aria-label="删除">' + I('<path d="M3.5 5h9"/><path d="M6.5 5V3.4h3V5"/><path d="M5 5l.6 8.6h4.8L11 5"/>') + '</button>'
        + '<span class="sep"></span>'
        + '<button data-f="import" data-tip="导入程序（.elf / .bin）" aria-label="导入程序（.elf / .bin）">' + I('<path d="M8 2.6v7"/><path d="M5 6.6L8 9.6l3-3"/><path d="M3 11.4v2.2h10v-2.2"/>') + '</button>'
        + '</div><div class="fpath"></div><div class="fscroll"></div>';
      bindFilesBar(fs);
    }
    const base = (ram + (FILE_SYNC_PA - 0x80000000)) >>> 2;
    const all = [];
    for (let i = 0; i < 16; i++) {
      const name = readStrAt(ram + (FILE_SYNC_PA - 0x80000000) + i * 40, 24);
      if (!name) continue;
      all.push({ name, size: A[base + i * 10 + 6], dir: A[base + i * 10 + 7] === 1 });
    }
    const rows = all.filter((r) => fsEntryInCwd(r.name));
    const sig = fsCwd + "|" + JSON.stringify(rows);
    if (sig !== fileSig) {
      fileSig = sig;
      const sc = fs.querySelector(".fscroll");
      const upBtn = fs.querySelector('.fbar button[data-f="up"]');
      if (upBtn) upBtn.disabled = !fsCwd;
      let h = '<table class="ftab"><colgroup><col><col style="width:62px"></colgroup>'
        + '<thead><tr><th>NAME</th><th class="r">SIZE</th></tr></thead><tbody>';
      for (const r of rows) {
        const shown = fsCwd ? r.name.slice(fsCwd.length + 1) : r.name;
        h += '<tr data-name="' + esc(r.name) + '" data-dir="' + (r.dir ? "1" : "0") + '">'
           + '<td class="nm">' + (r.dir ? "▸ " : "") + esc(shown) + '</td>'
           + '<td class="r ' + (r.dir ? "dim" : "mono") + '">' + (r.dir ? "—" : r.size) + '</td></tr>';
      }
      if (!rows.length) h += '<tr><td class="dim" colspan="2" style="padding:12px">空目录</td></tr>';
      h += '</tbody></table>';
      sc.innerHTML = h;
      sc.querySelectorAll("tr[data-name]").forEach((tr) => {
        tr.addEventListener("click", () => {
          sc.querySelectorAll("tr.sel").forEach((x) => x.classList.remove("sel"));
          tr.classList.add("sel");
        });
        tr.addEventListener("dblclick", () => openFileByName(tr.dataset.name));
        tr.addEventListener("contextmenu", (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          sc.querySelectorAll("tr.sel").forEach((x) => x.classList.remove("sel"));
          tr.classList.add("sel");
          fileCtx(tr.dataset.name, tr.dataset.dir === "1", ev.clientX, ev.clientY);
        });
      });
    }
    /* 路径栏每帧校正：失败提示不改数据，靠签名比较永远等不到那一次渲染。
       顺带也把「窗口拉大之后路径栏没刷新」这种边角一并兜住。 */
    const pathEl = fs.querySelector(".fpath");
    if (pathEl) {
      const want = filesToastMsg || fsPathText();
      const color = filesToastMsg ? "#F87171" : "";
      if (pathEl.textContent !== want) pathEl.textContent = want;
      if (pathEl.style.color !== color) pathEl.style.color = color;
    }
    /* 行高每帧校正一次（内部有变化才写的短路），窗口拉大拉小都跟得上 */
    panelRowHeight(fs.querySelector(".fscroll"), rows.length, 22, 34, 26);
  }
}

/* 面板行高：行数少就把行拉高，避免窗口下半截一片空。
   上限 40px —— 再高就不像列表而像画廊了。 */
function panelRowHeight(el, n, lo, hi, pad) {
  if (!el) return;
  const H = el.clientHeight;
  if (H <= 0 || !n) return;
  const a = lo == null ? 32 : lo, b = hi == null ? 40 : hi;
  const p = pad == null ? 32 : pad;
  const v = Math.max(a, Math.min(b, (H - p) / n)).toFixed(1) + "px";
  /* 每帧都渲染面板，值没变就不写 style——否则每帧一次样式重算。
     但也不能只在数据变化时写：窗口最大化之后行高得跟着长。 */
  if (el.dataset.rh === v) return;
  el.dataset.rh = v;
  el.style.setProperty("--rh", v);
}

/* ══ 窗口同步：位置 / 尺寸 / 标题 / 焦点 / Dock 指示 ══
   每帧都写 style.left/top/width/height/zIndex 会强制浏览器重算样式，
   实测把吞吐从 10+ M/s 拉到 5 M/s。这里先比签名，真的变了才写。 */
function winSync() {
  if (!winLayer || !M) return;
  const A = M.HEAPU32;
  const base = guestOff(WIN_INFO_PA);
  const osEl = desk();
  const L = deskTransform(osEl.clientWidth, osEl.clientHeight);
  const { scale, ox, oy } = L;

  for (let i = 0; i < WIN_SLOTS; i++) {
    const b = base + i * 11;
    const titleAddr = A[b + 3] >>> 0, focused = A[b + 4], visible = A[b + 5];
    const x = A[b + 6], y = A[b + 7], z = A[b + 8];
    const ww = A[b + 9] || A[b + 1], wh = A[b + 10] || A[b + 2];
    const we = winEls[i];
    if (!we) continue;

    if (!visible || !ww || !wh) {
      if (we.sig !== "hidden") {
        /* 从「可见」变「隐藏」时先播一遍缩放淡出，否则窗口是硬消失的。
           定时器要记住：167ms 内窗口又被打开就得取消，不然会把刚显示的窗口藏起来。 */
        if (we.sig && we.sig !== "hidden" && !we.hideTimer) {
          we.el.classList.add("minimizing");
          we.hideTimer = setTimeout(() => {
            we.hideTimer = 0;
            if (we.sig === "hidden") we.el.style.display = "none";
            we.el.classList.remove("minimizing");
          }, 167);
        } else if (!we.hideTimer) {
          we.el.style.display = "none";
        }
        we.sig = "hidden";
      }
      continue;
    }
    if (we.hideTimer) { clearTimeout(we.hideTimer); we.hideTimer = 0; we.el.classList.remove("minimizing"); }
    const left = (ox + x * scale).toFixed(1);
    const top = (oy + y * scale).toFixed(1);
    const wid = (ww * scale).toFixed(1);
    const hei = (wh * scale).toFixed(1);

    /* 拖动期间位置由宿主说了算；松手后等内核把位置记下来再交还控制权，
       否则下一帧会用内核里的旧坐标把刚拖到的位置覆盖回去（视觉上「跳回」）。 */
    if (we.pending && !we.dragging) {
      const wantL = ox + x * scale, wantT = oy + y * scale;
      if ((Math.abs(wantL - we.px) < 2 && Math.abs(wantT - we.py) < 2)
          || Date.now() > we.pendingUntil) {
        we.pending = false;
      }
    }
    const locked = we.dragging || we.resizing || we.pending;
    const sig = (locked ? "L" : left) + "," + (locked ? "L" : top) + "," + wid + "," + hei + "," + z + "," + focused;
    if (we.sig !== sig) {
      we.sig = sig;
      const s = we.el.style;
      s.display = "flex";
      if (!locked) { s.left = left + "px"; s.top = top + "px"; }
      s.width = wid + "px";
      s.height = hei + "px";
      s.zIndex = 10 + z;
      we.el.classList.toggle("focused", !!focused);
      /* 最大化时圆角归零：Win11 和 GNOME 都是 0px，只有 macOS 的 zoom 保留圆角 */
      we.el.classList.toggle("max", ww >= 800);
    }

    const t = winReadStr(titleAddr, 32);
    const tEl = we.el.querySelector(".win-title");
    if (tEl && tEl.dataset.t !== t) { tEl.dataset.t = t; tEl.textContent = t; }

    const cw = Math.round(ww * scale), ch = Math.round(wh * scale);
    if (we.w !== cw || we.h !== ch) {
      we.w = cw; we.h = ch;
      /* 直接把这帧算出来的尺寸传进去，不让 termLayout 去读 clientWidth：
         刚写完 style 的那一刻它读到的还是旧布局，字号会永远慢一拍。 */
      if (i === 0) termLayout(we.body, true, cw - 2, ch - 32 - 2);
      else panelRowHeight(we.body, we.body.querySelectorAll("tbody tr").length);
    }
  }

  /* Dock 指示条 */
  const box = $("dockApps");
  if (box) {
    const kids = box.children;
    for (let i = 0; i < WIN_SLOTS; i++) {
      const d = kids[i];
      if (!d) continue;
      const on = !!A[base + i * 11 + 5];
      if (d.dataset.on !== String(on)) {
        d.dataset.on = String(on);
        d.classList.toggle("active", on);
      }
    }
  }
}

/* ══ 时钟 / 速率 ══ */
function dockClock() {
  const el = $("clock");
  if (!el) return;
  const n = new Date();
  const p = (v) => String(v).padStart(2, "0");
  const txt = p(n.getHours()) + ":" + p(n.getMinutes());
  if (el.textContent !== txt) el.textContent = txt;
  const dEl = $("clockDate");
  if (dEl) dEl.textContent = (n.getMonth() + 1) + "/" + n.getDate();
  const rEl = $("trayRate");
  if (rEl) rEl.textContent = curRate ? (curRate / 1e6).toFixed(1) + " M/s" : "—";
  const ar = $("aboutRate");
  if (ar) ar.textContent = curRate ? (curRate / 1e6).toFixed(1) + " M/s" : "—";
}

/* ══ 鼠标 → guest ══
   内核的 fb_mouse_pos 靠「事件号变了」来消费一次鼠标事件（e == last_ev 就丢弃）。
   所以这里必须写一个单调递增的序号，而不是每次都写 1 ——
   写 1 的话只有第一次能被读到，之后所有移动和点击都被内核当成重复事件丢掉，
   表现就是窗口拖不动、按钮点不动。 */
let evSeq = 0;
/* 宿主正在自己拖窗口。这个期间 pointermove 仍会冒泡到 #os，
   不挡住的话内核也会按同一批坐标拖同一个窗口，两边互相覆盖。 */
let hostDragActive = false;

function pushMouse(x, y, btn) {
  if (!M) return;
  const wk = (a, v) => M._rv_mem_write32(a, v);
  wk(MOUSE_X, x);
  wk(MOUSE_Y, y);
  wk(MOUSE_BTN, btn);
  evSeq = (evSeq + 1) & 0x7fffffff;
  if (!evSeq) evSeq = 1;
  wk(MOUSE_EV, evSeq);
}

function screenPointerBind() {
  const cv = desk();
  if (!cv) return;

  function toFb(e) {
    const r = cv.getBoundingClientRect();
    const L = deskTransform(r.width, r.height);
    const x = Math.round((e.clientX - r.left - L.ox) / L.scale);
    const y = Math.round((e.clientY - r.top - L.oy) / L.scale);
    return [Math.max(0, Math.min(799, x)), Math.max(0, Math.min(599, y))];
  }

  /* 这些区域是宿主自己画的 UI，点它们绝不能同时给内核发一次点击：
     否则点一下窗口的「关闭」，pointerup 冒泡到 #os 又给内核发了一次
     按下，内核按自己的坐标命中测试把它判成「最大化」——
     表现就是关个窗口却把它最大化了。 */
  /* 这些区域由宿主自己的 DOM 处理交互，不转发给内核，也不阻止默认行为。
     窗口（.win）必须算在内：窗口的拖动、缩放、选中文字都是 DOM 的事，
     以前没排除它，于是点终端时这里 preventDefault 掉 pointerdown，
     浏览器连 mousedown 都不派发了，终端里的字一个也选不中。 */
  const isHostUI = (t) => !!(t && t.closest
    && t.closest("#dock,#drawer,#startMenu,.host-win,.win"));
  let hostUiDown = false;

  cv.addEventListener("pointermove", (e) => {
    if (!M || hostUiDown || hostDragActive) return;
    const [x, y] = toFb(e);
    pushMouse(x, y, e.buttons ? 1 : 0);
  }, { passive: true });

  cv.addEventListener("pointerdown", (e) => {
    if (!M) return;
    if (isHostUI(e.target)) { hostUiDown = true; return; }
    /* 不再 preventDefault、不再抢焦点：
       聚焦改到 pointerup（且只在没有拖选时），否则会把选区清掉。 */
    const [x, y] = toFb(e);
    /* 先补一次抬起，清掉内核可能残留的按下状态，再按下去 */
    pushMouse(x, y, 0);
    setTimeout(() => pushMouse(x, y, 1), 20);
  });

  cv.addEventListener("pointerup", (e) => {
    const wasHost = hostUiDown;
    hostUiDown = false;
    if (!M || wasHost || isHostUI(e.target)) return;
    const [x, y] = toFb(e);
    pushMouse(x, y, 1);
    setTimeout(() => pushMouse(x, y, 0), 60);
  });
}

function focusTerm() {
  const ime = $("ime");
  if (ime) ime.focus();
}

/* ══ UART ══ */
let tailBuf = "";
function sendCmd(cmd) {
  if (!M || !loaded) return;
  for (const b of _enc.encode(cmd + "\r")) M._rv_uart_write(b);
}

const term = $("term");
function appendOut(s) {
  if (quietOut) return;
  term.textContent += s;
  if (term.textContent.length > 40000) term.textContent = term.textContent.slice(-20000);
}

function pumpUart() {
  if (!M) return;
  let n, s = "";
  while ((n = M._rv_uart_read(ubuf, 4096)) > 0) {
    s += _uartDec.decode(M.HEAPU8.subarray(ubuf, ubuf + n), { stream: true });
    total += n;
  }
  if (s) {
    appendOut(s);
    tailBuf = (tailBuf + s).slice(-160);
    sniff(s);
  }
  if (speed > 1 && tailBuf.indexOf("rvsh>") >= 0) speed = 1;
  const tx = $("txInfo");
  if (tx) tx.textContent = total.toLocaleString() + " B";
}

/* ══ 状态嗅探（从 UART 里认 JSON，零侵入）══ */
let sniffBuf = "";
const capsSeen = new Map();

function sniff(s) {
  sniffBuf = (sniffBuf + s).slice(-12000);

  const allPs = [...sniffBuf.matchAll(/\{"nproc":\d+,"procs":\[[^\]]*\]\}/g)];
  if (allPs.length) {
    try { renderProcs(JSON.parse(allPs[allPs.length - 1][0])); } catch (e) {}
  }

  const re = /\{"cap":"([^"]+)","usage":"([^"]*)"/g;
  let m, before = capsSeen.size;
  while ((m = re.exec(sniffBuf)) !== null) capsSeen.set(m[1], m[2]);
  if (capsSeen.size !== before) renderCaps();

  const evRe = /^(-?\d+) (-?\d+) (spawn|exit|ecall|restore|reset|snapshot|plan|apply|sbrk|fork|setreg|getpid|yield) (\S+) (\S+) (-?\d+) code=(\d+)/;
  const evRows = [];
  for (const line of sniffBuf.split("\n")) {
    const mm = line.trim().match(evRe);
    if (mm) evRows.push(mm);
  }
  if (evRows.length) renderEvents(evRows.reverse());

  const allFs = [...sniffBuf.matchAll(/\{"files":\[[^\]]*\]\}/g)];
  if (allFs.length) {
    try { renderFiles(JSON.parse(allFs[allFs.length - 1][0])); } catch (e) {}
  }

  const allSn = [...sniffBuf.matchAll(/\{"snapshots":\[[^\]]*\]\}/g)];
  const allPl = [...sniffBuf.matchAll(/\{"plans":\[[^\]]*\]\}/g)];
  if (allSn.length || allPl.length) {
    let sj = null, pj = null;
    try { if (allSn.length) sj = JSON.parse(allSn[allSn.length - 1][0]); } catch (e) {}
    try { if (allPl.length) pj = JSON.parse(allPl[allPl.length - 1][0]); } catch (e) {}
    renderSnaps(sj, pj);
  }
}

function renderEvents(rows) {
  const bySeq = new Map();
  for (const r of rows) bySeq.set(r[1], r);
  const uniq = [...bySeq.values()].sort((a, b) => Number(b[1]) - Number(a[1]));
  const cls = (t) => (t === "spawn" ? "spawn" : t === "exit" ? "exit" : "ecall");
  let h = "";
  for (const r of uniq.slice(0, 16))
    h += '<div class="ev ' + cls(r[3]) + '"><span class="t">' + r[1] + '</span>'
       + '<span>' + r[2] + '</span><span class="a">' + r[3] + '</span></div>';
  const el = $("events");
  if (el) el.innerHTML = h || '<div class="hint">无</div>';
}

function renderSnaps(snaps, plans) {
  let h = "";
  if (snaps && snaps.snapshots)
    for (const x of snaps.snapshots) h += '<div class="snap"><b>快照 ' + x.id + '</b> @' + x.evt_seq + '</div>';
  if (plans && plans.plans)
    for (const x of plans.plans) h += '<div class="snap"><b>计划 ' + x.id + '</b> ' + x.intent + ' ' + (x.arg || "") + '</div>';
  const el = $("snaps");
  if (el) el.innerHTML = h || '<div class="hint">无</div>';
}

function renderFiles(o) {
  const list = (o && o.files) || [];
  const el = $("files");
  if (!el) return;
  if (!list.length) { el.innerHTML = '<div class="hint">空</div>'; return; }
  let h = "";
  for (const f of list) {
    const isDir = f.type === "dir";
    h += '<div class="frow"><b>' + (isDir ? "▸ " : "") + f.name + '</b>'
       + '<span>' + (isDir ? "dir" : f.size + " B") + '</span></div>';
  }
  el.innerHTML = h;
}

function renderProcs(o) {
  let h = '<div class="prow ph"><span>PID</span><span>状态</span><span>PC</span><span>轮</span></div>';
  for (const p of o.procs) {
    if (p.state === "UNUSED") continue;
    const cls = p.state === "RUN" ? "run" : p.state === "READY" ? "ready" : "exit";
    h += '<div class="prow ' + cls + '"><span>' + p.pid + '</span><span>' + p.state + '</span>'
       + '<span>' + p.pc + '</span><span>' + p.nrun + '</span></div>';
  }
  const el = $("procs");
  if (el) el.innerHTML = h;
}

function renderCaps() {
  if (!capsSeen.size) return;
  let h = "";
  for (const [name, v] of capsSeen) h += '<div class="cap"><b>' + name + '</b><span>' + v + '</span></div>';
  const el = $("caps");
  if (el) el.innerHTML = h;
}

/* ══ 执行引擎 ══ */
function stepBudget(ms) {
  const t0 = performance.now();
  let done = 0;
  while (performance.now() - t0 < ms) {
    for (let k = 0; k < 400; k++) {
      const r = M._rv_step();
      if (r !== 0) return { halted: r, n: done };
      done++;
    }
  }
  return { halted: 0, n: done };
}

function tick() {
  if (!M || !loaded || !ticking) { ticking = false; return; }
  /* 常驻档每帧给 3ms：1ms 只够维持一个「能响应」的 shell，
     跑 run/fork 这类用户程序时明显发钝。3ms 约 18% 单核，交互依然跟手。 */
  const res = stepBudget(speed >= 2 ? 45 : 6);
  pumpUart();
  winSync();
  termRender();
  panelsRender();
  dockClock();
  frameNo++;
  if (speed > 1 && frameNo > 45) speed = 1;
  if (frameNo % 10 === 0) render();
  if (res.halted !== 0) {
    halt();
    setProgress(100, "结束");
    render();
    return;
  }
  tm = requestAnimationFrame(tick);
}

function startTicking() {
  if (!M || !loaded) return;
  speed = 2;
  running = true;
  const br = $("bRun"), bs = $("bStep");
  if (br) br.disabled = true;
  if (bs) bs.disabled = true;
  if (ticking) return;
  ticking = true;
  tm = requestAnimationFrame(tick);
}

function halt() {
  running = false;
  ticking = false;
  if (tm) { cancelAnimationFrame(tm); tm = null; }
  if (loaded) {
    const br = $("bRun"), bs = $("bStep");
    if (br) br.disabled = false;
    if (bs) bs.disabled = false;
  }
}

/* ══ 寄存器面板 ══ */
let prev = {}, regEditing = false;
function render() {
  if (!M || !loaded) return;
  const cy = M._rv_cycles() >>> 0;
  const now = performance.now();
  if (prevCy && now > prevCyT + 400) {
    curRate = (cy - prevCy) / ((now - prevCyT) / 1000);
    prevCy = cy; prevCyT = now;
  } else if (!prevCy) { prevCy = cy; prevCyT = now; }
  /* 抽屉收着的时候这些 DOM 一个都看不见，没必要每 10 帧重建 32 行 */
  if (!document.body.classList.contains("drawer")) return;

  const vCy = $("vCy");
  if (vCy) vCy.textContent = cy.toLocaleString();
  const vIn = $("vIn");
  if (vIn) vIn.textContent = (curRate / 1e6).toFixed(1) + " M/s";
  const vPc = $("vPc"), vPv = $("vPv");
  if (vPc) vPc.textContent = hx(M._rv_pc());
  if (vPv) vPv.textContent = PRIV[M._rv_priv()] ?? "?";

  let r = "";
  for (let i = 0; i < 32; i++) {
    const v = M._rv_reg(i) >>> 0;
    const chg = (i !== 0 && prev[i] !== undefined && prev[i] !== v) ? " chg" : "";
    r += '<div class="rg' + chg + '" data-r="' + i + '"><span class="n">' + ABI[i]
       + '</span><span class="v">' + hx(v) + '</span></div>';
    prev[i] = v;
  }
  const regEl = $("reg");
  if (regEl && !regEditing && regEl.dataset.sig !== r) {
    regEl.dataset.sig = r;
    regEl.innerHTML = r;
  }
}

/* ══ 启动 ══ */
function boot(bytes, name) {
  if (!M) return;
  setProgress(32, "正在装载内核…");
  halt();
  M._rv_reset(); M._rv_uart_clear();
  const p = M._malloc(bytes.length);
  M.HEAPU8.set(bytes, p);
  const ok = M._rv_load(p, bytes.length);
  M._free(p);
  if (!ok) { setProgress(0, "镜像加载失败"); return; }
  setProgress(62, "内核已装载，启动 shell…");
  loaded = true; total = 0;
  sniffBuf = ""; capsSeen.clear(); tailBuf = ""; quietOut = false;
  procSig = ""; fileSig = "";
  ["procs", "events", "snaps", "caps", "files"].forEach((id) => {
    const e = $(id);
    if (e) e.innerHTML = '<div class="hint">读取中…</div>';
  });
  ["bRun", "bStop", "bStep", "bReset"].forEach((id) => { const e = $(id); if (e) e.disabled = false; });
  startTicking();

  /* 内核已经打好 MOTD 并停在自己的提示符上，这里只补一次墙钟时间。
     @ 前缀的命令对窗口网格零痕迹，所以不会多出空行或重复提示符。 */
  setTimeout(() => {
    sendCmd("@manifest");
    sendCmd("@settime " + Math.floor(Date.now() / 1000 - new Date().getTimezoneOffset() * 60));
  }, 800);
}

async function bootUrl(u, name) {
  setProgress(12, "正在下载镜像…");
  u = u + (u.includes("?") ? "&" : "?") + "t=" + Date.now();
  try {
    const r = await fetch(u);
    if (!r.ok) throw 0;
    setProgress(26, "镜像就绪…");
    boot(new Uint8Array(await r.arrayBuffer()), name);
  } catch (e) {
    setProgress(0, "镜像不可用");
  }
}

/* 调试抽屉 */
function toggleDrawer(force) {
  const on = force === undefined ? !document.body.classList.contains("drawer") : force;
  document.body.classList.toggle("drawer", on);
  if (on) refreshPanels();
}

function refreshPanels() {
  if (!M || !loaded) return;
  quietOut = true;
  sendCmd("@ps");
  setTimeout(() => sendCmd("@log last 8"), 260);
  setTimeout(() => sendCmd("@snaps"), 520);
  setTimeout(() => sendCmd("@plans"), 780);
  setTimeout(() => sendCmd("@ls"), 1040);
  setTimeout(() => { quietOut = false; }, 1600);
}

/* ══ 终端：查找 / 粘贴 / 右键菜单 / 链接 ══
   这些是 Windows Terminal 的默认能力，以前一个都没有：
   复制靠手选、粘贴靠浏览器默认、查找不存在、链接不能点。 */
function termPaste(txt) {
  if (!M || !txt) return;
  const lines = txt.replace(/\r\n/g, "\n").split("\n");
  /* 多行粘贴警告：Windows Terminal 默认 multiLinePasteWarning=true，
     因为往 shell 里粘多行很容易把半截命令直接执行掉。 */
  if (lines.length > 1) {
    const ok = window.confirm("要粘贴 " + lines.length + " 行内容吗？\n\n"
      + txt.slice(0, 300) + (txt.length > 300 ? "…" : ""));
    if (!ok) return;
  }
  for (const b of _enc.encode(txt)) M._rv_uart_write(b);
  if (!ticking) startTicking();
}
async function termPasteClipboard() {
  try {
    const txt = await navigator.clipboard.readText();
    termPaste(txt);
  } catch (_) {
    /* 没有剪贴板权限：退回让用户手动 Ctrl+V */
  }
}
function termFind(q) {
  const lines = [...document.querySelectorAll(".term-line")];
  lines.forEach((l) => l.classList.remove("hit"));
  const nEl = document.querySelector(".term-find .tf-n");
  if (!q) { if (nEl) nEl.textContent = "0"; return; }
  let n = 0, first = null;
  for (const l of lines) {
    if (l.textContent.includes(q)) {
      l.classList.add("hit");
      n++;
      if (!first) first = l;
    }
  }
  if (nEl) nEl.textContent = String(n);
  if (first) first.scrollIntoView({ block: "center" });
}
function termFindOpen() {
  const dom = document.querySelector(".term-dom");
  if (!dom || !dom.parentElement) return;
  if (dom.parentElement.querySelector(".term-find")) {
    dom.parentElement.querySelector(".term-find input").focus();
    return;
  }
  const bar = document.createElement("div");
  bar.className = "term-find";
  bar.innerHTML = '<input placeholder="在终端里查找…" /><span class="tf-n">0</span>'
    + '<button title="关闭">×</button>';
  dom.parentElement.insertBefore(bar, dom);
  const inp = bar.querySelector("input");
  inp.oninput = () => termFind(inp.value);
  inp.onkeydown = (e) => {
    if (e.key === "Escape") { bar.remove(); termFind(""); focusTerm(); e.preventDefault(); }
  };
  bar.querySelector("button").onclick = () => { bar.remove(); termFind(""); focusTerm(); };
  inp.focus();
}

/* 终端右键菜单 */
document.addEventListener("contextmenu", (e) => {
  const dom = e.target && e.target.closest && e.target.closest(".term-dom");
  if (!dom) return;
  e.preventDefault();
  e.stopPropagation();
  const sel = String(window.getSelection());
  showCtx([
    { label: "复制", hint: "Ctrl+Shift+C", disabled: !sel,
      action: () => { if (sel) navigator.clipboard.writeText(sel).catch(() => {}); } },
    { label: "粘贴", hint: "Ctrl+Shift+V", action: () => termPasteClipboard() },
    { label: "全选", hint: "Ctrl+Shift+A",
      action: () => {
        const r = document.createRange();
        r.selectNodeContents(dom);
        const s2 = window.getSelection();
        s2.removeAllRanges(); s2.addRange(r);
      } },
    { sep: true },
    { label: "查找…", hint: "Ctrl+Shift+F", action: () => termFindOpen() },
    { label: "清屏", action: () => { if (M) window.rv.cmd("clear"); } },
  ]);
}, true);

/* Ctrl+点击链接：Windows Terminal 是 Ctrl+点击，macOS 是 Cmd+点击 */
document.addEventListener("click", (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  const line = e.target && e.target.closest && e.target.closest(".term-line");
  if (!line) return;
  const m = line.textContent.match(/https?:\/\/[^\s"'<>]+/);
  if (!m) return;
  e.preventDefault();
  window.open(m[0], "_blank", "noopener,noreferrer");
}, true);

/* ══ 窗口切换器（Alt+`）══
   浏览器拿不到系统级 Alt+Tab，所以用 Alt+`——Windows 里它就是
   「切换同一应用的窗口」，语义对得上：按住 Alt 连按 ` 循环，松开应用。 */
let swList = [], swIdx = 0, swOn = false;
function swRender() {
  const el = $("switcher");
  if (!el) return;
  el.innerHTML = swList.map((w, i) =>
    '<div class="sw-item' + (i === swIdx ? " sel" : "") + '">'
    + (WIN_ICONS[w.id] || "") + '<span>' + esc(w.title || ("窗口 " + w.id)) + "</span></div>").join("");
}
function swShow() {
  const wins = window.rv.state.wins.filter((w) => w.visible);
  if (!wins.length) return;
  swList = wins;
  swIdx = wins.length > 1 ? 1 : 0;     /* 默认选下一个，和 Alt+Tab 手感一致 */
  swOn = true;
  swRender();
  $("switcher").classList.add("on");
}
function swStep(d) {
  if (!swOn || !swList.length) return;
  swIdx = (swIdx + d + swList.length) % swList.length;
  swRender();
}
function swApply() {
  if (!swOn) return;
  swOn = false;
  $("switcher").classList.remove("on");
  const w = swList[swIdx];
  if (w) window.rv.focusWin(w.id);
}

/* ══ 输入 ══ */
const ime = $("ime");
document.addEventListener("input", (e) => {
  if (!loaded || !M) return;
  if (!e.target || e.target.id !== "ime") return;
  if (e.isComposing || e.target.isComposing) return;
  const txt = e.target.value;
  if (!txt) return;
  e.target.value = "";
  for (const b of _enc.encode(txt)) M._rv_uart_write(b);
  if (!ticking) startTicking();
});

document.addEventListener("paste", (e) => {
  if (!loaded || !M) return;
  const t = e.clipboardData || window.clipboardData;
  if (!t) return;
  const txt = t.getData("text");
  if (!txt) return;
  e.preventDefault();
  for (const b of _enc.encode(txt)) M._rv_uart_write(b);
  if (!ticking) startTicking();
});

/* 这些是宿主的可聚焦控件：键盘焦点在它们身上时，按键交给浏览器/控件自己处理，
   不要再送进 guest 终端 —— 否则 Tab 永远移不动焦点，Enter 会既开应用又敲回车。 */
const UI_FOCUS = ".dicon,.dock-app,.dock-btn,.sm-tile,.sm-ri,.win-ctl,#startMenu";

document.addEventListener("keyup", (e) => {
  /* 松开 Alt 才应用，和 Alt+Tab 一致：按住循环，松手切过去 */
  if (e.key === "Alt" && swOn) swApply();
});

document.addEventListener("keydown", (e) => {
  if (!loaded || !M) return;
  if (e.key === "F12") { toggleDrawer(); e.preventDefault(); return; }
  /* Alt+` 窗口切换器。用 e.code 而不是 e.key：不同键盘布局下 ` 的字符不一样。 */
  if (e.altKey && e.code === "Backquote") {
    e.preventDefault();
    if (swOn) swStep(e.shiftKey ? -1 : 1); else swShow();
    return;
  }
  if (e.key === "Escape") { closeStartMenu(); return; }
  const tag = e.target && e.target.tagName;
  if (e.target && e.target.id !== "ime" && (tag === "INPUT" || tag === "TEXTAREA")) return;
  if (e.target && e.target.closest && e.target.closest(UI_FOCUS)) return;

  /* Ctrl+W 关闭 / Ctrl+M 最小化 当前窗口 */
  if (e.ctrlKey && !e.altKey && !e.metaKey) {
    const k = e.key.toLowerCase();
    if (k === "w" || k === "m") {
      e.preventDefault();
      const ws = window.rv.state.wins;
      const i = ws.findIndex((w) => w.focused && w.visible);
      if (i >= 0) {
        const el = winEls[i] && winEls[i].el;
        if (el) {
          el.classList.add(k === "w" ? "closing" : "minimizing");
          setTimeout(() => {
            el.classList.remove("closing", "minimizing");
            sendWinCmd(i * 10 + (k === "w" ? 0 : 1));
          }, 167);
        }
      }
      return;
    }
  }

  /* Alt+方向：Win11 的 Win+方向 被浏览器占用，这里换成 Alt。
     ←/→ 半屏，↑ 最大化，↓ 还原到默认尺寸。 */
  if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "top", ArrowDown: "restore" };
    const z = map[e.key];
    if (z) {
      e.preventDefault();
      const ws = window.rv.state.wins;
      const i = ws.findIndex((w) => w.focused && w.visible);
      if (i >= 0) {
        if (z === "restore") sendWinCmd(i * 10 + 6);
        else setWinRect(i, ...SNAP[z]);
      }
      return;
    }
  }

  /* 终端快捷键。
     注意 Chrome 自己占了一批组合键：Ctrl+Shift+A 是「搜索标签页」、
     Ctrl+Shift+V 是「粘贴为纯文本」，网页根本收不到。
     所以全选和查找改用 Ctrl+A / Ctrl+F（终端里这两个键没有别的用途）。 */
  if (e.ctrlKey && !e.altKey && !e.metaKey) {
    const k = e.key.toLowerCase();
    if (k === "a" && !e.shiftKey) {
      e.preventDefault();
      const dom = document.querySelector(".term-dom");
      if (dom) {
        const r = document.createRange();
        r.selectNodeContents(dom);
        const s2 = window.getSelection();
        s2.removeAllRanges(); s2.addRange(r);
      }
      return;
    }
    if (k === "f" && !e.shiftKey) { e.preventDefault(); termFindOpen(); return; }
    if (k === "c" && e.shiftKey) {
      e.preventDefault();
      const sel = String(window.getSelection());
      if (sel) navigator.clipboard.writeText(sel).catch(() => {});
      return;
    }
    if (k === "v" && e.shiftKey) { e.preventDefault(); termPasteClipboard(); return; }
  }
  if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
    /* 有选区时 Ctrl+C 是复制，没有选区才是中断——和 Windows Terminal 一致。
       以前无条件发 0x03，用户想复制终端里的文字永远复制不到。 */
    const sel = window.getSelection();
    if (sel && String(sel).length > 0) return;   /* 交给浏览器复制 */
    M._rv_uart_write(3); e.preventDefault(); return;
  }
  if (e.key === "Enter") { M._rv_uart_write(13); e.preventDefault(); }
  else if (e.key === "Backspace") { M._rv_uart_write(127); e.preventDefault(); }
  else if (e.target && e.target.id === "ime") { return; }   /* 普通字符走 input 事件 */
  else if (e.key.length >= 1 && [...e.key].length === 1) {
    for (const b of _enc.encode(e.key)) M._rv_uart_write(b);
    e.preventDefault();
  } else return;
  if (!ticking) startTicking();
});

/* 点终端窗口时把焦点交给输入法入口。
   两个坑都要躲：
   1) 不能在 pointerdown 就 focus —— 浏览器会立刻清掉正在拖出来的选区；
   2) pointerup 的那一刻选区还没落定，直接读 getSelection() 会读到空，
      于是被当成单击又 focus 一次，照样清掉。
   所以：记下按下位置，抬起时位移超过 3px 就认定是拖选；并且延后一帧再判断。 */
let termDownX = -1, termDownY = -1;
document.addEventListener("pointerdown", (e) => {
  if (!e.target.closest(".term-dom")) { termDownX = -1; return; }
  termDownX = e.clientX; termDownY = e.clientY;
}, true);
document.addEventListener("pointerup", (e) => {
  if (!e.target.closest(".term-dom")) return;
  const dragged = termDownX >= 0 &&
    (Math.abs(e.clientX - termDownX) > 3 || Math.abs(e.clientY - termDownY) > 3);
  termDownX = -1;
  setTimeout(() => {
    if (dragged) return;                        /* 拖选过，别抢焦点 */
    const sel = window.getSelection();
    if (sel && String(sel).length > 0) return;
    focusTerm();
  }, 0);
}, true);

/* ══ 调试面板按钮 ══ */
try {
  $("bKernel").onclick = () => bootUrl("images/kernel.elf", "mini-kernel");
  $("bTest").onclick = () => bootUrl("images/rv32ui-p-add", "rv32ui-p-add");
  $("bUpload").onclick = () => $("file").click();
  $("file").onchange = (e) => {
    const f = e.target.files[0];
    if (f) f.arrayBuffer().then((b) => boot(new Uint8Array(b), f.name));
  };
  $("bRun").onclick = startTicking;
  $("bStop").onclick = () => { halt(); pumpUart(); };
  $("bStep").onclick = () => {
    if (!loaded) return;
    const r = M._rv_step();
    if (r !== 0) halt();
    pumpUart(); render();
  };
  $("bReset").onclick = () => {
    halt(); M._rv_reset(); M._rv_uart_clear(); prev = {}; total = 0;
    render();
  };
  $("reg").onclick = (e) => {
    const d = e.target.closest(".rg");
    if (!d || !M) return;
    const i = +d.dataset.r, cur = M._rv_reg(i) >>> 0;
    if (i === 0) return;
    const inp = document.createElement("input");
    regEditing = true;
    inp.value = hx(cur);
    d.querySelector(".v").replaceWith(inp);
    inp.focus(); inp.select();
    const done = () => {
      const v = parseInt(inp.value, 16);
      regEditing = false;
      if (!isNaN(v)) M._rv_set_reg(i, v >>> 0);
      render();
    };
    inp.onblur = done;
    inp.onkeydown = (k) => {
      if (k.key === "Enter") inp.blur();
      if (k.key === "Escape") { inp.value = hx(cur); inp.blur(); }
    };
  };
} catch (e) { console.warn("debug panel bind:", e); }

/* ══ AI 操控接口 ══
   目标不是「人类能点」，而是「AI 能读、能改、能验证」。
   这里把内核发布的状态整理成可直接消费的对象。 */
window.rv = {
  get ready() { return !!(M && loaded); },

  /* 宿主侧的全部可见状态。设计时就该把这些做成可读接口，
     否则「点一下有没有反应」只能靠截图肉眼判断，回归测试写不出来。 */
  get ui() {
    const on = (id) => { const e = $(id); return !!(e && e.classList.contains("on")); };
    const disp = (id) => { const e = $(id); return e ? getComputedStyle(e).display !== "none" : false; };
    const hostWins = [...document.querySelectorAll(".host-win")].map((w) => ({
      title: w.querySelector(".win-title").textContent,
      visible: getComputedStyle(w).display !== "none",
    }));
    const ctx = $("ctxMenu");
    return {
      booted: !$("boot"),
      drawer: document.body.classList.contains("drawer"),
      startMenu: !!$("startMenu"),
      trayPanel: on("trayPanel"),
      snapPicker: on("snapPicker"),
      snapGhost: on("snapGhost"),
      ctxMenu: ctx && ctx.classList.contains("on")
        ? [...ctx.querySelectorAll(".ctx-item")].map((e) => e.textContent) : null,
      tip: on("tip") ? $("tip").textContent : null,
      hostWins,
      dockActive: [...document.querySelectorAll(".dock-app")].map((e) => e.classList.contains("active")),
      iconCount: document.querySelectorAll(".dicon").length,
      selectedIcons: [...document.querySelectorAll(".dicon.sel")].map((e) => e.dataset.app),
      focusedWindow: (() => {
        for (let i = 0; i < 3; i++) {
          const el = document.querySelectorAll(".win")[i];
          if (el && el.classList.contains("focused")) return i;
        }
        return -1;
      })(),
      snapClasses: [0, 1, 2].map((i) => {
        const el = document.querySelectorAll(".win")[i];
        return el ? el.className.split(" ").filter((c) => c.startsWith("snap-")) : [];
      }),
      /* 必须是 getter：写成 IIFE 的话只在对象字面量求值时算一次，
         之后窗口怎么缩放都返回初始字号（实测永远是 18）。 */
      get termFontSize() {
        const e = document.querySelector(".term-dom");
        return e ? parseFloat(getComputedStyle(e).fontSize) : null;
      },
      wallStyle: ($("wall") ? $("wall").style.background.slice(0, 24) : ""),
      iconsVisible: disp("icons"),
      clock: $("clock") ? $("clock").textContent : null,
      rate: curRate,
    };
  },

  /* 让测试能直接驱动 UI，而不必模拟鼠标轨迹 */
  ui_open(id) { launch(id); return true; },
  ui_startMenu(open) { if (open === undefined) open = !$("startMenu"); if (open) openStartMenu(); else closeStartMenu(); return !!$("startMenu"); },
  ui_drawer(open) { toggleDrawer(open); return document.body.classList.contains("drawer"); },
  ui_tray(open) { if (open) trayPanelShow(); else trayPanelHide(); return $("trayPanel").classList.contains("on"); },
  ui_snapPicker(winIdx) { snapPickerShow(winIdx, document.querySelectorAll(".win")[winIdx].querySelector(".win-ctl .max")); return $("snapPicker").classList.contains("on"); },
  ui_ctx(items, x, y) { showCtx(items, x, y); return $("ctxMenu").classList.contains("on"); },
  ui_pickLayout(winIdx, layoutIdx, cellIdx) {
    const cells = SNAP_LAYOUTS[layoutIdx];
    if (!cells || !cells[cellIdx]) return false;
    const [x, y, w, h] = cells[cellIdx];
    setWinRect(winIdx, Math.round(x * 8), Math.round(y * 6), Math.round(w * 8), Math.round(h * 6));
    if (M) sendWinCmd(winIdx * 10 + 5);   /* 选完布局把窗口提到最前 */
    return true;
  },
  ui_clickIcon(app) { const e = document.querySelector('.dicon[data-app="' + app + '"]'); if (e) { e.click(); return true; } return false; },
  ui_dblIcon(app) { const e = document.querySelector('.dicon[data-app="' + app + '"]'); if (e) { e.dispatchEvent(new MouseEvent("dblclick", { bubbles: true })); return true; } return false; },
  ui_dblFile(name) {
    const tr = [...document.querySelectorAll("tr[data-name]")].find((r) => r.dataset.name === name);
    if (!tr) return false;
    tr.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
    return true;
  },
  ui_winBtn(idx, which) {
    const el = document.querySelectorAll(".win")[idx];
    const b = el && el.querySelector(".win-ctl ." + which);
    if (!b) return false;
    b.click();
    return true;
  },
  /* zone 除了 SNAP 里的 8 种，还接受 "restore"：还原到该窗口的默认尺寸。
     应用布局的同时把窗口提到最前 —— 真实系统里选完布局，那个窗口就是焦点窗口，
     否则用户点完布局发现窗口被别的窗口盖住了。 */
  focusWin(idx) {
    if (!M) return false;
    if (idx < 0 || idx >= WIN_SLOTS) return false;
    sendWinCmd(idx * 10 + 5);
    return true;
  },
  ui_snapTo(idx, zone) {
    if (zone === "restore") { if (M) sendWinCmd(idx * 10 + 6); return true; }
    if (!SNAP[zone]) return false;
    setWinRect(idx, ...SNAP[zone]);
    if (M) sendWinCmd(idx * 10 + 5);
    return true;
  },
  get state() {
    if (!M || !loaded) return { ready: false };
    const A = M.HEAPU32, ram = M._rv_ram_ptr();
    const wins = [], procs = [], files = [];
    for (let i = 0; i < 3; i++) {
      const b = (ram + (WIN_INFO_PA - 0x80000000)) >>> 2;
      const o = b + i * 11;
      wins.push({
        id: i, title: winReadStr(A[o + 3], 32), focused: !!A[o + 4], visible: !!A[o + 5],
        x: A[o + 6], y: A[o + 7], z: A[o + 8], w: A[o + 9], h: A[o + 10],
      });
    }
    const pb = (ram + (PROC_SYNC_PA - 0x80000000)) >>> 2;
    for (let i = 0; i < 5; i++) {
      if (!A[pb + i * 5 + 4]) continue;
      procs.push({ pid: A[pb + i * 5],
                   state: ["READY", "RUN", "EXIT", "UNUSED", "SUSPEND"][A[pb + i * 5 + 1]] || "?", 
                   pc: hx(A[pb + i * 5 + 2]) });
    }
    for (let i = 0; i < 16; i++) {
      const name = readStrAt(ram + (FILE_SYNC_PA - 0x80000000) + i * 40, 24);
      if (name) files.push({ name, size: A[(ram + (FILE_SYNC_PA - 0x80000000)) / 4 + i * 10 + 6] });
    }
    return {
      mem: { faults: (() => { const sb = (ram + (SYS_SYNC_PA - 0x80000000)) >>> 2; return A[sb] === 0x53595331 ? A[sb + 8] : 0; })() },
      ready: true, wins, procs, files,
      term: termEls ? termEls.map((e) => e.textContent) : [],
      rate: curRate, cycles: M._rv_cycles() >>> 0, pc: hx(M._rv_pc()),
    };
  },
  type(s) { if (!M || !loaded) return false; for (const b of _enc.encode(s)) M._rv_uart_write(b); if (!ticking) startTicking(); return true; },
  cmd(s) { if (!M || !loaded) return false; sendCmd(s); return true; },
  click(x, y) {
    if (!M) return false;
    pushMouse(x, y, 0);
    setTimeout(() => pushMouse(x, y, 1), 20);
    setTimeout(() => pushMouse(x, y, 0), 110);
    return true;
  },
  launch(id) { launch(id); return true; },

  /* ── 文件与进程操作：图形界面与 AI 走同一套入口 ── */
  fsWrite(name, text) { return hostCmd(1, name, "", 0, text == null ? "" : String(text)); },
  fsRemove(name) { return hostCmd(2, name, "", 0, null); },
  fsRename(from, to) { return hostCmd(3, from, to, 0, null); },
  fsMkdir(name) { return hostCmd(4, name, "", 0, null); },
  fsRead(name) {
    return hostCmd(8, name, "", 0, null).then((rc) => {
      if (rc !== 0) return null;
      const i = guestOff(HCMD_PA);
      const len = M.HEAPU32[i + 4];
      const off = guestByte(HCMD_DATA_PA);
      return _dec.decode(M.HEAPU8.subarray(off, off + len));
    });
  },
  killProc(pid) { return hostCmd(5, "", "", pid, null); },
  suspendProc(pid) { return hostCmd(6, "", "", pid, null); },
  resumeProc(pid) { return hostCmd(7, "", "", pid, null); },
  get fsCwd() { return fsCwd; },
  fsChdir(path) {
    /* 不能进文件、不能进不存在的路径：以前直接赋值，
       路径栏会显示 /readme.txt 这种不存在的位置，列表空、退不回来。 */
    const p = String(path || "").replace(/^\/+/, "").replace(/\/+$/, "");
    if (p && !fsIsDir(p)) return fsCwd;
    fsCwd = p;
    fileSig = "";
    panelsRender();
    return fsCwd;
  },
  openFile(name) { openFileByName(name); return true; },
  closeWin(i) { if (M) sendWinCmd(i * 10 + 0); },
  focusWin(i) { if (M) sendWinCmd(i * 10 + 5); },
  drawer(on) { toggleDrawer(on); },
};

/* ══ 宿主 → 内核控制块 ══
   图形界面里的「新建 / 删除 / 重命名 / 结束进程」不能靠往 UART 敲字符：
   多行内容传不了、会把命令回显进终端、还没法传二进制。
   内核在 0x83FFC000 等一条结构化命令，数据走 0x83FFD000。
   每个操作返回 Promise，内核写回 rc 后 resolve。 */
const HCMD_PA = 0x83FFC000, HCMD_DATA_PA = 0x83FFD000;
const HCMD_DATA_MAX = 4096, HCMD_MAGIC = 0x48434D44;
const HCMD_HDR = 24;            /* magic seq op a0 len rc，各 4 字节 */
let hcmdSeq = 0;

function hostCmd(op, p0, p1, a0, data) {
  return new Promise((resolve, reject) => {
    if (!M) return reject(new Error("模拟器未就绪"));
    const baseW = guestOff(HCMD_PA), baseB = guestByte(HCMD_PA);
    const A = M.HEAPU32, B = M.HEAPU8;
    const nameOff = baseB + HCMD_HDR;
    const put = (str, off) => {
      B.fill(0, off, off + 64);
      const b = _enc.encode(str || "");
      for (let i = 0; i < Math.min(b.length, 63); i++) B[off + i] = b[i];
    };
    put(p0, nameOff);
    put(p1, nameOff + 64);
    let len = 0;
    if (data != null) {
      const b = _enc.encode(data);
      if (b.length > HCMD_DATA_MAX) {
        return reject(new Error("内容 " + b.length + " 字节，超过单次写入上限 " + HCMD_DATA_MAX));
      }
      len = b.length;
      B.set(b, guestByte(HCMD_DATA_PA));
    }
    const i = baseW;
    A[i] = 0;                     /* 先摘掉 magic，避免内核读到写了一半的命令 */
    A[i + 1] = ++hcmdSeq;
    A[i + 2] = op;
    A[i + 3] = a0 >>> 0;
    A[i + 4] = len;
    A[i + 5] = 0xFFFFFFFF;
    A[i] = HCMD_MAGIC;
    const t0 = Date.now();
    const tick = () => {
      if (!M) return reject(new Error("模拟器已卸载"));
      if (A[i] !== HCMD_MAGIC) return resolve(A[i + 5] >>> 0);
      if (Date.now() - t0 > 4000) return reject(new Error("内核没有响应"));
      setTimeout(tick, 16);
    };
    setTimeout(tick, 16);
  });
}

/* ══ 启动序列 ══ */
function startRvsim() {
  let skipBoot = false;
  try { skipBoot = localStorage.getItem("rvsim.skipBoot") === "1"; } catch (e) {}
  if (skipBoot) { const b = $("boot"); if (b) b.remove(); }
  createRvsim().then((m) => {
    M = m;
    window.__rvsim = m;
    ubuf = m._malloc(4096);
    iconsRender();
    dockRender();
    winInit();
    /* 壁纸默认值写在 CSS 里，状态读不出来。开机就把它落成 inline style，
       宿主和自动化都能直接读到当前用的是哪一档。 */
    try { applyWallpaper(+(localStorage.getItem("rvsim.wall") || 0), false); }
    catch (e) { applyWallpaper(0, false); }
    initTheme();
    screenPointerBind();
    setProgress(8, "模拟器就绪，加载镜像…");
    bootUrl("images/kernel.elf", "mini-kernel");

    /* 开机画面由「shell 真的起来了」驱动，不是固定延时 */
    const t0 = Date.now();
    const waitShell = setInterval(() => {
      const host = document.querySelector(".term-dom");
      const ready = host && host.textContent.indexOf("rvsh") >= 0;
      if (ready || Date.now() - t0 > 9000) {
        clearInterval(waitShell);
        setProgress(100, "就绪");
        const sp = $("boot");
        if (sp) {
          setTimeout(() => {
            sp.classList.add("gone");
            setTimeout(() => sp.remove(), 500);
          }, ready ? 120 : 0);
        }
        focusTerm();
      }
    }, 120);
  }).catch((e) => setProgress(0, "wasm 加载失败：" + e));
}

setTimeout(startRvsim, 260);
</script>
