<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>rvsim · RISC-V 模拟器可视化</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--line:#21262d;--fg:#e6edf3;--dim:#8b949e;
        --acc:#58a6ff;--ok:#3fb950;--warn:#d29922;--err:#f85149;
        --ex:#bc8cff;--mem:#39d353;--wb:#f0883e;
        --mono:ui-monospace,"SF Mono",Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{padding:10px 16px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);
       padding:2px 7px;border-radius:10px}
  main{display:grid;grid-template-columns:270px 1fr 280px;gap:1px;
       background:var(--line);height:calc(100vh - 49px)}
  section{background:var(--panel);padding:10px 12px;overflow:auto}
  h2{font-size:10px;text-transform:uppercase;letter-spacing:.09em;
     color:var(--dim);margin:0 0 8px;font-weight:600}
  .row{display:flex;justify-content:space-between;font-family:var(--mono);
       font-size:12px;padding:1px 0}
  .row .k{color:var(--dim)}
  .row.hl .v{color:var(--acc);font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  button{background:#21262d;color:var(--fg);border:1px solid #30363d;
         padding:5px 11px;border-radius:5px;font-size:12px;cursor:pointer}
  button:hover{background:#30363d}
  button.primary{background:#1f6feb;border-color:#1f6feb}
  button.primary:hover{background:#388bfd}
  #status{font-family:var(--mono);font-size:12px;padding:4px 9px;
          border-radius:5px;background:#0d1117;border:1px solid var(--line)}
  .ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  td{padding:1px 4px}
  td.k{color:var(--dim);width:44px}
  #disasm{font-family:var(--mono);font-size:12px;line-height:1.7}
  #disasm .ln{display:flex;gap:10px;padding:0 6px;border-radius:3px}
  #disasm .ln.cur{background:#1f6feb33;border-left:2px solid var(--acc);padding-left:4px}
  #disasm .addr{color:var(--dim)}
  #disasm .hex{color:#6e7681}
  #disasm .txt{color:var(--fg)}
  #stages{display:flex;gap:8px;margin-top:4px}
  .stage{flex:1;text-align:center;padding:8px 4px;border-radius:5px;
         background:#0d1117;border:1px solid var(--line);font-size:11px;
         color:var(--dim);transition:all .12s}
  .stage.on{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600}
  .stage.exe.on{background:var(--ex);border-color:var(--ex)}
  .stage.mem.on{background:var(--mem);border-color:var(--mem);color:#04260f}
  .stage.wb.on{background:var(--wb);border-color:var(--wb);color:#241203}
  .kbd{font-size:10px;opacity:.75}
  #heat{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin-top:6px}
  .cell{aspect-ratio:1;border-radius:2px;background:#0d1117;border:1px solid #21262d}
  .legend{display:flex;align-items:center;gap:6px;font-size:10px;
          color:var(--dim);margin-top:8px;flex-wrap:wrap}
  .legend i{display:block;width:14px;height:10px;border-radius:2px}
</style>
</head>
<body>
<header>
  <h1>rvsim</h1>
  <span class="tag">RV32IMA · M/S/U · Sv32 · WASM</span>
  <span id="status">初始化中…</span>
</header>
<main>
  <section>
    <h2>控制</h2>
    <div class="btns">
      <button class="primary" id="btnRun">运行</button>
      <button id="btnStep">单步</button>
      <button id="btnReset">复位</button>
    </div>
    <div class="btns">
      <input type="file" id="fileElf" accept=".elf,*"
             style="font-size:11px;color:var(--dim);max-width:200px">
    </div>
    <h2 style="margin-top:16px">机器状态</h2>
    <div class="row hl"><span class="k">PC</span><span class="v" id="vPc">—</span></div>
    <div class="row"><span class="k">指令</span><span class="v" id="vInsn">—</span></div>
    <div class="row"><span class="k">特权级</span><span class="v" id="vPriv">—</span></div>
    <div class="row"><span class="k">周期</span><span class="v" id="vCycles">0</span></div>
    <div class="row"><span class="k">tohost</span><span class="v" id="vTo">—</span></div>
    <div class="row"><span class="k">类别</span><span class="v" id="vClass">—</span></div>
    <h2 style="margin-top:16px">关键 CSR</h2>
    <table id="csrs"></table>
  </section>
  <section>
    <h2>反汇编（PC 附近）</h2>
    <div id="disasm">—</div>
    <h2 style="margin-top:18px">指令阶段</h2>
    <div id="stages">
      <div class="stage" data-s="if">IF<br><span class="kbd">取指</span></div>
      <div class="stage" data-s="id">ID<br><span class="kbd">译码</span></div>
      <div class="stage exe" data-s="ex">EX<br><span class="kbd">执行</span></div>
      <div class="stage mem" data-s="mem">MEM<br><span class="kbd">访存</span></div>
      <div class="stage wb" data-s="wb">WB<br><span class="kbd">写回</span></div>
    </div>
    <h2 style="margin-top:18px">寄存器堆</h2>
    <div class="grid2" id="regs"></div>
  </section>
  <section>
    <h2>内存热图（4KB 页 · 前 2MB）</h2>
    <div id="heat"></div>
    <div class="legend">
      <span>读</span><i style="background:#39d353"></i>
      <span>写</span><i style="background:#f0883e"></i>
      <span>越亮 = 访问越多</span>
    </div>
    <h2 style="margin-top:16px">内存（PC 附近）</h2>
    <div id="mem" style="font-family:var(--mono);font-size:11px;line-height:1.6;
         white-space:pre;color:var(--dim)">—</div>
  </section>
</main>
<script src="rvsim.js"></script>
<script>
const ABI=["zero","ra","sp","gp","tp","t0","t1","t2","s0","s1",
  "a0","a1","a2","a3","a4","a5","a6","a7",
  "s2","s3","s4","s5","s6","s7","s8","s9","s10","s11","t3","t4","t5","t6"];
const PRIV=["U","S","?","M"];
const CLS=["ALU","LOAD","STORE","BRANCH","JUMP","CSR","SYSTEM","ATOMIC","FENCE","UIMM"];
const CSRS=[[0x300,"mstatus"],[0x341,"mepc"],[0x342,"mcause"],[0x343,"mtval"],
            [0x301,"misa"],[0x180,"satp"],[0x100,"sstatus"],[0x142,"scause"]];
let M=null,running=false,timer=null,loaded=false,disBufPtr=0;
const hex=(v,w=8)=>"0x"+(v>>>0).toString(16).padStart(w,"0");
function readCStr(p){let s="";for(let i=0;i<64;i++){const c=M.HEAPU8[p+i];if(!c)break;s+=String.fromCharCode(c);}return s;}
function refresh(){
  if(!M)return;
  const pc=M._rv_pc()>>>0, insn=M._rv_insn()>>>0, cls=M._rv_class();
  vPc.textContent=hex(pc); vInsn.textContent=hex(insn);
  vPriv.textContent=PRIV[M._rv_priv()]??"?"; vCycles.textContent=M._rv_cycles().toLocaleString();
  vTo.textContent=hex(M._rv_tohost()); vClass.textContent=CLS[cls]??"?";
  let d=""; const start=(pc-24)>>>0;
  for(let k=0;k<13;k++){
    const a=(start+k*4)>>>0;
    M._rv_disasm_at(a,disBufPtr,64);
    const txt=readCStr(disBufPtr);
    let raw=0; for(let b=0;b<4;b++) raw|=(M._rv_mem((a+b)>>>0)&0xFF)<<(b*8);
    const cur=(a===(pc&~3))?" cur":"";
    d+=`<div class="ln${cur}"><span class="addr">${hex(a)}</span>`+
       `<span class="hex">${hex(raw>>>0)}</span>`+
       `<span class="txt">${txt||".word ?"}</span></div>`;
  }
  disasm.innerHTML=d;
  const on=new Set(["if","id"]);
  if(cls===1){on.add("ex");on.add("mem");on.add("wb");}
  else if(cls===2){on.add("ex");on.add("mem");}
  else if(cls===3||cls===4||cls===5||cls===6){on.add("ex");}
  else if(cls===7){on.add("ex");on.add("mem");on.add("wb");}
  else{on.add("ex");on.add("wb");}
  document.querySelectorAll(".stage").forEach(el=>el.classList.toggle("on",on.has(el.dataset.s)));
  let t1="",t2="";
  for(let i=0;i<16;i++) t1+=`<tr><td class="k">${ABI[i]}</td><td>${hex(M._rv_reg(i)>>>0)}</td></tr>`;
  for(let i=16;i<32;i++) t2+=`<tr><td class="k">${ABI[i]}</td><td>${hex(M._rv_reg(i)>>>0)}</td></tr>`;
  regs.innerHTML=`<table>${t1}</table><table>${t2}</table>`;
  let cs=""; for(const[a,n]of CSRS)
    cs+=`<tr><td class="k">${n}</td><td>${hex(M._rv_csr(a)>>>0)}</td></tr>`;
  csrs.innerHTML=`<table>${cs}</table>`;
  let mem=""; const base=(pc-16)>>>0;
  for(let r=0;r<6;r++){
    const a=(base+r*4)>>>0; let bs="";
    for(let b=0;b<4;b++) bs+=(M._rv_mem((a+b)>>>0)&0xFF).toString(16).padStart(2,"0")+" ";
    const mk=(a===(pc&~3))?"<b style='color:#e6edf3'>":"";
    mem+=`${mk}${hex(a)}  ${bs}${mk?"</b>":""}\n`;
  }
  document.getElementById("mem").innerHTML=mem;
  drawHeat();
}
function drawHeat(){
  const heat=document.getElementById("heat");
  if(!heat.childElementCount){
    let h=""; for(let i=0;i<512;i++) h+=`<div class="cell" data-p="${i}"></div>`;
    heat.innerHTML=h;
  }
  let mR=1,mW=1;
  for(let i=0;i<512;i++){mR=Math.max(mR,M._rv_hot_r(i));mW=Math.max(mW,M._rv_hot_w(i));}
  const cells=heat.children;
  for(let i=0;i<512;i++){
    const r=M._rv_hot_r(i),w=M._rv_hot_w(i),c=cells[i];
    if(!r&&!w){c.style.background="#0d1117";c.style.borderColor="#21262d";continue;}
    if(w>=r){const a=Math.min(1,.18+.82*w/mW);
      c.style.background=`rgba(240,136,62,${a})`;c.style.borderColor="transparent";}
    else{const a=Math.min(1,.18+.82*r/mR);
      c.style.background=`rgba(57,211,83,${a})`;c.style.borderColor="transparent";}
    c.title=`页 ${i} (0x${(0x80000000+i*4096).toString(16)})\n读 ${r}  写 ${w}`;
  }
}
function setStatus(t,c){const el=document.getElementById("status");el.textContent=t;el.className=c||"";}
function stop(){running=false;if(timer){clearTimeout(timer);timer=null;}
  document.getElementById("btnRun").textContent="运行";}
function runChunk(){
  if(!running||!M)return;
  for(let i=0;i<1500;i++){
    if(M._rv_step()!==0){
      stop();const r=M._rv_result();
      setStatus(r===1?"PASS":r===-1?"FAIL":"已停机",r===1?"ok":r===-1?"err":"warn");
      refresh();return;
    }
  }
  refresh();timer=setTimeout(runChunk,0);
}
async function boot(){
  setStatus("加载 WASM…","warn");
  const wb=await(await fetch("rvsim.wasm")).arrayBuffer();
  M=await createRvsim({wasmBinary:wb});
  M._rv_reset();M._rv_hot_clr();
  disBufPtr=M._malloc(96);
  setStatus("就绪：请选择 ELF 文件","warn");
  refresh();
  document.getElementById("btnRun").onclick=()=>{
    if(!loaded)return;
    if(running){stop();return;}
    running=true;document.getElementById("btnRun").textContent="暂停";runChunk();
  };
  document.getElementById("btnStep").onclick=()=>{
    if(!loaded||running)return;
    if(M._rv_step()!==0){
      const r=M._rv_result();
      setStatus(r===1?"PASS":r===-1?"FAIL":"已停机",r===1?"ok":r===-1?"err":"warn");
    }
    refresh();
  };
  document.getElementById("btnReset").onclick=()=>{
    stop();M._rv_reset();M._rv_hot_clr();
    if(loaded)M._rv_load(window.__elfPtr,window.__elfLen);
    setStatus("已复位","warn");refresh();
  };
  document.getElementById("fileElf").onchange=async(e)=>{
    const f=e.target.files[0];if(!f)return;
    stop();
    const buf=new Uint8Array(await f.arrayBuffer());
    const ptr=M._malloc(buf.length);
    M.HEAPU8.set(buf,ptr);
    M._rv_reset();M._rv_hot_clr();
    if(!M._rv_load(ptr,buf.length)){setStatus("ELF 加载失败","err");M._free(ptr);return;}
    window.__elfPtr=ptr;window.__elfLen=buf.length;loaded=true;
    setStatus(`已加载 ${f.name} (${buf.length} 字节)`,"ok");
    refresh();
  };
}
boot().catch(e=>setStatus("启动失败："+e,"err"));
</script>
</body>
</html>
