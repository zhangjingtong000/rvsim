<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<!-- 外壳在开发期改动频繁，别让浏览器把旧 HTML 拿来跑 -->
<meta http-equiv="Cache-Control" content="no-store">
<title>rvsim · RISC-V 迷你机</title>
<style>
/* ══════════════════════════════════════════════════════════════
   rvsim 桌面外壳
   分工：内核只发布结构化数据（窗口表 / 字符网格 / 进程表 /
   文件表 / 系统状态），外壳与文字全部由这一层用 CSS 和真字体渲染。
   内核不做任何像素光栅化 —— 它画不出抗锯齿圆角，16x16 点阵中文
   在高分屏上也不可读，硬做就是「伪造古董」。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* ── Fluent 深色 token（对齐 WinUI 3 的 Common_themeresources_any.xaml）──
     文本层级用「纯白 + 透明度」，不是另起一个蓝灰色相：
     #A9B4C4 这类蓝灰在深色底上会偏色，和青绿强调色打架。
     几何一律落在 4px 网格上：标题栏 32、浮层圆角 8、控件圆角 4。 */
  --bg-root:#0A0D12;
  --s0:#12161D;   /* 窗口内容底 */
  --s1:#1A1F27;   /* 标题栏、侧栏 */
  --s2:#20262F;   /* 菜单、卡片 */
  --s3:#282F3A;   /* 悬停 */
  --s4:#323A47;   /* 按下 / 选中 */
  --stroke-sub:rgba(255,255,255,.05);
  --stroke:rgba(255,255,255,.07);        /* ControlStrokeColorDefault  #12FFFFFF */
  --stroke-strong:rgba(255,255,255,.11); /* ControlStrokeColorSecondary #18FFFFFF */
  --t1:#FFFFFF;                    /* TextFillColorPrimary   */
  --t2:rgba(255,255,255,.77);      /* TextFillColorSecondary #C5FFFFFF */
  --t3:rgba(255,255,255,.53);      /* TextFillColorTertiary  #87FFFFFF */
  --t-disabled:rgba(255,255,255,.36);
  --acc:#2DD4BF; --acc-hover:#5EEAD4; --acc-press:#14B8A6; --on-acc:#04211C;
  --ok:#34D399; --warn:#FBBF24; --danger:#F87171; --danger-strong:#C42B1C;
  --info:#60A5FA;

  /* 圆角严格按 WinUI 3：浮层 8 / 控件 4 */
  --r-window:8px; --r-flyout:8px; --r-control:4px; --r-tile:6px;

  --elev-1:0 1px 2px rgba(0,0,0,.30), 0 8px 20px -6px rgba(0,0,0,.45);
  --elev-2:0 1px 2px rgba(0,0,0,.35), 0 18px 44px -12px rgba(0,0,0,.62);
  --elev-3:0 8px 20px rgba(0,0,0,.30), 0 28px 64px -16px rgba(0,0,0,.70);

  --font-ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  --font-mono:"Cascadia Mono","Cascadia Code",Consolas,"Microsoft YaHei UI","Microsoft YaHei",ui-monospace,monospace;

  --ease-decel:cubic-bezier(.1,.9,.2,1);
  --dur-fast:150ms; --dur-normal:200ms;

  /* 兼容旧名 */
  --bg:var(--s1); --fg:var(--t1); --fg2:var(--t2); --fg3:var(--t3);
  --line:var(--stroke); --line2:var(--stroke-strong);
  --mono:var(--font-mono); --sans:var(--font-ui); --err:var(--danger);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg-root);color:var(--t1);
  font:400 14px/1.5 var(--font-ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
input{font:inherit;color:inherit;background:none;border:0;outline:0}

/* ── 开机画面 ───────────────────────────────────────────────── */
#boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;
  background:radial-gradient(1100px 700px at 50% 40%,#101827,#070A0F 72%);
  transition:opacity .45s var(--ease-decel)}
#boot.gone{opacity:0;pointer-events:none}
.boot-in{display:flex;flex-direction:column;align-items:center;width:340px}
.boot-mark{width:96px;height:96px;margin-bottom:26px;
  animation:bootMark .7s var(--ease-decel) both}
@keyframes bootMark{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.boot-mark .chip{animation:chipPulse 2.6s ease-in-out infinite}
@keyframes chipPulse{0%,100%{opacity:.9}50%{opacity:.55}}
.boot-name{font:600 30px/1.1 var(--font-display);letter-spacing:-.02em;
  animation:bootFade .5s .12s var(--ease-decel) both}
.boot-sub{margin-top:8px;font:400 12px/1.4 var(--font-mono);
  color:var(--t3);letter-spacing:.14em;
  animation:bootFade .5s .22s var(--ease-decel) both}
.boot-bar{width:100%;height:3px;margin-top:34px;border-radius:2px;
  background:rgba(255,255,255,.08);overflow:hidden;
  animation:bootFade .5s .3s var(--ease-decel) both}
.boot-bar i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--acc-press),var(--acc-hover));
  transition:width .28s var(--ease-decel)}
.boot-status{margin-top:14px;height:18px;font:400 12px/18px var(--font-ui);
  color:var(--t3);animation:bootFade .5s .36s var(--ease-decel) both}
@keyframes bootFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── 桌面 ───────────────────────────────────────────────────── */
#os{position:fixed;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(1150px 760px at 16% 6%, rgba(45,212,191,.17), transparent 62%),
    radial-gradient(1000px 720px at 84% 92%, rgba(59,130,246,.21), transparent 64%),
    radial-gradient(900px 620px at 55% 108%, rgba(45,212,191,.09), transparent 66%),
    radial-gradient(700px 500px at 62% 38%, rgba(124,58,237,.11), transparent 70%),
    linear-gradient(155deg,#101D30 0%,#0B1220 46%,#080B12 100%)}
#wall::after{content:"";position:absolute;inset:0;
  background:radial-gradient(125% 95% at 50% 42%,transparent 52%,rgba(0,0,0,.5) 100%)}

/* 桌面图标 */
#icons{position:absolute;inset:0;z-index:1;padding:18px 14px;
  display:flex;flex-direction:column;flex-wrap:wrap;gap:3px;
  align-content:flex-start;pointer-events:none}
.dicon{pointer-events:auto;width:76px;height:76px;padding:4px 2px 3px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  border-radius:7px;user-select:none;transition:background .12s,box-shadow .12s}
.dicon:hover{background:rgba(255,255,255,.07)}
.dicon.sel{background:rgba(45,212,191,.16);box-shadow:inset 0 0 0 1px rgba(94,234,212,.45)}
.dicon svg{width:44px;height:44px;flex:0 0 auto;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.45))}
.dicon span{font:400 12px/16px var(--font-ui);color:#EDF1F6;text-align:center;
  max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* winlayer 铺满整个桌面，但它只是窗口的容器：
   不给 pointer-events:none 的话，它会挡住下面所有桌面图标的点击
   （实测双击图标完全没反应，因为事件全被这层吃掉了）。 */
#winlayer{position:absolute;inset:0;z-index:5;pointer-events:none}
#winlayer > .win{pointer-events:auto}

/* 吸附预览：Win11 拖到边缘时会先亮出一块半透明占位 */
#snapGhost{position:absolute;z-index:4;pointer-events:none;opacity:0;
  border-radius:var(--r-window);
  background:rgba(45,212,191,.16);
  border:1px solid rgba(94,234,212,.6);
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 14px 36px -10px rgba(0,0,0,.55);
  transition:left .1s var(--ease-decel),top .1s var(--ease-decel),
             width .1s var(--ease-decel),height .1s var(--ease-decel),opacity .1s}
#snapGhost.on{opacity:1}

/* 吸附布局选择器：悬停最大化按钮 450ms 弹出（Win11 行为） */
#snapPicker{position:absolute;z-index:70;display:none;gap:6px;
  padding:10px;grid-template-columns:1fr 1fr;
  background:rgba(32,38,47,.97);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-flyout);
  box-shadow:var(--elev-3);animation:smIn .12s var(--ease-decel)}
#snapPicker.on{display:grid}
.sl{position:relative;width:96px;height:64px;border-radius:var(--r-control);
  background:rgba(255,255,255,.03);border:1px solid var(--stroke);overflow:hidden}
.sl-cell{position:absolute;border-radius:3px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  transition:background .1s,border-color .1s}
.sl-cell:hover{background:rgba(45,212,191,.42);border-color:rgba(94,234,212,.7)}

/* 悬停提示：原生 title 会弹一个浅色系统气泡，在深色界面上非常扎眼 */
#tip{position:absolute;z-index:80;pointer-events:none;opacity:0;
  padding:5px 10px;border-radius:var(--r-control);
  background:rgba(40,47,58,.97);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--stroke);box-shadow:var(--elev-1);
  font:400 12px/16px var(--font-ui);color:var(--t1);white-space:nowrap;
  transition:opacity .12s var(--ease-decel)}
#tip.on{opacity:1}

/* 托盘日期面板（点托盘弹出） */
#trayPanel{position:absolute;z-index:72;display:none;width:280px;padding:16px;
  background:rgba(32,38,47,.97);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-flyout);
  box-shadow:var(--elev-3);animation:smIn .16s var(--ease-decel)}
#trayPanel.on{display:block}
.tp-time{font:600 26px/1.1 var(--font-display);color:var(--t1);letter-spacing:-.01em}
.tp-date{font:400 12.5px/18px var(--font-ui);color:var(--t2);margin-top:4px}
.tp-sep{height:1px;margin:12px 0;background:var(--stroke)}
.tp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px}
.tp-dow{font:400 10px/16px var(--font-ui);color:var(--t3);text-align:center}
.tp-day{font:400 11.5px/26px var(--font-mono);color:var(--t2);text-align:center;
  border-radius:var(--r-control)}
.tp-day.today{background:var(--acc);color:var(--on-acc);font-weight:600}
.tp-day.dim{color:var(--t-disabled)}

/* 右键菜单 */
#ctxMenu{position:absolute;z-index:75;display:none;min-width:184px;padding:5px;
  background:rgba(32,38,47,.97);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-flyout);
  box-shadow:var(--elev-3);animation:smIn .12s var(--ease-decel)}
#ctxMenu.on{display:block}
.ctx-item{padding:7px 12px;border-radius:var(--r-control);
  font:400 13px/18px var(--font-ui);color:var(--t1);cursor:default;white-space:nowrap}
.ctx-item:hover{background:rgba(255,255,255,.08)}
.ctx-item.disabled{color:var(--t-disabled);pointer-events:none}
.ctx-sep{height:1px;margin:4px 8px;background:var(--stroke)}

/* 键盘焦点环：Win11 是贴边的 2px 白环，内缩 -2px 避免被 overflow 裁掉 */
:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
.dicon:focus-visible,.dock-app:focus-visible,.dock-btn:focus-visible,
.sm-tile:focus-visible,.sm-ri:focus-visible,.win-ctl button:focus-visible{
  outline:2px solid #FFFFFF;outline-offset:-2px}
#startBtn:focus-visible,#dbgBtn:focus-visible{outline-offset:-2px}

/* ── 窗口 ───────────────────────────────────────────────────── */
.win{position:absolute;display:flex;flex-direction:column;
  border-radius:var(--r-window);overflow:hidden;
  /* 底色用高不透明度的半透明：窗口是每帧都在变的内容，
     backdrop-filter 会让浏览器每帧重算一次背景模糊 —— 实测吞吐从
     12-19 M/s 掉到 4.9 M/s。视觉上 .94 和 .86+blur 几乎看不出差别。 */
  background:rgba(18,22,29,.94);
  border:1px solid var(--stroke);
  /* Win11 的四层阴影 */
  box-shadow:0 0 0 1px rgba(0,0,0,.12),
             0 2px 4px rgba(0,0,0,.14),
             0 8px 16px rgba(0,0,0,.16),
             0 16px 32px rgba(0,0,0,.18);
  transition:box-shadow .167s var(--ease-decel),border-color .167s,
             left .167s var(--ease-decel),top .167s var(--ease-decel),
             width .167s var(--ease-decel),height .167s var(--ease-decel)}
.win.dragging{transition:box-shadow .167s var(--ease-decel),border-color .167s}
/* 关闭：淡出 + 轻微缩小（Win11 关闭动画的观感） */
.win.closing{opacity:0;transform:scale(.97);
  transition:opacity .12s var(--ease-accel),transform .12s var(--ease-accel)}
.win.focused{border-color:rgba(94,234,212,.34);
  box-shadow:0 0 0 1px rgba(94,234,212,.16),
             0 2px 4px rgba(0,0,0,.16),
             0 8px 16px rgba(0,0,0,.18),
             0 20px 40px rgba(0,0,0,.22)}
/* 吸附到屏幕边缘时，贴边那侧的圆角收成直角 */
.win.snap-l{border-top-left-radius:0;border-bottom-left-radius:0}
.win.snap-r{border-top-right-radius:0;border-bottom-right-radius:0}
.win.snap-t{border-top-left-radius:0;border-top-right-radius:0}
/* 最小化：向 dock 方向缩小淡出 */
.win.minimizing{opacity:0;transform:scale(.9) translateY(24px);
  transition:opacity .167s var(--ease-accel),transform .167s var(--ease-accel)}

.win-bar{flex:0 0 32px;height:32px;display:flex;align-items:center;
  gap:8px;padding:0 0 0 12px;user-select:none;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
  border-bottom:1px solid rgba(255,255,255,.07)}
.win-ico{width:16px;height:16px;flex:0 0 auto;opacity:.72}
.win.focused .win-ico{opacity:.95}
.win-title{font:400 12px/1 var(--font-ui);color:var(--t2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.focused .win-title{color:var(--t1)}
.win-ctl{margin-left:auto;display:flex;align-self:stretch}
.win-ctl button{width:46px;height:100%;display:grid;place-items:center;
  color:var(--t2);transition:background .1s,color .1s}
.win-ctl button svg{width:10px;height:10px}
.win-ctl button:hover{background:rgba(255,255,255,.09);color:var(--t1)}
.win-ctl button:active{background:rgba(255,255,255,.14)}
.win-ctl button.close:hover{background:var(--danger-strong);color:#fff}
.win-ctl button.close:active{background:#A4261A;color:#fff}

.win-body{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
/* 宿主应用的内容长度是固定的，窗口小时要能滚，不能直接裁掉最后一行 */
.host-win .win-body{overflow:auto}

/* 终端：字符网格由内核发布，这里用等宽真字体画 */
.term-dom{padding:10px 12px;overflow:hidden;background:var(--s0);
  font-family:var(--font-mono);font-size:14px;line-height:20px;
  color:#D7DCE3;letter-spacing:0}
/* 行盒高度交给 line-height，但空行必须显式给 min-height ——
   一个 textContent 为空的 div 在流式布局里高度是 0，
   整屏内容会往上塌几行，光标位置也跟着错位。 */
.term-line{white-space:pre;line-height:inherit;min-height:var(--lh,20px);overflow:hidden}
.term-dom .tcur{position:absolute;width:1ch;height:var(--lh,20px);background:var(--acc);
  opacity:.8;border-radius:1px;pointer-events:none;
  animation:tcur 1.06s steps(1) infinite}
@keyframes tcur{50%{opacity:0}}
.term-dom.nocursor .tcur{display:none}

/* 面板：进程表 / 文件表 */
.panel-dom{overflow:auto;background:var(--s0);padding:0 0 6px}
.ptab,.ftab{width:100%;border-collapse:collapse;
  font:400 14px/1 var(--font-mono);table-layout:fixed}
.ptab th,.ftab th{position:sticky;top:0;z-index:1;
  height:32px;padding:0 12px;text-align:left;
  font:600 12px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;
  color:var(--t3);background:var(--s0);
  border-bottom:1px solid var(--stroke-sub);white-space:nowrap}
.ptab td,.ftab td{height:var(--rh,40px);padding:0 12px;
  border-bottom:1px solid rgba(255,255,255,.035);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptab td{color:var(--t2)}
.ptab tr.run td{color:var(--acc-hover)}
.ptab tr.run td:first-child{box-shadow:inset 2px 0 0 var(--acc)}
.ftab td.nm{color:var(--t1);font-family:var(--font-mono)}
.ftab td.r,.ptab .r{text-align:right}
.ftab td.dim{color:var(--t3)}
.mono{font-family:var(--font-mono)}

/* ── Dock ───────────────────────────────────────────────────── */
#dock{position:absolute;left:0;right:0;bottom:0;height:48px;z-index:40;
  display:flex;align-items:center;padding:0 10px;user-select:none;
  background:rgba(22,28,38,.94);
  border-top:1px solid rgba(255,255,255,.09);
  box-shadow:0 -8px 24px -12px rgba(0,0,0,.6);
  font:400 12px/16px var(--font-ui);color:var(--t2)}
.dock-center{position:absolute;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:2px}
.dock-btn{width:40px;height:40px;border-radius:var(--r-control);display:grid;place-items:center;
  color:var(--t2);transition:background .12s,color .12s}
.dock-btn:hover{background:rgba(255,255,255,.08);color:var(--t1)}
.dock-btn svg{width:17px;height:17px}
.dock-apps{display:flex;gap:6px}
.dock-app{position:relative;width:42px;height:40px;border-radius:var(--r-control);
  display:grid;place-items:center;transition:background .12s}
.dock-app:hover{background:rgba(255,255,255,.10)}
.dock-app:active{background:rgba(255,255,255,.05)}
.dock-app svg{width:26px;height:26px;opacity:.66;
  transition:opacity .167s var(--ease-decel),transform .167s var(--ease-decel)}
.dock-app:hover svg{opacity:1;transform:scale(1.08)}
.dock-app:active svg{transform:scale(.96)}
.dock-app.active svg{opacity:1}
.dock-app .ind{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:5px;height:3px;border-radius:2px;background:transparent;
  transition:width .16s var(--ease-decel),background .16s}
.dock-app.active .ind{width:16px;background:var(--acc)}
.dock-sep{width:1.5px;height:24px;margin:0 10px;background:rgba(255,255,255,.24);
  border-radius:1px}

.dock-tray{margin-left:auto;display:flex;align-items:center;gap:10px;padding-right:4px}
.tray-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 0 rgba(52,211,153,.5);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.42)}
  70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.tray-rate{font:400 11.5px/1 var(--font-mono);color:var(--t3);
  font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.tray-clock{display:flex;flex-direction:column;align-items:flex-end;
  line-height:15px;font-variant-numeric:tabular-nums;padding-left:2px}
.tray-clock b{font-weight:500;color:var(--t1);font-size:12px}
.tray-clock i{font-style:normal;color:var(--t3);font-size:11px}

/* ── 开始菜单 ───────────────────────────────────────────────── */
#startMenu{position:absolute;left:50%;bottom:54px;
  transform:translateX(-50%);width:520px;height:auto;
  max-height:calc(100vh - 78px);
  padding:22px;z-index:60;display:flex;flex-direction:column;
  background:rgba(26,32,42,.97);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-flyout);box-shadow:var(--elev-3);
  font:400 14px/20px var(--font-ui);color:var(--t1);
  animation:smIn .25s var(--ease-decel)}
@keyframes smIn{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.985)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.sm-search{display:flex;align-items:center;gap:10px;height:32px;
  padding:0 12px;border-radius:var(--r-control);background:var(--s3);
  border:1px solid var(--stroke);color:var(--t3);flex:0 0 auto}
.sm-search svg{width:14px;height:14px;flex:0 0 auto}
.sm-search input{flex:1;color:var(--t1);font:400 13.5px/20px var(--font-ui)}
.sm-search input::placeholder{color:var(--t3)}
.sm-sec{margin:20px 0 10px;font:600 11.5px/16px var(--font-ui);
  color:var(--t2);letter-spacing:.02em;flex:0 0 auto}
.sm-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;flex:0 0 auto}
.sm-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;aspect-ratio:1;padding:10px 6px;border-radius:var(--r-tile);
  transition:background .12s}
.sm-tile:hover{background:rgba(255,255,255,.07)}
.sm-tile svg{width:34px;height:34px}
.sm-tile span{font:400 11.5px/15px var(--font-ui);color:var(--t2);
  max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-recent{display:flex;flex-direction:column;gap:1px;flex:0 0 auto;
  overflow:auto;min-height:0}
.sm-ri{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;
  border-radius:var(--r-control);color:var(--t2);font-family:var(--font-mono);font-size:13px;
  transition:background .1s,color .1s}
.sm-ri:hover{background:rgba(255,255,255,.07);color:var(--t1)}
.sm-ri svg{width:13px;height:13px;opacity:.5;flex:0 0 auto}
.sm-user{display:flex;align-items:center;gap:10px;height:54px;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--stroke-sub);flex:0 0 auto}
.sm-av{width:28px;height:28px;border-radius:50%;background:var(--acc);
  color:var(--on-acc);display:grid;place-items:center;font:600 13px/1 var(--font-ui)}
.sm-user-txt{display:flex;flex-direction:column;line-height:16px}
.sm-user-txt b{font:600 13.5px/18px var(--font-ui);color:var(--t1)}
.sm-user-txt i{font-style:normal;font:400 11.5px/15px var(--font-ui);color:var(--t3)}
.sm-power{margin-left:auto;color:var(--t3);padding:6px;border-radius:6px}
.sm-power:hover{color:var(--t1);background:rgba(255,255,255,.07)}

/* ── 调试抽屉 ───────────────────────────────────────────────── */
#drawer{position:absolute;top:0;right:0;bottom:48px;width:340px;z-index:50;
  display:flex;flex-direction:column;
  background:rgba(17,22,29,.96);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  backdrop-filter:blur(22px) saturate(160%);
  border-left:1px solid var(--stroke);
  transform:translateX(100%);transition:transform .2s var(--ease-decel);
  font:400 12px/1.5 var(--font-ui);color:var(--t2)}
body.drawer #drawer{transform:translateX(0)}
.dw-head{flex:0 0 44px;display:flex;align-items:center;gap:8px;
  padding:0 12px 0 16px;border-bottom:1px solid var(--stroke-sub)}
.dw-head b{font:600 12.5px/1 var(--font-ui);color:var(--t1)}
.dw-head .grow{flex:1}
.dw-x{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t3)}
.dw-x:hover{background:rgba(255,255,255,.08);color:var(--t1)}
.dw-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px 20px}
.dw-sec{margin:16px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--stroke-sub);
  font:600 10.5px/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.dw-sec:first-child{margin-top:0}
.dw-row{display:flex;gap:6px}
.dw-row button{flex:1;font-size:12px;color:var(--t2);background:var(--s2);
  border:1px solid var(--stroke);border-radius:6px;padding:7px 10px;
  white-space:nowrap;transition:.13s}
.dw-row button:hover{background:var(--s3);color:var(--t1)}
.dw-row button:disabled{opacity:.34}
.dw-row button.pri{background:var(--acc);border-color:var(--acc);
  color:var(--on-acc);font-weight:600}
.dw-row button.pri:hover{background:var(--acc-hover)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;
  font-family:var(--font-mono);font-size:11.5px}
.kv .k{color:var(--t3);font-family:var(--font-ui);font-size:11.5px}
.kv .v{color:var(--t1)}
/* 窄窗口里的键值对：space-between 会把中间拉出两百多像素的空档，
   看起来像两张不相关的表。这里改成左对齐 + 固定间距。 */
.kv.tight{justify-content:flex-start;gap:14px;padding:4px 0}
.kv.tight .k{min-width:56px}
#reg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;
  font-family:var(--font-mono);font-size:11.5px}
.rg{display:flex;justify-content:space-between;padding:1.5px 4px;border-radius:3px}
.rg:hover{background:var(--s2)}
.rg .n{color:var(--t3)}
.rg.chg .v{color:var(--warn)}
.rg input{width:64px;background:var(--bg-root);color:var(--acc);
  border:1px solid var(--acc);border-radius:3px;font:11.5px var(--font-mono);padding:0 3px}
#events,#snaps,#caps,#files,#procs{max-height:180px;overflow-y:auto;
  font-family:var(--font-mono);font-size:10.5px}
.ev{display:grid;grid-template-columns:34px 30px 1fr;gap:5px;padding:2px 4px;border-radius:3px}
.ev .t{color:var(--t3)}
.ev.spawn .a{color:var(--acc)}.ev.exit .a{color:var(--danger)}
.hint{font-family:var(--font-ui);font-size:11px;color:var(--t3)}
.cap{padding:2px 4px;border-radius:3px}
.cap b{color:var(--acc);font-weight:500}
.cap span{color:var(--t3);margin-left:6px}
.prow{display:grid;grid-template-columns:30px 50px 1fr 30px;gap:5px;padding:3px 4px;border-radius:3px}
.prow.ph{color:var(--t3);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.prow.run{color:var(--acc)}
.prow.ready{color:var(--t1)}
.prow.exit{color:var(--t3)}
.frow{display:flex;justify-content:space-between;padding:2px 4px;border-radius:3px}
.frow b{color:var(--acc);font-weight:500}
.frow span{color:var(--t3)}
.snap{padding:2px 4px;border-radius:3px}
.snap b{color:var(--acc);font-weight:500}

/* 旧的隐藏终端（appendOut 仍然往里写，作为原始 UART 备份） */
#term{display:none}

/* 输入法入口：必须真实可聚焦，canvas/div 收不到组合事件 */
#ime{position:absolute;left:-9999px;top:0;width:10px;height:10px;opacity:0}

/* 设置窗口内的控件 */
.set-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-radius:6px}
.set-row:hover{background:rgba(255,255,255,.04)}
.set-row .lb{font:400 12.5px/18px var(--font-ui);color:var(--t1)}
.set-row .sb{font:400 11px/16px var(--font-ui);color:var(--t3)}
.seg{display:flex;gap:2px;background:var(--s2);padding:2px;border-radius:6px}
.seg button{padding:5px 11px;border-radius:4px;font-size:11.5px;color:var(--t2)}
.seg button.on{background:var(--s4);color:var(--t1)}
.sw{width:36px;height:20px;border-radius:10px;background:var(--s4);
  position:relative;transition:background .16s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;
  border-radius:50%;background:var(--t2);transition:.16s}
.sw.on{background:var(--acc)}
.sw.on::after{left:19px;background:var(--on-acc)}
.doc{padding:4px 2px;font:400 12.5px/1.75 var(--font-ui);color:var(--t2)}
.doc h4{font:600 13px/1.5 var(--font-ui);color:var(--t1);margin:14px 0 6px}
.doc h4:first-child{margin-top:0}
.doc code{font-family:var(--font-mono);font-size:11.5px;color:var(--acc-hover);
  background:rgba(45,212,191,.09);padding:1px 5px;border-radius:3px}
.doc ul{margin:4px 0 0 16px}
.doc li{margin:2px 0}
.about-hero{display:flex;flex-direction:column;align-items:center;
  padding:16px 0 6px;gap:10px}
.about-hero svg{width:64px;height:64px}
.about-hero b{font:600 17px/1.3 var(--font-display);color:var(--t1)}
.about-hero i{font-style:normal;font:400 11.5px/1.4 var(--font-mono);color:var(--t3)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--stroke-sub);border-radius:6px;overflow:hidden;margin-top:12px}
.about-grid div{background:var(--s0);padding:9px 11px}
.about-grid .k{font:400 10.5px/1.4 var(--font-ui);color:var(--t3)}
.about-grid .v{font:400 12px/1.5 var(--font-mono);color:var(--t1)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
</style>
</head>

/* 让 div 也能用键盘操作：tab 能到、Enter/Space 触发。
   无障碍要求所有功能可键盘完成，而 .dicon/.dock-app/.sm-tile 都是 div。 */
function makeFocusable(el, onActivate) {
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onActivate(); }
  });
}

function iconsRender() {
  const box = $("icons");
  if (!box || box.dataset.built) return;
  box.dataset.built = "1";
  box.insertAdjacentHTML("beforeend", SVG_DEFS);
  for (const app of APPS) {
    const d = document.createElement("div");
    d.className = "dicon";
    d.dataset.app = app.id;
    d.innerHTML = '<svg viewBox="0 0 44 44">' + app.ico + '</svg><span>' + app.name + '</span>';
    d.onclick = () => {
      box.querySelectorAll(".dicon").forEach((x) => x.classList.remove("sel"));
      d.classList.add("sel");
    };
    d.ondblclick = () => { launch(app.id); };
    makeFocusable(d, () => launch(app.id));
    box.appendChild(d);
  }
}

function dockRender() {
  const box = $("dockApps");
  if (!box || box.dataset.built) return;
  box.dataset.built = "1";
  for (const app of APPS) {
    const d = document.createElement("div");
    d.className = "dock-app";
    d.dataset.app = app.id;
    d.title = app.name;
    d.innerHTML = '<svg viewBox="0 0 44 44">' + app.ico + '</svg><span class="ind"></span>';
    d.onclick = () => launch(app.id);
    d.addEventListener("pointerenter", () => tipShow(d, app.name));
    d.addEventListener("pointerleave", tipHide);
    makeFocusable(d, () => launch(app.id));
    box.appendChild(d);
  }
}

/* 点图标 / Dock / 开始菜单磁贴的统一入口 */
function launch(id) {
  const app = APPS.find((a) => a.id === id);
  if (!app) return;
  if (app.w >= 0) {
    if (!M) return;
    sendWinCmd(app.w * 10 + 5);   /* 5 = 恢复并聚焦 */
    hostWinClose(id === "settings" ? "" : "");
  } else {
    hostWinToggle(id);
  }
  closeStartMenu();
}

/* ══ 宿主侧应用窗口（Settings / Guide / About）══ */
const hostWins = new Map();   /* id -> { el, app, x, y, w, h, min } */
let hostZ = 30;

function hostWinToggle(id) {
  const ex = hostWins.get(id);
  if (ex) {
    if (ex.el.style.display === "none") { ex.el.style.display = "flex"; ex.min = false; }
    else { ex.el.style.display = "none"; ex.min = true; }
    hostWinFocus(id);
    return;
  }
  hostWinOpen(id);
}
function hostWinClose(id) {
  const w = hostWins.get(id);
  if (!w) return;
  w.el.remove();
  hostWins.delete(id);
}

function hostWinOpen(id) {
  const app = APPS.find((a) => a.id === id);
  const layer = $("winlayer");
  if (!app || !layer) return;
  const size = id === "settings" ? [340, 392] : id === "guide" ? [400, 520] : [330, 344];
  const n = hostWins.size;
  const el = document.createElement("div");
  el.className = "win host-win";
  el.style.width = size[0] + "px";
  el.style.height = size[1] + "px";
  el.style.left = Math.round(140 + n * 28) + "px";
  el.style.top = Math.round(120 + n * 24) + "px";
  el.style.zIndex = ++hostZ;
  el.innerHTML =
    '<div class="win-bar"><span class="win-ico">' + (HOST_ICO[id] || "") + '</span>'
    + '<span class="win-title">' + app.name + '</span>'
    + '<span class="win-ctl">'
    + '<button class="min" title="最小化"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="currentColor" stroke-width="1.2"/></svg></button>'
    + '<button class="close" title="关闭"><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>'
    + '</span></div><div class="win-body"></div>';
  layer.appendChild(el);
  const body = el.querySelector(".win-body");
  body.innerHTML = hostWinBody(id);

  el.querySelector(".close").onclick = (e) => { e.stopPropagation(); hostWinClose(id); };
  el.querySelector(".min").onclick = (e) => {
    e.stopPropagation(); el.style.display = "none";
    hostWins.get(id).min = true;
  };
  el.addEventListener("pointerdown", () => hostWinFocus(id), true);

  /* 拖动：只认标题栏，且不和 #os 的 pointerdown 混 */
  const bar = el.querySelector(".win-bar");
  bar.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest(".win-ctl")) return;
    ev.stopPropagation();
    const r = el.getBoundingClientRect();
    const os = desk().getBoundingClientRect();
    const dx = ev.clientX - r.left, dy = ev.clientY - r.top;
    const move = (e2) => {
      const x = Math.max(-size[0] + 80, Math.min(os.width - 60, e2.clientX - os.left - dx));
      const y = Math.max(0, Math.min(os.height - 90, e2.clientY - os.top - dy));
      el.style.left = x + "px"; el.style.top = y + "px";
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
  el.addEventListener("pointerdown", (ev) => { if (ev.target.closest(".win-bar")) return; });

  hostWins.set(id, { el, app, min: false });
  hostWinFocus(id);
  if (id === "settings") bindSettings(body);
}

function hostWinFocus(id) {
  const w = hostWins.get(id);
  if (!w) return;
  w.el.style.zIndex = ++hostZ;
  hostWins.forEach((v, k) => v.el.classList.toggle("focused", k === id));
}

/* ══ 窗口层 ══ */
const WIN_SLOTS = 3;
const winEls = [];
let winLayer = null;

/* ── 吸附区域（逻辑坐标 800x600）──
   Win11 的 Snap Layouts：拖到左右边缘 → 半屏，拖到顶部 → 最大化，
   拖到四角 → 1/4 屏。边缘触发距离 26 逻辑像素（约屏幕宽 3%）。 */
const SNAP = {
  top:   [0, 0, 800, 600],
  tl:    [0, 0, 400, 300], tr: [400, 0, 400, 300],
  bl:    [0, 300, 400, 300], br: [400, 300, 400, 300],
  left:  [0, 0, 400, 600], right: [400, 0, 400, 600],
};
const SNAP_EDGE = 26;

/* 吸附判定用屏幕像素，不是逻辑坐标：鼠标走到窗口最左缘时，
   换算出来的逻辑坐标是负的（桌面等比居中，四周有留白），
   拿它跟 0 比永远不成立。底部不吸附 —— Win11 底部是任务栏。 */
/* 窗口命令字统一入口。值加 1：idx=0/act=0 打包成 0 会被内核当成「无命令」，
   关闭第一个窗口的命令就永远发不出去。 */
function sendWinCmd(v) {
  if (!M) return;
  M.HEAPU32[guestOff(WIN_CMD_PA)] = v + 1;
}

function snapZonePx(px, py, W, H) {
  if (px < 0 || py < 0 || px > W || py > H) return null;
  const L = px <= SNAP_EDGE, R = px >= W - SNAP_EDGE;
  const T = py <= SNAP_EDGE;
  if (T && L) return "tl";
  if (T && R) return "tr";
  if (T) return "top";
  if (L) return "left";
  if (R) return "right";
  return null;
}

/* 拖到另一个窗口的左/右边缘时，吸附到屏幕对应半边 ——
   对方不动，自己贴上去，效果就是并排。比「同时移动两个窗口」简单得多，
   内核协议也不用扩。 */
function snapToNeighbor(px, py, selfIdx, L, osR) {
  const ws = window.rv && window.rv.ready ? window.rv.state.wins : null;
  if (!ws) return null;
  for (let j = 0; j < ws.length; j++) {
    if (j === selfIdx) continue;
    const w = ws[j];
    if (!w.visible) continue;
    const x = L.ox + w.x * L.scale, y = L.oy + w.y * L.scale;
    const ww = w.w * L.scale, wh = w.h * L.scale;
    if (py < y || py > y + wh) continue;
    const NEAR = 40;
    if (Math.abs(px - x) < NEAR) return "left";
    if (Math.abs(px - (x + ww)) < NEAR) return "right";
  }
  return null;
}

function snapShow(zone) {
  if (!zone) { snapHide(); return; }
  snapShowRect(...SNAP[zone]);
}
function snapHide() {
  const g = $("snapGhost");
  if (g) g.classList.remove("on");
}

/* 按逻辑矩形显示占位（布局选择器预览用） */
function snapShowRect(x, y, w, h) {
  const g = $("snapGhost");
  if (!g) return;
  const osR = desk().getBoundingClientRect();
  const L = deskTransform(osR.width, osR.height);
  g.style.left = (L.ox + x * L.scale).toFixed(1) + "px";
  g.style.top = (L.oy + y * L.scale).toFixed(1) + "px";
  g.style.width = (w * L.scale).toFixed(1) + "px";
  g.style.height = (h * L.scale).toFixed(1) + "px";
  g.classList.add("on");
}

/* ── 吸附布局（Win11 Snap Layouts 的 4 种）──
   百分比表示，应用时 ×8 / ×6 换算成 800x600 的逻辑坐标。 */
const SNAP_LAYOUTS = [
  [[0, 0, 50, 100], [50, 0, 50, 100]],                          /* 两列 */
  [[0, 0, 66.7, 100], [66.7, 0, 33.3, 100]],                    /* 2/3 + 1/3 */
  [[0, 0, 33.3, 100], [33.3, 0, 33.3, 100], [66.6, 0, 33.4, 100]], /* 三列 */
  [[0, 0, 50, 50], [50, 0, 50, 50], [0, 50, 50, 50], [50, 50, 50, 50]], /* 四宫格 */
];
let snapPickerFor = -1, snapPickerTimer = null, snapPickerHideTimer = null;

function snapPickerBuild() {
  const p = $("snapPicker");
  if (!p || p.dataset.built) return;
  p.dataset.built = "1";
  for (const cells of SNAP_LAYOUTS) {
    const box = document.createElement("div");
    box.className = "sl";
    for (const [x, y, w, h] of cells) {
      const c = document.createElement("div");
      c.className = "sl-cell";
      c.style.left = x + "%";
      c.style.top = y + "%";
      c.style.width = "calc(" + w + "% - 4px)";
      c.style.height = "calc(" + h + "% - 4px)";
      c.style.margin = "2px";
      c.onpointerenter = () => snapShowRect(x * 8, y * 6, w * 8, h * 6);
      c.onpointerleave = () => snapHide();
      c.onclick = () => {
        const i = snapPickerFor;
        if (i >= 0) {
          setWinRect(i, Math.round(x * 8), Math.round(y * 6), Math.round(w * 8), Math.round(h * 6));
        }
        snapPickerHide();
        snapHide();
      };
      box.appendChild(c);
    }
    p.appendChild(box);
  }
  p.addEventListener("pointerenter", () => clearTimeout(snapPickerHideTimer));
  p.addEventListener("pointerleave", () => {
    snapPickerHideTimer = setTimeout(snapPickerHide, 260);
  });
}

function snapPickerShow(i, anchor) {
  const p = $("snapPicker");
  if (!p) return;
  snapPickerBuild();
  snapPickerFor = i;
  p.classList.add("on");
  const r = anchor.getBoundingClientRect();
  const osR = desk().getBoundingClientRect();
  const pw = p.offsetWidth || 224;
  p.style.left = Math.max(8, Math.min(osR.width - pw - 8, r.right - osR.left - pw)) + "px";
  p.style.top = (r.bottom - osR.top + 6) + "px";
}

function snapPickerHide() {
  const p = $("snapPicker");
  if (p) p.classList.remove("on");
  snapPickerFor = -1;
  snapHide();
}

/* ── 右键菜单 ── */

/* 窗口位置回写：只挪位置 / 位置+尺寸（吸附） */
function setWinPos(i, x, y) {
  if (!M) return;
  const b = guestOff(WIN_POS_PA);
  M.HEAPU32[b] = i;
  M.HEAPU32[b + 1] = Math.max(0, Math.min(800, x));
  M.HEAPU32[b + 2] = Math.max(0, Math.min(600, y));
  M.HEAPU32[b + 3] = 0;
  M.HEAPU32[b + 4] = 0;
  posSeq = (posSeq + 1) & 0x7fffffff; if (!posSeq) posSeq = 1;
  M.HEAPU32[b + 5] = posSeq;
}
function setWinRect(i, x, y, w, h) {
  if (!M) return;
  const b = guestOff(WIN_POS_PA);
  M.HEAPU32[b] = i;
  M.HEAPU32[b + 1] = x;
  M.HEAPU32[b + 2] = y;
  M.HEAPU32[b + 3] = w;
  M.HEAPU32[b + 4] = h;
  posSeq = (posSeq + 1) & 0x7fffffff; if (!posSeq) posSeq = 1;
  M.HEAPU32[b + 5] = posSeq;
}

/* 标题栏图标：16px 下 44px 的彩色图标会糊成一团色块，
   所以单独一套线条版 */
const WIN_ICONS = [
  '<svg viewBox="0 0 16 16" fill="none" stroke="#5EEAD4" stroke-width="1.7" '
    + 'stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.4L6.3 8 3 11.6M7.6 11.6H13"/></svg>',
  '<svg viewBox="0 0 16 16" fill="none" stroke="#A5B4FC" stroke-width="1.7" '
    + 'stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l3.6-4.6 2.8 3.1L12 4.8l2 7.2"/></svg>',
  '<svg viewBox="0 0 16 16" fill="none" stroke="#7DD3FC" stroke-width="1.6" '
    + 'stroke-linejoin="round"><path d="M2 5.3h4.1l1.2 1.6H14v6.1a1.2 1.2 0 01-1.2 1.2H3.2A1.2 1.2 0 012 13V5.3z"/></svg>',
];

function winInit() {
  winLayer = $("winlayer");
  if (!winLayer) return;
  for (let i = 0; i < WIN_SLOTS; i++) {
    const el = document.createElement("div");
    el.className = "win";
    el.style.display = "none";
    el.innerHTML =
      '<div class="win-bar"><span class="win-ico">' + WIN_ICONS[i] + '</span>'
      + '<span class="win-title"></span>'
      + '<span class="win-ctl">'
      + '<button class="min" data-act="1" title="最小化"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="currentColor" stroke-width="1.2"/></svg></button>'
      + '<button class="max" data-act="2" title="最大化"><svg viewBox="0 0 10 10"><rect x="2.2" y="2.2" width="5.6" height="5.6" rx=".8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></button>'
      + '<button class="close" data-act="0" title="关闭"><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>'
      + '</span></div>'
      + (i === 0 ? '<div class="win-body term-dom"><div class="tcur"></div></div>'
                 : '<div class="win-body panel-dom"></div>');
    winLayer.appendChild(el);
    const body = el.querySelector(".win-body");
    const we = { el, body, w: 0, h: 0, cx: 0, cy: 0, dragging: false, pending: false, px: 0, py: 0 };
    winEls.push(we);

    /* ── 拖动：宿主自己搬，不等内核 ──
       旧路径是 pointermove 写鼠标寄存器 → 内核下一轮主循环读 → 改坐标 →
       宿主再读回来改 style，中间隔 1-2 帧，手感是「追着鼠标跳」。
       现在直接改 el.style.left/top，同一帧生效；松手后把最终逻辑坐标
       写回内核（WIN_POS_PA），让内核里的位置仍然是权威。 */
    const bar = el.querySelector(".win-bar");
    bar.addEventListener("pointerdown", (ev) => {
      if (ev.target.closest(".win-ctl")) return;
      ev.stopPropagation();          /* 别再让 #os 给内核发一次按下 */
      if (!M) return;
      /* 点标题栏同时聚焦该窗口 */
      sendWinCmd(i * 10 + 5);

      const r = el.getBoundingClientRect();
      const osR = desk().getBoundingClientRect();
      const offX = ev.clientX - r.left, offY = ev.clientY - r.top;
      we.dragging = true;
      we.pending = false;
      hostDragActive = true;
      el.classList.add("dragging");
      we.px = r.left; we.py = r.top;

      const move = (e2) => {
        if (!we.dragging) return;
        const x = Math.max(-r.width + 120, Math.min(osR.width - 90, e2.clientX - osR.left - offX));
        const y = Math.max(0, Math.min(osR.height - 76, e2.clientY - osR.top - offY));
        el.style.left = x + "px";
        el.style.top = y + "px";
        we.px = x; we.py = y;
        el.classList.remove("snap-l", "snap-r", "snap-t");
        /* 拖到屏幕边缘就亮吸附预览（Win11 的 Snap Layouts） */
        const L = deskTransform(osR.width, osR.height);
        const px2 = e2.clientX - osR.left, py2 = e2.clientY - osR.top;
        let z = snapZonePx(px2, py2, osR.width, osR.height);
        if (!z) z = snapToNeighbor(px2, py2, i, L, osR);
        we.zone = z;
        snapShow(we.zone);
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        we.dragging = false;
        hostDragActive = false;
        el.classList.remove("dragging");
        snapHide();
        if (!M) return;
        const L = deskTransform(osR.width, osR.height);
        if (we.zone) {
          /* 吸附：位置和尺寸一起交给内核，去掉 dragging 让 .win 的 transition 接管 */
          const [sx, sy, sw, sh] = SNAP[we.zone];
          setWinRect(i, sx, sy, sw, sh);
          we.pending = false;
          el.classList.remove("snap-l", "snap-r", "snap-t");
          if (we.zone === "left") el.classList.add("snap-l");
          else if (we.zone === "right") el.classList.add("snap-r");
          else if (we.zone === "top") el.classList.add("snap-t");
          else if (we.zone) { el.classList.add(we.zone.includes("l") ? "snap-l" : "snap-r", "snap-t"); }
          we.el.style.left = (L.ox + sx * L.scale) + "px";
          we.el.style.top = (L.oy + sy * L.scale) + "px";
          we.el.style.width = (sw * L.scale) + "px";
          we.el.style.height = (sh * L.scale) + "px";
        } else {
          we.pending = true;
          we.pendingUntil = Date.now() + 600;
          setWinPos(i, Math.round((we.px - L.ox) / L.scale), Math.round((we.py - L.oy) / L.scale));
        }
        we.zone = null;
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    });

    /* 双击标题栏最大化/还原（Win11 标准行为） */
    bar.addEventListener("dblclick", (ev) => {
      if (ev.target.closest(".win-ctl")) return;
      if (M) sendWinCmd(i * 10 + 2);
    });

    /* 窗控按钮：直接下发命令字，不让前端重算命中坐标
       （视觉顺序和内核坐标顺序对不上，试过几轮都有偏差） */
    const maxBtn = el.querySelector(".win-ctl .max");
    if (maxBtn) {
      maxBtn.addEventListener("pointerenter", () => {
        clearTimeout(snapPickerTimer);
        clearTimeout(snapPickerHideTimer);
        snapPickerTimer = setTimeout(() => snapPickerShow(i, maxBtn), 450);
      });
      maxBtn.addEventListener("pointerleave", () => {
        clearTimeout(snapPickerTimer);
        snapPickerHideTimer = setTimeout(snapPickerHide, 260);
      });
    }

    el.querySelectorAll(".win-ctl button").forEach((b) => {
      b.addEventListener("pointerdown", (ev) => ev.stopPropagation());
      b.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (!M) return;
        const act = +b.dataset.act;
        if (act === 0) {
          /* 关闭先播 120ms 动画，否则窗口是「啪」地消失 */
          el.classList.add("closing");
          setTimeout(() => {
            el.classList.remove("closing");
            sendWinCmd(i * 10 + 0);
          }, 120);
        } else if (act === 1) {
          /* 最小化：向 dock 方向缩小淡出 */
          el.classList.add("minimizing");
          setTimeout(() => {
            el.classList.remove("minimizing");
            sendWinCmd(i * 10 + 1);
          }, 167);
        } else {
          sendWinCmd(i * 10 + act);
        }
      });
    });

    /* 标题栏右键：窗口菜单 */
    bar.addEventListener("contextmenu", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      showCtx([
        { label: "还原", action: () => { sendWinCmd(i * 10 + 6); } },
        { label: "最小化", action: () => { sendWinCmd(i * 10 + 1); } },
        { label: "最大化", action: () => { sendWinCmd(i * 10 + 2); } },
        "-",
        { label: "关闭", action: () => {
            el.classList.add("closing");
            setTimeout(() => {
              el.classList.remove("closing");
              sendWinCmd(i * 10 + 0);
            }, 120);
          } },
      ], ev.clientX, ev.clientY);
    });
  }
  const tray = $("dockTray");
  if (tray) {
    tray.addEventListener("pointerdown", (e) => e.stopPropagation());
    tray.addEventListener("click", (e) => { e.stopPropagation(); trayPanelShow(); });
    tray.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      e.stopPropagation();
      trayPanelHide();
      showCtx([
        { label: "调整日期和时间", action: () => launch("settings") },
        { label: "任务栏设置", action: () => launch("settings") },
      ], e.clientX, e.clientY);
    });
  }
  $("startBtn").onclick = (e) => { e.stopPropagation(); openStartMenu(); };
  $("dbgBtn").onclick = (e) => { e.stopPropagation(); toggleDrawer(); };
  $("dwClose").onclick = () => toggleDrawer(false);

  /* 桌面右键菜单 */
  desk().addEventListener("contextmenu", (ev) => {
    if (ev.target.closest(".win,#dock,#startMenu,#drawer")) return;
    ev.preventDefault();
    showCtx([
      { label: "刷新", action: () => { iconsRender(); } },
      "-",
      { label: "显示设置", action: () => launch("settings") },
      { label: "关于本机", action: () => launch("about") },
    ], ev.clientX, ev.clientY);
  });

  /* 点桌面空白处关开始菜单 */
  desk().addEventListener("pointerdown", (e) => {
    if (!e.target.closest("#startMenu") && !e.target.closest("#startBtn")) closeStartMenu();
    if (!e.target.closest("#ctxMenu")) hideCtx();
    if (!e.target.closest("#trayPanel") && !e.target.closest("#dockTray")) trayPanelHide();
  }, true);
}

/* 800x600 逻辑桌面在窗口里的等比变换。
   鼠标换算和窗口摆放必须共用同一套，否则命中和视觉会错位。
   availH 只扣掉 dock 本身（48），不再额外扣 —— 扣多了最大化窗口
   会在 dock 上方留一条几十像素的壁纸缝。 */
function deskTransform(w, h) {
  const DOCK = 48;
  const availW = w, availH = h - DOCK;
  const scale = Math.min(availW / 800, availH / 600) * 0.985;
  return { scale, ox: (availW - 800 * scale) / 2, oy: (availH - 600 * scale) / 2 };
}

function winReadStr(addr, max) {
  const B = M.HEAPU8;
  const off = M._rv_ram_ptr() + (addr - 0x80000000);
  let s = "";
  for (let i = 0; i < max; i++) {
    const c = B[off + i];
    if (!c) break;
    s += String.fromCharCode(c);
  }
  return s;
}

/* 终端字号自适应：按「列数刚好铺满宽度」定字号，再把行高拉伸填满高度。
   这样 61x22 的网格在任何窗口尺寸下都不折行、不留大片空白。 */
let monoRatio = 0;
function monoCharRatio() {
  if (monoRatio) return monoRatio;
  const c = document.createElement("canvas").getContext("2d");
  const fam = getComputedStyle(document.body).getPropertyValue("--font-mono") || "monospace";
  c.font = '400 100px ' + fam;
  const w = c.measureText("MMMMMMMMMM").width / 10 / 100;
  monoRatio = w > 0.2 && w < 1.4 ? w : 0.6;
  return monoRatio;
}

function termLayout(host, force) {
  if (!host || !termCols || !termRows) return;
  const padX = 12, padY = 10;
  const W = host.clientWidth - padX * 2;
  const H = host.clientHeight - padY * 2;
  if (W <= 0 || H <= 0) return;
  const ratio = monoCharRatio();
  /* 字号上限 15px：再大就不是终端而是大字报了。
     宽度铺不满时右侧留白，真实终端在宽窗口里也是这样。 */
  let fs = (W / (termCols * ratio)) * termScale;
  fs = Math.max(7.5, Math.min(15, fs));
  const cw = fs * ratio;
  if (cw * termCols > W + 0.5) fs = Math.max(7.5, W / (termCols * ratio));
  /* 行高：优先铺满高度，但压在 1.15–1.55 倍字号之间，避免字大行稀 */
  let lh = H / termRows;
  lh = Math.max(fs * 1.15, Math.min(fs * 1.55, lh));
  const key = fs.toFixed(2) + "|" + lh.toFixed(2);
  if (!force && host.dataset.fsKey === key) return;
  host.dataset.fsKey = key;
  host.style.fontSize = fs.toFixed(2) + "px";
  host.style.lineHeight = lh.toFixed(2) + "px";
  host.style.setProperty("--fs", fs.toFixed(2) + "px");
  host.style.setProperty("--lh", lh.toFixed(2) + "px");
  termCharW = fs * ratio;
  termLineH = lh;
  termPlaceCursor();
}

/* ══ 终端网格渲染 ══ */
let termEls = null, termRows = 0, termCols = 0, termSeq = [];
let termCharW = 8.4, termLineH = 20;
let termCurX = 0, termCurY = 0, termCurVis = 0;

function termRender() {
  if (!M) return;
  const A = M.HEAPU32;
  const tb = guestOff(TERM_SYNC_PA);
  if (A[tb] !== 0x54524D31) return;

  const cols = A[tb + 1], rows = A[tb + 2];
  const cellsAddr = A[tb + 3] >>> 0, rowseqAddr = A[tb + 4] >>> 0;
  const cx = A[tb + 5], cy = A[tb + 6], cvis = A[tb + 7];
  const host = winEls[0] && winEls[0].body;
  if (!host || !cols || !rows) return;

  if (!termEls || termRows !== rows || termCols !== cols) {
    termRows = rows; termCols = cols;
    termSeq = new Array(rows).fill(-1);
    host.querySelectorAll(".term-line").forEach((n) => n.remove());
    termEls = [];
    for (let y = 0; y < rows; y++) {
      const d = document.createElement("div");
      d.className = "term-line";
      host.appendChild(d);
      termEls.push(d);
    }
    host.dataset.fsKey = "";
    termLayout(host, true);
  }

  const offC = guestOff(cellsAddr), offR = guestOff(rowseqAddr);
  for (let y = 0; y < rows; y++) {
    const rseq = A[offR + y];
    if (rseq === termSeq[y]) continue;
    termSeq[y] = rseq;
    let txt = "";
    for (let x = 0; x < cols; x++) {
      const cp = A[offC + y * cols + x];
      if (cp === 0xFFFFFFFF) continue;          /* 宽字符右半格 */
      if (cp === 0 || cp === 32) { txt += " "; continue; }
      txt += String.fromCodePoint(cp);
    }
    termEls[y].textContent = txt.replace(/\s+$/, "");
  }

  termCurX = cx; termCurY = cy; termCurVis = cvis;
  termPlaceCursor();
}

function termPlaceCursor() {
  const host = winEls[0] && winEls[0].body;
  if (!host) return;
  const cur = host.querySelector(".tcur");
  if (!cur) return;
  host.classList.toggle("nocursor", !termCurVis);
  cur.style.left = (12 + termCurX * termCharW) + "px";
  cur.style.top = (10 + termCurY * termLineH) + "px";
  cur.style.width = termCharW.toFixed(2) + "px";
  cur.style.height = termLineH.toFixed(2) + "px";
}

/* ══ 面板渲染（进程表 / 文件表）══ */
let procSig = "", fileSig = "";
let sysInfo = { nproc: 0, nfile: 0, nrun: 0 };

function readStrAt(byteOff, max) {
  const B = M.HEAPU8;
  let s = "";
  for (let i = 0; i < max; i++) {
    const c = B[byteOff + i];
    if (!c) break;
    s += String.fromCharCode(c);
  }
  return s;
}

function panelsRender() {
  if (!M) return;
  const A = M.HEAPU32, ram = M._rv_ram_ptr();

  /* 系统状态 */
  const sb = (ram + (SYS_SYNC_PA - 0x80000000)) >>> 2;
  if (A[sb] === 0x53595331) {
    sysInfo.nproc = A[sb + 4];
    sysInfo.nfile = A[sb + 5];
    sysInfo.nrun = A[sb + 6];
  }

  /* 进程表 */
  const mon = winEls[1] && winEls[1].body;
  if (mon) {
    const base = (ram + (PROC_SYNC_PA - 0x80000000)) >>> 2;
    const rows = [];
    for (let i = 0; i < 8; i++) {
      const b = base + i * 5;
      if (!A[b + 4]) continue;
      const st = ["READY", "RUN", "EXIT", "—"][A[b + 1]] || "?";
      rows.push({ pid: A[b], st, pc: "0x" + (A[b + 2] >>> 0).toString(16) });
    }
    const sig = JSON.stringify(rows);
    if (sig !== procSig) {
      procSig = sig;
      let h = '<table class="ptab"><colgroup><col style="width:44px"><col style="width:68px"><col></colgroup>'
        + '<thead><tr><th>PID</th><th>STATE</th><th>PC</th></tr></thead><tbody>';
      for (const r of rows)
        h += '<tr' + (r.st === "RUN" ? ' class="run"' : '') + '><td>' + r.pid
           + '</td><td>' + r.st + '</td><td>' + r.pc + '</td></tr>';
      h += '</tbody></table>';
      mon.innerHTML = h;
      panelRowHeight(mon, rows.length);
    }
  }

  /* 文件表 */
  const fs = winEls[2] && winEls[2].body;
  if (fs) {
    const base = (ram + (FILE_SYNC_PA - 0x80000000)) >>> 2;
    const rows = [];
    for (let i = 0; i < 16; i++) {
      const name = readStrAt(ram + (FILE_SYNC_PA - 0x80000000) + i * 40, 24);
      if (!name) continue;
      rows.push({ name, size: A[base + i * 10 + 6], dir: A[base + i * 10 + 7] === 1 });
    }
    const sig = JSON.stringify(rows);
    if (sig !== fileSig) {
      fileSig = sig;
      let h = '<table class="ftab"><colgroup><col><col style="width:66px"></colgroup>'
        + '<thead><tr><th>NAME</th><th class="r">SIZE</th></tr></thead><tbody>';
      for (const r of rows)
        h += '<tr><td class="nm">' + (r.dir ? "▸ " : "") + r.name + '</td>'
           + '<td class="r ' + (r.dir ? "dim" : "mono") + '">' + (r.dir ? "—" : r.size) + '</td></tr>';
      h += '</tbody></table>';
      fs.innerHTML = h;
      panelRowHeight(fs, rows.length);
    }
  }
}

/* 面板行高：行数少就把行拉高，避免窗口下半截一片空。
   上限 40px —— 再高就不像列表而像画廊了。 */
function panelRowHeight(el, n) {
  const H = el.clientHeight;
  if (H <= 0 || !n) return;
  const rh = Math.max(32, Math.min(40, (H - 32) / n));
  el.style.setProperty("--rh", rh.toFixed(1) + "px");
}

/* ══ 窗口同步：位置 / 尺寸 / 标题 / 焦点 / Dock 指示 ══
   每帧都写 style.left/top/width/height/zIndex 会强制浏览器重算样式，
   实测把吞吐从 10+ M/s 拉到 5 M/s。这里先比签名，真的变了才写。 */
function winSync() {
  if (!winLayer || !M) return;
  const A = M.HEAPU32;
  const base = guestOff(WIN_INFO_PA);
  const osEl = desk();
  const L = deskTransform(osEl.clientWidth, osEl.clientHeight);
  const { scale, ox, oy } = L;

  for (let i = 0; i < WIN_SLOTS; i++) {
    const b = base + i * 11;
    const titleAddr = A[b + 3] >>> 0, focused = A[b + 4], visible = A[b + 5];
    const x = A[b + 6], y = A[b + 7], z = A[b + 8];
    const ww = A[b + 9] || A[b + 1], wh = A[b + 10] || A[b + 2];
    const we = winEls[i];
    if (!we) continue;

    if (!visible || !ww || !wh) {
      if (we.sig !== "hidden") { we.el.style.display = "none"; we.sig = "hidden"; }
      continue;
    }
    const left = (ox + x * scale).toFixed(1);
    const top = (oy + y * scale).toFixed(1);
    const wid = (ww * scale).toFixed(1);
    const hei = (wh * scale).toFixed(1);

    /* 拖动期间位置由宿主说了算；松手后等内核把位置记下来再交还控制权，
       否则下一帧会用内核里的旧坐标把刚拖到的位置覆盖回去（视觉上「跳回」）。 */
    if (we.pending && !we.dragging) {
      const wantL = ox + x * scale, wantT = oy + y * scale;
      if ((Math.abs(wantL - we.px) < 2 && Math.abs(wantT - we.py) < 2)
          || Date.now() > we.pendingUntil) {
        we.pending = false;
      }
    }
    const locked = we.dragging || we.pending;
    const sig = (locked ? "L" : left) + "," + (locked ? "L" : top) + "," + wid + "," + hei + "," + z + "," + focused;
    if (we.sig !== sig) {
      we.sig = sig;
      const s = we.el.style;
      s.display = "flex";
      if (!locked) { s.left = left + "px"; s.top = top + "px"; }
      s.width = wid + "px";
      s.height = hei + "px";
      s.zIndex = 10 + z;
      we.el.classList.toggle("focused", !!focused);
    }

    const t = winReadStr(titleAddr, 32);
    const tEl = we.el.querySelector(".win-title");
    if (tEl && tEl.dataset.t !== t) { tEl.dataset.t = t; tEl.textContent = t; }

    const cw = Math.round(ww * scale), ch = Math.round(wh * scale);
    if (we.w !== cw || we.h !== ch) {
      we.w = cw; we.h = ch;
      if (i === 0) termLayout(we.body, true);
      else panelRowHeight(we.body, we.body.querySelectorAll("tbody tr").length);
    }
  }

  /* Dock 指示条 */
  const box = $("dockApps");
  if (box) {
    const kids = box.children;
    for (let i = 0; i < WIN_SLOTS; i++) {
      const d = kids[i];
      if (!d) continue;
      const on = !!A[base + i * 11 + 5];
      if (d.dataset.on !== String(on)) {
        d.dataset.on = String(on);
        d.classList.toggle("active", on);
      }
    }
  }
}

/* ══ 时钟 / 速率 ══ */
function dockClock() {
  const el = $("clock");
  if (!el) return;
  const n = new Date();
  const p = (v) => String(v).padStart(2, "0");
  const txt = p(n.getHours()) + ":" + p(n.getMinutes());
  if (el.textContent !== txt) el.textContent = txt;
  const dEl = $("clockDate");
  if (dEl) dEl.textContent = (n.getMonth() + 1) + "/" + n.getDate();
  const rEl = $("trayRate");
  if (rEl) rEl.textContent = curRate ? (curRate / 1e6).toFixed(1) + " M/s" : "—";
  const ar = $("aboutRate");
  if (ar) ar.textContent = curRate ? (curRate / 1e6).toFixed(1) + " M/s" : "—";
}

/* ══ 鼠标 → guest ══
   内核的 fb_mouse_pos 靠「事件号变了」来消费一次鼠标事件（e == last_ev 就丢弃）。
   所以这里必须写一个单调递增的序号，而不是每次都写 1 ——
   写 1 的话只有第一次能被读到，之后所有移动和点击都被内核当成重复事件丢掉，
   表现就是窗口拖不动、按钮点不动。 */
let evSeq = 0;
/* 宿主正在自己拖窗口。这个期间 pointermove 仍会冒泡到 #os，
   不挡住的话内核也会按同一批坐标拖同一个窗口，两边互相覆盖。 */
let hostDragActive = false;

function pushMouse(x, y, btn) {
  if (!M) return;
  const wk = (a, v) => M._rv_mem_write32(a, v);
  wk(MOUSE_X, x);
  wk(MOUSE_Y, y);
  wk(MOUSE_BTN, btn);
  evSeq = (evSeq + 1) & 0x7fffffff;
  if (!evSeq) evSeq = 1;
  wk(MOUSE_EV, evSeq);
}

function screenPointerBind() {
  const cv = desk();
  if (!cv) return;

  function toFb(e) {
    const r = cv.getBoundingClientRect();
    const L = deskTransform(r.width, r.height);
    const x = Math.round((e.clientX - r.left - L.ox) / L.scale);
    const y = Math.round((e.clientY - r.top - L.oy) / L.scale);
    return [Math.max(0, Math.min(799, x)), Math.max(0, Math.min(599, y))];
  }

  /* 这些区域是宿主自己画的 UI，点它们绝不能同时给内核发一次点击：
     否则点一下窗口的「关闭」，pointerup 冒泡到 #os 又给内核发了一次
     按下，内核按自己的坐标命中测试把它判成「最大化」——
     表现就是关个窗口却把它最大化了。 */
  const isHostUI = (t) => !!(t && t.closest
    && t.closest("#dock,#drawer,#startMenu,.host-win,.win-ctl"));
  let hostUiDown = false;

  cv.addEventListener("pointermove", (e) => {
    if (!M || hostUiDown || hostDragActive) return;
    const [x, y] = toFb(e);
    pushMouse(x, y, e.buttons ? 1 : 0);
  }, { passive: true });

  cv.addEventListener("pointerdown", (e) => {
    if (!M) return;
    if (isHostUI(e.target)) { hostUiDown = true; return; }
    const ime = $("ime");
    if (ime) { e.preventDefault(); ime.focus(); }
    const [x, y] = toFb(e);
    /* 先补一次抬起，清掉内核可能残留的按下状态，再按下去 */
    pushMouse(x, y, 0);
    setTimeout(() => pushMouse(x, y, 1), 20);
  });

  cv.addEventListener("pointerup", (e) => {
    const wasHost = hostUiDown;
    hostUiDown = false;
    if (!M || wasHost || isHostUI(e.target)) return;
    const [x, y] = toFb(e);
    pushMouse(x, y, 1);
    setTimeout(() => pushMouse(x, y, 0), 60);
  });
}

function focusTerm() {
  const ime = $("ime");
  if (ime) ime.focus();
}

/* ══ UART ══ */
let tailBuf = "";
function sendCmd(cmd) {
  if (!M || !loaded) return;
  for (const b of _enc.encode(cmd + "\r")) M._rv_uart_write(b);
}

const term = $("term");
function appendOut(s) {
  if (quietOut) return;
  term.textContent += s;
  if (term.textContent.length > 40000) term.textContent = term.textContent.slice(-20000);
}

function pumpUart() {
  if (!M) return;
  let n, s = "";
  while ((n = M._rv_uart_read(ubuf, 4096)) > 0) {
    s += _uartDec.decode(M.HEAPU8.subarray(ubuf, ubuf + n), { stream: true });
    total += n;
  }
  if (s) {
    appendOut(s);
    tailBuf = (tailBuf + s).slice(-160);
    sniff(s);
  }
  if (speed > 1 && tailBuf.indexOf("rvsh>") >= 0) speed = 1;
  const tx = $("txInfo");
  if (tx) tx.textContent = total.toLocaleString() + " B";
}

/* ══ 状态嗅探（从 UART 里认 JSON，零侵入）══ */
let sniffBuf = "";
const capsSeen = new Map();

function sniff(s) {
  sniffBuf = (sniffBuf + s).slice(-12000);

  const allPs = [...sniffBuf.matchAll(/\{"nproc":\d+,"procs":\[[^\]]*\]\}/g)];
  if (allPs.length) {
    try { renderProcs(JSON.parse(allPs[allPs.length - 1][0])); } catch (e) {}
  }

  const re = /\{"cap":"([^"]+)","usage":"([^"]*)"/g;
  let m, before = capsSeen.size;
  while ((m = re.exec(sniffBuf)) !== null) capsSeen.set(m[1], m[2]);
  if (capsSeen.size !== before) renderCaps();

  const evRe = /^(-?\d+) (-?\d+) (spawn|exit|ecall|restore|reset|snapshot|plan|apply|sbrk|fork|setreg|getpid|yield) (\S+) (\S+) (-?\d+) code=(\d+)/;
  const evRows = [];
  for (const line of sniffBuf.split("\n")) {
    const mm = line.trim().match(evRe);
    if (mm) evRows.push(mm);
  }
  if (evRows.length) renderEvents(evRows.reverse());

  const allFs = [...sniffBuf.matchAll(/\{"files":\[[^\]]*\]\}/g)];
  if (allFs.length) {
    try { renderFiles(JSON.parse(allFs[allFs.length - 1][0])); } catch (e) {}
  }

  const allSn = [...sniffBuf.matchAll(/\{"snapshots":\[[^\]]*\]\}/g)];
  const allPl = [...sniffBuf.matchAll(/\{"plans":\[[^\]]*\]\}/g)];
  if (allSn.length || allPl.length) {
    let sj = null, pj = null;
    try { if (allSn.length) sj = JSON.parse(allSn[allSn.length - 1][0]); } catch (e) {}
    try { if (allPl.length) pj = JSON.parse(allPl[allPl.length - 1][0]); } catch (e) {}
    renderSnaps(sj, pj);
  }
}

function renderEvents(rows) {
  const bySeq = new Map();
  for (const r of rows) bySeq.set(r[1], r);
  const uniq = [...bySeq.values()].sort((a, b) => Number(b[1]) - Number(a[1]));
  const cls = (t) => (t === "spawn" ? "spawn" : t === "exit" ? "exit" : "ecall");
  let h = "";
  for (const r of uniq.slice(0, 16))
    h += '<div class="ev ' + cls(r[3]) + '"><span class="t">' + r[1] + '</span>'
       + '<span>' + r[2] + '</span><span class="a">' + r[3] + '</span></div>';
  const el = $("events");
  if (el) el.innerHTML = h || '<div class="hint">无</div>';
}

function renderSnaps(snaps, plans) {
  let h = "";
  if (snaps && snaps.snapshots)
    for (const x of snaps.snapshots) h += '<div class="snap"><b>快照 ' + x.id + '</b> @' + x.evt_seq + '</div>';
  if (plans && plans.plans)
    for (const x of plans.plans) h += '<div class="snap"><b>计划 ' + x.id + '</b> ' + x.intent + ' ' + (x.arg || "") + '</div>';
  const el = $("snaps");
  if (el) el.innerHTML = h || '<div class="hint">无</div>';
}

function renderFiles(o) {
  const list = (o && o.files) || [];
  const el = $("files");
  if (!el) return;
  if (!list.length) { el.innerHTML = '<div class="hint">空</div>'; return; }
  let h = "";
  for (const f of list) {
    const isDir = f.type === "dir";
    h += '<div class="frow"><b>' + (isDir ? "▸ " : "") + f.name + '</b>'
       + '<span>' + (isDir ? "dir" : f.size + " B") + '</span></div>';
  }
  el.innerHTML = h;
}

function renderProcs(o) {
  let h = '<div class="prow ph"><span>PID</span><span>状态</span><span>PC</span><span>轮</span></div>';
  for (const p of o.procs) {
    if (p.state === "UNUSED") continue;
    const cls = p.state === "RUN" ? "run" : p.state === "READY" ? "ready" : "exit";
    h += '<div class="prow ' + cls + '"><span>' + p.pid + '</span><span>' + p.state + '</span>'
       + '<span>' + p.pc + '</span><span>' + p.nrun + '</span></div>';
  }
  const el = $("procs");
  if (el) el.innerHTML = h;
}

function renderCaps() {
  if (!capsSeen.size) return;
  let h = "";
  for (const [name, v] of capsSeen) h += '<div class="cap"><b>' + name + '</b><span>' + v + '</span></div>';
  const el = $("caps");
  if (el) el.innerHTML = h;
}

/* ══ 执行引擎 ══ */
function stepBudget(ms) {
  const t0 = performance.now();
  let done = 0;
  while (performance.now() - t0 < ms) {
    for (let k = 0; k < 400; k++) {
      const r = M._rv_step();
      if (r !== 0) return { halted: r, n: done };
      done++;
    }
  }
  return { halted: 0, n: done };
}

function tick() {
  if (!M || !loaded || !ticking) { ticking = false; return; }
  /* 常驻档每帧给 3ms：1ms 只够维持一个「能响应」的 shell，
     跑 run/fork 这类用户程序时明显发钝。3ms 约 18% 单核，交互依然跟手。 */
  const res = stepBudget(speed >= 2 ? 45 : 6);
  pumpUart();
  winSync();
  termRender();
  panelsRender();
  dockClock();
  frameNo++;
  if (speed > 1 && frameNo > 45) speed = 1;
  if (frameNo % 10 === 0) render();
  if (res.halted !== 0) {
    halt();
    setProgress(100, "结束");
    render();
    return;
  }
  tm = requestAnimationFrame(tick);
}

function startTicking() {
  if (!M || !loaded) return;
  speed = 2;
  running = true;
  const br = $("bRun"), bs = $("bStep");
  if (br) br.disabled = true;
  if (bs) bs.disabled = true;
  if (ticking) return;
  ticking = true;
  tm = requestAnimationFrame(tick);
}

function halt() {
  running = false;
  ticking = false;
  if (tm) { cancelAnimationFrame(tm); tm = null; }
  if (loaded) {
    const br = $("bRun"), bs = $("bStep");
    if (br) br.disabled = false;
    if (bs) bs.disabled = false;
  }
}

/* ══ 寄存器面板 ══ */
let prev = {}, regEditing = false;
function render() {
  if (!M || !loaded) return;
  const cy = M._rv_cycles() >>> 0;
  const now = performance.now();
  if (prevCy && now > prevCyT + 400) {
    curRate = (cy - prevCy) / ((now - prevCyT) / 1000);
    prevCy = cy; prevCyT = now;
  } else if (!prevCy) { prevCy = cy; prevCyT = now; }
  /* 抽屉收着的时候这些 DOM 一个都看不见，没必要每 10 帧重建 32 行 */
  if (!document.body.classList.contains("drawer")) return;

  const vCy = $("vCy");
  if (vCy) vCy.textContent = cy.toLocaleString();
  const vIn = $("vIn");
  if (vIn) vIn.textContent = (curRate / 1e6).toFixed(1) + " M/s";
  const vPc = $("vPc"), vPv = $("vPv");
  if (vPc) vPc.textContent = hx(M._rv_pc());
  if (vPv) vPv.textContent = PRIV[M._rv_priv()] ?? "?";

  let r = "";
  for (let i = 0; i < 32; i++) {
    const v = M._rv_reg(i) >>> 0;
    const chg = (i !== 0 && prev[i] !== undefined && prev[i] !== v) ? " chg" : "";
    r += '<div class="rg' + chg + '" data-r="' + i + '"><span class="n">' + ABI[i]
       + '</span><span class="v">' + hx(v) + '</span></div>';
    prev[i] = v;
  }
  const regEl = $("reg");
  if (regEl && !regEditing && regEl.dataset.sig !== r) {
    regEl.dataset.sig = r;
    regEl.innerHTML = r;
  }
}

/* ══ 启动 ══ */
function boot(bytes, name) {
  if (!M) return;
  setProgress(32, "正在装载内核…");
  halt();
  M._rv_reset(); M._rv_uart_clear();
  const p = M._malloc(bytes.length);
  M.HEAPU8.set(bytes, p);
  const ok = M._rv_load(p, bytes.length);
  M._free(p);
  if (!ok) { setProgress(0, "镜像加载失败"); return; }
  setProgress(62, "内核已装载，启动 shell…");
  loaded = true; total = 0;
  sniffBuf = ""; capsSeen.clear(); tailBuf = ""; quietOut = false;
  procSig = ""; fileSig = "";
  ["procs", "events", "snaps", "caps", "files"].forEach((id) => {
    const e = $(id);
    if (e) e.innerHTML = '<div class="hint">读取中…</div>';
  });
  ["bRun", "bStop", "bStep", "bReset"].forEach((id) => { const e = $(id); if (e) e.disabled = false; });
  startTicking();

  /* 内核已经打好 MOTD 并停在自己的提示符上，这里只补一次墙钟时间。
     @ 前缀的命令对窗口网格零痕迹，所以不会多出空行或重复提示符。 */
  setTimeout(() => {
    sendCmd("@manifest");
    sendCmd("@settime " + Math.floor(Date.now() / 1000 - new Date().getTimezoneOffset() * 60));
  }, 800);
}

async function bootUrl(u, name) {
  setProgress(12, "正在下载镜像…");
  u = u + (u.includes("?") ? "&" : "?") + "t=" + Date.now();
  try {
    const r = await fetch(u);
    if (!r.ok) throw 0;
    setProgress(26, "镜像就绪…");
    boot(new Uint8Array(await r.arrayBuffer()), name);
  } catch (e) {
    setProgress(0, "镜像不可用");
  }
}

/* 调试抽屉 */
function toggleDrawer(force) {
  const on = force === undefined ? !document.body.classList.contains("drawer") : force;
  document.body.classList.toggle("drawer", on);
  if (on) refreshPanels();
}

function refreshPanels() {
  if (!M || !loaded) return;
  quietOut = true;
  sendCmd("@ps");
  setTimeout(() => sendCmd("@log last 8"), 260);
  setTimeout(() => sendCmd("@snaps"), 520);
  setTimeout(() => sendCmd("@plans"), 780);
  setTimeout(() => sendCmd("@ls"), 1040);
  setTimeout(() => { quietOut = false; }, 1600);
}

/* ══ 输入 ══ */
const ime = $("ime");
document.addEventListener("input", (e) => {
  if (!loaded || !M) return;
  if (!e.target || e.target.id !== "ime") return;
  if (e.isComposing || e.target.isComposing) return;
  const txt = e.target.value;
  if (!txt) return;
  e.target.value = "";
  for (const b of _enc.encode(txt)) M._rv_uart_write(b);
  if (!ticking) startTicking();
});

document.addEventListener("paste", (e) => {
  if (!loaded || !M) return;
  const t = e.clipboardData || window.clipboardData;
  if (!t) return;
  const txt = t.getData("text");
  if (!txt) return;
  e.preventDefault();
  for (const b of _enc.encode(txt)) M._rv_uart_write(b);
  if (!ticking) startTicking();
});

/* 这些是宿主的可聚焦控件：键盘焦点在它们身上时，按键交给浏览器/控件自己处理，
   不要再送进 guest 终端 —— 否则 Tab 永远移不动焦点，Enter 会既开应用又敲回车。 */
const UI_FOCUS = ".dicon,.dock-app,.dock-btn,.sm-tile,.sm-ri,.win-ctl,#startMenu";

document.addEventListener("keydown", (e) => {
  if (!loaded || !M) return;
  if (e.key === "F12") { toggleDrawer(); e.preventDefault(); return; }
  if (e.key === "Escape") { closeStartMenu(); return; }
  const tag = e.target && e.target.tagName;
  if (e.target && e.target.id !== "ime" && (tag === "INPUT" || tag === "TEXTAREA")) return;
  if (e.target && e.target.closest && e.target.closest(UI_FOCUS)) return;

  /* Ctrl+W 关闭 / Ctrl+M 最小化 当前窗口 */
  if (e.ctrlKey && !e.altKey && !e.metaKey) {
    const k = e.key.toLowerCase();
    if (k === "w" || k === "m") {
      e.preventDefault();
      const ws = window.rv.state.wins;
      const i = ws.findIndex((w) => w.focused && w.visible);
      if (i >= 0) {
        const el = winEls[i] && winEls[i].el;
        if (el) {
          el.classList.add(k === "w" ? "closing" : "minimizing");
          setTimeout(() => {
            el.classList.remove("closing", "minimizing");
            sendWinCmd(i * 10 + (k === "w" ? 0 : 1));
          }, 167);
        }
      }
      return;
    }
  }

  /* Alt+方向：Win11 的 Win+方向 被浏览器占用，这里换成 Alt。
     ←/→ 半屏，↑ 最大化，↓ 还原到默认尺寸。 */
  if (e.altKey && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    const map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "top", ArrowDown: "restore" };
    const z = map[e.key];
    if (z) {
      e.preventDefault();
      const ws = window.rv.state.wins;
      const i = ws.findIndex((w) => w.focused && w.visible);
      if (i >= 0) {
        if (z === "restore") sendWinCmd(i * 10 + 6);
        else setWinRect(i, ...SNAP[z]);
      }
      return;
    }
  }

  if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
    M._rv_uart_write(3); e.preventDefault(); return;
  }
  if (e.key === "Enter") { M._rv_uart_write(13); e.preventDefault(); }
  else if (e.key === "Backspace") { M._rv_uart_write(127); e.preventDefault(); }
  else if (e.key === "Tab") { M._rv_uart_write(9); e.preventDefault(); }
  else if (e.target && e.target.id === "ime") { return; }   /* 普通字符走 input 事件 */
  else if (e.key.length >= 1 && [...e.key].length === 1) {
    for (const b of _enc.encode(e.key)) M._rv_uart_write(b);
    e.preventDefault();
  } else return;
  if (!ticking) startTicking();
});

/* 点终端窗口时把焦点交给输入法入口 */
document.addEventListener("pointerdown", (e) => {
  if (!e.target.closest(".term-dom")) return;
  setTimeout(focusTerm, 0);
}, true);

/* ══ 调试面板按钮 ══ */
try {
  $("bKernel").onclick = () => bootUrl("images/kernel.elf", "mini-kernel");
  $("bTest").onclick = () => bootUrl("images/rv32ui-p-add", "rv32ui-p-add");
  $("bUpload").onclick = () => $("file").click();
  $("file").onchange = (e) => {
    const f = e.target.files[0];
    if (f) f.arrayBuffer().then((b) => boot(new Uint8Array(b), f.name));
  };
  $("bRun").onclick = startTicking;
  $("bStop").onclick = () => { halt(); pumpUart(); };
  $("bStep").onclick = () => {
    if (!loaded) return;
    const r = M._rv_step();
    if (r !== 0) halt();
    pumpUart(); render();
  };
  $("bReset").onclick = () => {
    halt(); M._rv_reset(); M._rv_uart_clear(); prev = {}; total = 0;
    render();
  };
  $("reg").onclick = (e) => {
    const d = e.target.closest(".rg");
    if (!d || !M) return;
    const i = +d.dataset.r, cur = M._rv_reg(i) >>> 0;
    if (i === 0) return;
    const inp = document.createElement("input");
    regEditing = true;
    inp.value = hx(cur);
    d.querySelector(".v").replaceWith(inp);
    inp.focus(); inp.select();
    const done = () => {
      const v = parseInt(inp.value, 16);
      regEditing = false;
      if (!isNaN(v)) M._rv_set_reg(i, v >>> 0);
      render();
    };
    inp.onblur = done;
    inp.onkeydown = (k) => {
      if (k.key === "Enter") inp.blur();
      if (k.key === "Escape") { inp.value = hx(cur); inp.blur(); }
    };
  };
} catch (e) { console.warn("debug panel bind:", e); }

/* ══ AI 操控接口 ══
   目标不是「人类能点」，而是「AI 能读、能改、能验证」。
   这里把内核发布的状态整理成可直接消费的对象。 */
window.rv = {
  get ready() { return !!(M && loaded); },
  get state() {
    if (!M || !loaded) return { ready: false };
    const A = M.HEAPU32, ram = M._rv_ram_ptr();
    const wins = [], procs = [], files = [];
    for (let i = 0; i < 3; i++) {
      const b = (ram + (WIN_INFO_PA - 0x80000000)) >>> 2;
      const o = b + i * 11;
      wins.push({
        id: i, title: winReadStr(A[o + 3], 32), focused: !!A[o + 4], visible: !!A[o + 5],
        x: A[o + 6], y: A[o + 7], z: A[o + 8], w: A[o + 9], h: A[o + 10],
      });
    }
    const pb = (ram + (PROC_SYNC_PA - 0x80000000)) >>> 2;
    for (let i = 0; i < 5; i++) {
      if (!A[pb + i * 5 + 4]) continue;
      procs.push({ pid: A[pb + i * 5], state: ["READY", "RUN", "EXIT"][A[pb + i * 5 + 1]],
                   pc: hx(A[pb + i * 5 + 2]) });
    }
    for (let i = 0; i < 16; i++) {
      const name = readStrAt(ram + (FILE_SYNC_PA - 0x80000000) + i * 40, 24);
      if (name) files.push({ name, size: A[(ram + (FILE_SYNC_PA - 0x80000000)) / 4 + i * 10 + 6] });
    }
    return {
      ready: true, wins, procs, files,
      term: termEls ? termEls.map((e) => e.textContent) : [],
      rate: curRate, cycles: M._rv_cycles() >>> 0, pc: hx(M._rv_pc()),
    };
  },
  type(s) { if (!M || !loaded) return false; for (const b of _enc.encode(s)) M._rv_uart_write(b); if (!ticking) startTicking(); return true; },
  cmd(s) { if (!M || !loaded) return false; sendCmd(s); return true; },
  click(x, y) {
    if (!M) return false;
    pushMouse(x, y, 0);
    setTimeout(() => pushMouse(x, y, 1), 20);
    setTimeout(() => pushMouse(x, y, 0), 110);
    return true;
  },
  launch(id) { launch(id); return true; },
  closeWin(i) { if (M) sendWinCmd(i * 10 + 0); },
  focusWin(i) { if (M) sendWinCmd(i * 10 + 5); },
  drawer(on) { toggleDrawer(on); },
};

/* ══ 启动序列 ══ */
function startRvsim() {
  createRvsim().then((m) => {
    M = m;
    window.__rvsim = m;
    ubuf = m._malloc(4096);
    iconsRender();
    dockRender();
    winInit();
    screenPointerBind();
    setProgress(8, "模拟器就绪，加载镜像…");
    bootUrl("images/kernel.elf", "mini-kernel");

    /* 开机画面由「shell 真的起来了」驱动，不是固定延时 */
    const t0 = Date.now();
    const waitShell = setInterval(() => {
      const host = document.querySelector(".term-dom");
      const ready = host && host.textContent.indexOf("rvsh") >= 0;
      if (ready || Date.now() - t0 > 9000) {
        clearInterval(waitShell);
        setProgress(100, "就绪");
        const sp = $("boot");
        if (sp) {
          setTimeout(() => {
            sp.classList.add("gone");
            setTimeout(() => sp.remove(), 500);
          }, ready ? 120 : 0);
        }
        focusTerm();
      }
    }, 120);
  }).catch((e) => setProgress(0, "wasm 加载失败：" + e));
}

setTimeout(startRvsim, 260);
</script>
