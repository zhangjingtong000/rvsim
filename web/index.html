<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rvsim · RISC-V 迷你机</title>
<style>
:root{
  --bg:#07080a;--s1:#0c0e12;--s2:#111419;--s3:#171b21;
  --line:#1d222a;--line2:#2b323c;
  --fg:#e9ecf0;--fg2:#a3abb6;--fg3:#7b8595;
  --acc:#5eead4;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;
  --mono:ui-monospace,"JetBrains Mono","Sarasa Mono SC","Noto Sans Mono CJK SC",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}

/* 桌面独占全屏：调试器的头尾栏默认隐藏，右上角留一个悬浮开关 */
header{display:none!important;
  height:50px;display:flex;align-items:center;gap:14px;padding:0 18px;
       border-bottom:1px solid var(--line);background:var(--s1)}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand i{font-style:normal;font-size:11px;color:var(--fg3);font-family:var(--mono)}
.grow{flex:1}
#floatDebug{position:fixed;right:14px;top:12px;z-index:60;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;
  font-size:15px;color:rgba(236,241,246,.6);
  background:rgba(20,24,31,.7);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.08);transition:all .15s}
#floatDebug:hover{color:#5eead4;border-color:rgba(94,234,212,.35)}

#dbgToggle{font-size:11.5px;color:var(--fg2);padding:5px 10px;border-radius:6px;
  background:var(--s2);border:1px solid var(--line);cursor:pointer;user-select:none}
#dbgToggle:hover{color:var(--fg);border-color:var(--line2)}
.pill{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;
      color:var(--fg2);padding:5px 12px;border-radius:18px;background:var(--s2);border:1px solid var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--fg3);transition:.2s}
.pill.on .dot{background:var(--acc);box-shadow:0 0 9px var(--acc)}
.pill.ok .dot{background:var(--ok)}
.pill.err .dot{background:var(--err)}

main{display:grid;grid-template-columns:minmax(0,1fr);height:calc(100% - 50px);position:relative}
/* 左右调试面板改为抽屉：默认收起，按 D 或点顶栏按钮打开。
   桌面本身要独占屏幕，否则第一眼像 IDE 调试器而不是操作系统。 */
.col{position:fixed;top:50px;bottom:0;width:300px;background:var(--s1);
     z-index:30;transition:transform .18s ease;overflow-y:auto;padding:16px}
main > .col:first-of-type{left:0;border-right:1px solid var(--line);transform:translateX(-100%)}
main > .col:last-of-type{right:0;border-left:1px solid var(--line);transform:translateX(100%)}
body.drawer-open main > .col:first-of-type{transform:translateX(0)}
body.drawer-open main > .col:last-of-type{transform:translateX(0)}
.col{padding:18px;overflow-y:auto;min-height:0}

/* ── 自定义滚动条 ──
   默认的是浅色系统控件，在这套深色界面里很扎眼。
   这里统一成：透明轨道 + 细滑块 + 主题色高亮，悬停时提亮。
   所有可滚动容器（.col / #caps / #events / #reg / #snaps）共用一套。 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:var(--line2);
  border-radius:3px;
  transition:background .15s;
}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}
::-webkit-scrollbar-thumb:active{background:var(--acc)}
::-webkit-scrollbar-corner{background:transparent}
/* Firefox 走标准属性，效果等价 */
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

.lbl{font-size:11px;letter-spacing:.02em;color:var(--fg3);
     font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:8px;
     padding-bottom:6px;border-bottom:1px solid var(--line)}
.lbl::after{content:none}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--mono);font-size:10px}

button{font:inherit;font-size:12px;color:var(--fg2);background:var(--s2);border:1px solid var(--line2);
       border-radius:6px;padding:6px 11px;cursor:pointer;transition:.14s;white-space:nowrap}
button:hover{background:var(--s3);color:var(--fg);border-color:#3a424e}
button:active{transform:translateY(.5px)}
button:disabled{opacity:.32;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#04241f;font-weight:600}
button.pri:hover{background:#7df0dd}
button.wide{flex:1}
.row{display:flex;gap:6px}

.kv{display:flex;justify-content:space-between;align-items:baseline;padding:2.5px 0;
    font-family:var(--mono);font-size:12px}
.kv .k{color:var(--fg3);font-family:var(--sans);font-size:11.5px}
.kv .v{color:var(--fg)}

/* 终端：绝对主角 */
.termwrap{display:flex;flex-direction:column;height:100%;padding:0;
  min-height:0;overflow:hidden}   /* flex item 默认 min-height:auto，
                                     不设 0 的话容器会被内容撑开，#term 就永远滚不动 */
.termbar{display:none!important;height:30px;display:flex;align-items:center;gap:10px;padding:0 16px;
         border-bottom:1px solid var(--line);background:var(--s1);font-family:var(--mono);font-size:11px;color:var(--fg3)}
.termbar b{color:var(--fg2);font-weight:500}
/* 启动画面：wasm 加载 + 内核启动大概要几秒，这段空白用品牌帧填上 */
#splash{position:fixed;inset:50px 0 0 0;z-index:40;background:#07080a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;transition:opacity .35s ease}
#splash.gone{opacity:0;pointer-events:none}
.sp-logo{font-family:var(--mono);font-size:30px;letter-spacing:.12em;color:var(--fg)}
.sp-sub{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--fg3)}
.sp-bar{width:180px;height:2px;background:var(--line);margin-top:14px;overflow:hidden;border-radius:1px}
.sp-bar i{display:block;height:100%;width:40%;background:var(--acc);
  animation:sp-slide 1.1s ease-in-out infinite}
@keyframes sp-slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* ── 现代桌面：壁纸、圆角窗口、毛玻璃标题栏、Dock ── */
#desk{position:relative;width:100%;height:100%;overflow:hidden;background:#0a0d14}
#wallpaper{position:absolute;inset:0;
  background:
    radial-gradient(1100px 620px at 18% 8%, rgba(88,120,255,.30), transparent 62%),
    radial-gradient(900px 520px at 82% 92%, rgba(45,212,191,.22), transparent 60%),
    radial-gradient(700px 460px at 62% 22%, rgba(168,85,247,.16), transparent 66%),
    linear-gradient(165deg, #10151f 0%, #0a0d14 52%, #070a10 100%)}
#wallpaper::after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:3px 3px}

#winlayer{position:absolute;inset:0}

.win{position:absolute;border-radius:13px;overflow:hidden;
  background:#12161d;
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 18px 48px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.055);
  transition:box-shadow .18s ease, transform .18s ease;
  will-change:transform}
.win.focused{box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 26px 64px -14px rgba(0,0,0,.8), 0 0 0 1px rgba(94,234,212,.28)}
.win-bar{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;
  font:500 12.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:rgba(236,241,246,.72);background:rgba(255,255,255,.045);
  border-bottom:1px solid rgba(255,255,255,.055);cursor:default;user-select:none}
.win.focused .win-bar{color:rgba(236,241,246,.95)}
.win-dots{margin-left:auto;display:flex;gap:7px}
.win-dots i{width:10px;height:10px;border-radius:50%;display:block;cursor:pointer;
  transition:filter .12s}
.win-dots i:nth-child(1){background:#ff5f57}
.win-dots i:nth-child(2){background:#febc2e}
.win-dots i:nth-child(3){background:#28c840}
.win-dots i:hover{filter:brightness(1.35)}
.win-body{display:block;image-rendering:pixelated;background:#12161d}

#dock{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;align-items:center;gap:10px;
  padding:0 14px;
  background:rgba(14,18,24,.72);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  backdrop-filter:blur(26px) saturate(160%);
  border-top:1px solid rgba(255,255,255,.07);
  font:500 12.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",system-ui,sans-serif;
  color:rgba(236,241,246,.8);user-select:none}
.dock-launch{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:rgba(236,241,246,.8);background:rgba(255,255,255,.07);cursor:pointer;transition:background .15s}
.dock-launch:hover{background:rgba(94,234,212,.22);color:#5eead4}
.dock-apps{display:flex;gap:6px}
.dock-app{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;
  cursor:pointer;transition:background .15s,color .15s;color:rgba(236,241,246,.55)}
.dock-app:hover{background:rgba(255,255,255,.07);color:rgba(236,241,246,.9)}
.dock-app.active{background:rgba(94,234,212,.14);color:#a7f3e4}
.dock-app .led{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}
.dock-app.active .led{opacity:1}
.dock-right{margin-left:auto;font-variant-numeric:tabular-nums;color:rgba(236,241,246,.7)}

#screen-wrap{display:flex;align-items:center;justify-content:center;
  background:#040507;padding:0;flex:1 1 auto;min-height:0;overflow:hidden}
/* IME 需要真实的可编辑元素：canvas 收不到输入法组合事件。
   把它做成不可见但可聚焦，点画布时把焦点交给它。 */
#ime{position:absolute;left:-9999px;top:0;width:10px;height:10px;opacity:0}

#screen{max-width:100%;max-height:100%;width:auto;height:auto;
  aspect-ratio:4 / 3;image-rendering:pixelated;display:block}
#term{flex:0 0 0;display:none;min-height:0;overflow-y:auto;background:#050608;padding:10px 14px;
      font-family:var(--mono);font-size:12.5px;line-height:1.55;color:#c9d1d9;
      white-space:pre-wrap;word-break:break-all;cursor:text}
#term{outline:none}
#term:focus{box-shadow:inset 0 0 0 1px var(--line)}
.cursor{display:inline-block;width:7px;height:14px;background:var(--acc);vertical-align:-2px;
        animation:bl 1.05s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* 进程表 */
#procs,#caps,#events,#snaps,#files{font-family:var(--mono);font-size:11.5px}
#reg{max-height:20vh;overflow-y:auto}
main > .col:last-child{overflow-y:auto;max-height:calc(100vh - 40px)}
#caps{max-height:26vh;overflow-y:auto;padding-right:4px}
#events{max-height:20vh;overflow-y:auto;padding-right:4px}
#snaps{max-height:12vh;overflow-y:auto;padding-right:4px}
.ev{display:grid;grid-template-columns:34px 28px 1fr;gap:4px;padding:2px 4px;
  border-radius:3px;font-size:10.5px}
.ev .t{color:var(--fg3)}
.ev.spawn .a{color:var(--acc)}.ev.exit .a{color:#f87171}
.ev.ecall .a{color:var(--fg2)}
.snap{padding:2px 4px;border-radius:3px;font-size:10.5px}
.frow{display:flex;justify-content:space-between;padding:2px 4px;border-radius:3px;font-size:10.5px}
.frow:nth-child(odd){background:rgba(255,255,255,.018)}
.frow b{color:var(--acc);font-weight:500}
.frow span{color:var(--fg3)}
.snap b{color:var(--acc);font-weight:500}
.prow{display:grid;grid-template-columns:32px 52px 1fr 32px;gap:4px;padding:3px 4px;
  border-radius:3px}
.prow.ph{color:var(--fg3);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.prow:nth-child(odd),.ev:nth-child(odd),.snap:nth-child(odd),
.cap:nth-child(odd){background:rgba(255,255,255,.018)}
.prow.run{color:var(--acc)}.prow.ready{color:var(--fg)}
.prow.exit{color:var(--fg3)}
.cap{padding:2px 4px;border-radius:3px;line-height:1.35}
.cap b{color:var(--acc);font-weight:500}
.cap span{color:var(--fg3);font-size:10.5px;margin-left:4px}
.pt{display:grid;grid-template-columns:26px 1fr 44px;gap:6px;padding:3px 6px;border-radius:4px;color:var(--fg2)}
.pt:hover{background:var(--s2)}
.pt.run{background:rgba(94,234,212,.08);color:var(--fg)}
.pt .st{font-size:10px;text-align:right;color:var(--fg3)}
.pt.run .st{color:var(--acc)}

#reg{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;font-family:var(--mono);font-size:11.5px}
.rg{display:flex;justify-content:space-between;padding:1.5px 4px;border-radius:3px}
.rg:hover{background:var(--s2)}
.rg .n{color:var(--fg3)}
.rg.chg .v{color:var(--warn)}
.rg input{width:66px;background:var(--bg);color:var(--acc);border:1px solid var(--acc);
          border-radius:3px;font:11.5px var(--mono);padding:0 3px;outline:none}

.hint{font-family:var(--mono);font-size:10px;color:var(--fg3);margin-top:7px}

#tip{position:fixed;display:none;background:var(--s3);border:1px solid var(--line2);border-radius:6px;
     padding:7px 10px;font:11px var(--mono);color:var(--fg2);pointer-events:none;z-index:99;
     white-space:pre;box-shadow:0 10px 30px rgba(0,0,0,.7)}
</style>
</head>
<body>

<header>
  <div class="brand"><b>rvsim</b><i>RV32IMA · M/S/U · Sv32</i></div>
  <div class="grow"></div>
<span id="dbgToggle" title="显示/隐藏调试面板 (F12)">调试</span>
<div class="grow"></div>
  <div class="pill" id="st"><span class="dot"></span><span id="stT">未启动</span></div>
</header>

<div id="floatDebug" title="调试面板 (F12)">⚙</div>
<main>
  <!-- 左 -->
  <div class="col">
    <div class="lbl">启动</div>
    <div class="row" style="flex-direction:column">
      <button id="bKernel" class="pri">启动迷你内核</button>
      <button id="bTest">运行 riscv-tests</button>
      <button id="bUpload">上传 ELF</button>
    </div>
    <input type="file" id="file" accept=".elf,.bin" hidden>

    <div class="lbl" style="margin-top:20px">执行</div>
    <div class="row">
      <button id="bRun" class="wide" disabled>运行</button>
      <button id="bStop" class="wide" disabled>停止</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="bStep" class="wide" disabled>单步</button>
      <button id="bReset" class="wide" disabled>复位</button>
    </div>

    <div class="lbl" style="margin-top:20px">运行时</div>
    <div class="kv"><span class="k">周期</span><span class="v" id="vCy">0</span></div>
    <div class="kv"><span class="k">速率</span><span class="v" id="vIn">—</span></div>
    <div class="kv"><span class="k">PC</span><span class="v" id="vPc">—</span></div>
    <div class="kv"><span class="k">特权级</span><span class="v" id="vPv">—</span></div>

    <div class="lbl" style="margin-top:20px">输入</div>
    <div class="hint" style="margin-top:0">点终端后直接打字，回车送到 guest。Ctrl+C 中断。</div>
  </div>

  <!-- 中：终端 -->
  <div class="termwrap" style="background:var(--s1);border-left:1px solid var(--line);border-right:1px solid var(--line)">
    <div id="splash">
    <div class="sp-logo">rvsim</div>
    <div class="sp-sub">RISC-V mini-kernel</div>
    <div class="sp-bar"><i></i></div>
  </div>
  <div id="screen-wrap">
      <div id="desk">
        <div id="wallpaper"></div>
        <div id="winlayer"></div>
        <div id="dock">
          <div class="dock-launch" id="dockLaunch">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>
          <div class="dock-apps" id="dockApps"></div>
          <div class="dock-right"><span id="clock">--:--</span></div>
        </div>
        <canvas id="screen" width="800" height="600" style="display:none"></canvas>
      </div>
      <input id="ime" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="termbar">
      <b>UART</b><span>115200 8N1</span>
      <div class="grow"></div>

<div class="grow"></div>
      <span id="txInfo">0 B</span>
    </div>
    <div id="term" tabindex="0"><span class="cursor"></span></div>
  </div>

  <!-- 右 -->
  <div class="col">
    <div class="lbl">进程</div>
    <div id="procs"><div class="hint">启动内核后显示</div></div>

    <div class="lbl" style="margin-top:20px">寄存器</div>
    <div id="reg"></div>

    <div class="lbl" style="margin-top:16px">事件流 <em>log</em></div>
    <div id="events"><div class="hint">启动后自动读取</div></div>

    <div class="lbl" style="margin-top:16px">快照 / 计划</div>
    <div id="snaps"><div class="hint">启动后自动读取</div></div>

    <div class="lbl" style="margin-top:16px">文件 <em>ls</em></div>
    <div id="files"><div class="hint">读取中…</div></div>

    <div class="lbl" style="margin-top:16px">能力 <em>manifest</em></div>
    <div id="caps"><div class="hint">启动后自动读取</div></div>
  </div>
</main>

<div id="tip"></div>

<script src="rvsim.4c1bd75e79.js"></script>
<script>
const ABI=["zero","ra","sp","gp","tp","t0","t1","t2","s0","s1","a0","a1","a2","a3","a4","a5","a6","a7",
           "s2","s3","s4","s5","s6","s7","s8","s9","s10","s11","t3","t4","t5","t6"];
const PRIV=["U","S","?","M"];
let M=null,running=false,tm=null,loaded=false,ubuf=0,total=0;
let ticking=false,frameNo=0,speed=2;   /* speed: 2=全速 1=常驻低功耗 */
let tailBuf="";                        /* UART 输出尾部窗口，用于识别提示符 */
const hx=(v,w=8)=>"0x"+(v>>>0).toString(16).padStart(w,"0");
const $=i=>document.getElementById(i);

function setState(t,c){$("stT").textContent=t;$("st").className="pill"+(c?" "+c:"");}

/* 终端输出 */
const term=$("term");
let curEl=term.querySelector(".cursor");
function termWrite(txt){
  if(!txt)return;
  term.textContent=term.textContent.replace(/\u200b|\u2588/g,"");
}
/* ── 结构化状态嗅探 ──
   内核现在输出 JSON（ps / status / manifest），前端不需要另开通道，
   直接从 UART 流里认出来即可，零侵入。 */
let sniffBuf = "";
const capsSeen = new Map();

/* ── 事件流 ──
   事件行格式：seq actor type arg0 arg1 result code=N */
function renderEvents(rows){
  if(!rows.length) return;
  /* 轮询会把同一批事件反复带回来：按 seq 去重，只留最新一份 */
  const bySeq = new Map();
  for(const r of rows) bySeq.set(r[1], r);
  const uniq = [...bySeq.values()].sort((a, b) => Number(b[1]) - Number(a[1]));
  const cls = t => t === "spawn" ? "spawn" : t === "exit" ? "exit" : "ecall";
  let h = "";
  for(const r of uniq.slice(0, 14)){
    h += `<div class="ev ${cls(r[3])}"><span class="t">${r[1]}</span>`
       + `<span>${r[2]}</span><span class="a">${r[3]}</span></div>`;
  }
  $("events").innerHTML = h;
}

/* ── 快照与计划 ── */
function renderSnaps(snaps, plans){
  let h = "";
  if(snaps && snaps.snapshots)
    for(const x of snaps.snapshots)
      h += `<div class="snap"><b>快照 ${x.id}</b> @${x.evt_seq}</div>`;
  if(plans && plans.plans)
    for(const x of plans.plans)
      h += `<div class="snap"><b>计划 ${x.id}</b> ${x.intent} ${x.arg || ""}</div>`;
  $("snaps").innerHTML = h || '<div class="hint">无</div>';
}


/* 屏幕合成：像素全部由 guest 画在 RAM 里，
   这里只按 z 序把平面矩形搬到画布，等价于真实显示控制器的平面合成。 */
let scrCtx = null, scrW = 1024, scrH = 768;
let dispPtr = 0, ramPtr = 0;
let planeCanvases = [], planeSeqs = [];

function screenInit(){
  const cv = document.getElementById("screen");
  if(!cv) return;
  scrCtx = cv.getContext("2d");
  scrCtx.imageSmoothingEnabled = false;
  for(let i = 0; i < 8; i++){
    const c = document.createElement("canvas");
    c.width = 800; c.height = 600;
    planeCanvases.push(c);
    planeSeqs.push(-1);
  }
}

/* 把浏览器坐标换算成 800x600 帧缓冲坐标，写进显示控制器的鼠标寄存器 */
function screenPointerBind(){
  const cv = document.getElementById("desk");
  if(!cv) return;
  const MOUSE_X = 0x10003044, MOUSE_Y = 0x10003048;
  const MOUSE_BTN = 0x1000304C, MOUSE_EV = 0x10003050;

  /* 与 winSync 摆放窗口用同一套变换，否则鼠标命中和视觉位置会错位
     （之前一个按宽度撑满、一个按 min() 等比居中，位移只走 70%） */
  function toFb(e){
    const r = cv.getBoundingClientRect();
    const L = deskTransform(r.width, r.height);
    const x = Math.round((e.clientX - r.left - L.ox) / L.scale);
    const y = Math.round((e.clientY - r.top - L.oy) / L.scale);
    return [Math.max(0, Math.min(799, x)), Math.max(0, Math.min(599, y))];
  }

  cv.addEventListener("pointermove", e => {
    if(!M) return;
    const [x, y] = toFb(e);
    M._rv_mem_write32(MOUSE_X, x);
    M._rv_mem_write32(MOUSE_Y, y);
    M._rv_mem_write32(MOUSE_EV, 1);   /* 拖动要靠事件号推进 */
    curX = x; curY = y; curInside = true;
  }, {passive:true});

  cv.addEventListener("pointerenter", () => { curInside = true; });
  cv.addEventListener("pointerleave", () => { curInside = false; });

  cv.addEventListener("pointerdown", e => {
    if(!M) return;
    const ime = document.getElementById("ime");
    if (ime) { e.preventDefault(); ime.focus(); }   /* preventDefault：否则默认焦点行为会把焦点抢回 body */
    const [x, y] = toFb(e);
    curX = x; curY = y; curInside = true;
    M._rv_mem_write32(MOUSE_X, x);
    M._rv_mem_write32(MOUSE_Y, y);
    /* 先补一次抬起，清掉内核可能残留的按下状态 */
    M._rv_mem_write32(MOUSE_BTN, 0);
    M._rv_mem_write32(MOUSE_EV, 1);
    setTimeout(() => {
      if (!M) return;
      M._rv_mem_write32(MOUSE_X, x);
      M._rv_mem_write32(MOUSE_Y, y);
      M._rv_mem_write32(MOUSE_BTN, 1);
      M._rv_mem_write32(MOUSE_EV, 1);
    }, 30);
    cv.setPointerCapture(e.pointerId);
  });

  cv.addEventListener("pointerup", e => {
    if(!M) return;
    const [x, y] = toFb(e);
    M._rv_mem_write32(MOUSE_X, x);
    M._rv_mem_write32(MOUSE_Y, y);
    /* 延迟 120ms 再清按钮：内核是按轮询读的，
       按得太快会让它只看到 btn=0，整个点击被跳过。
       真实用户点击约 80-150ms，这个延迟对双方都够。 */
    setTimeout(() => {
      if(!M) return;
      M._rv_mem_write32(MOUSE_BTN, 0);
      M._rv_mem_write32(MOUSE_EV, 1);
    }, 120);
  });
}


/* ── 现代窗口层 ──
   内核在 0x83FFE000 维护一张窗口表，宿主按它摆窗口、贴内容。
   外壳（圆角/阴影/毛玻璃标题栏/Dock）全部由 CSS 画。 */
const WIN_INFO_PA = 0x83FFE000;

/* 逻辑画布 800x600 在桌面区域里的变换；事件换算和窗口摆放必须共用 */
function deskTransform(w, h) {
  const availW = w, availH = h - 54;
  const scale = Math.min(availW / 800, availH / 600) * 0.96;
  return {
    scale,
    ox: (availW - 800 * scale) / 2,
    oy: (availH - 600 * scale) / 2,
  };
}
const WIN_SLOTS = 3;
const winEls = [];
let winLayer = null, dockApps = null;

function winReadStr(addr, max) {
  const B = M.HEAPU8;
  const off = M._rv_ram_ptr() + (addr - 0x80000000);
  let s = "";
  for (let i = 0; i < max; i++) {
    const c = B[off + i];
    if (!c) break;
    s += String.fromCharCode(c);
  }
  return s;
}

function winInit() {
  winLayer = document.getElementById("winlayer");
  dockApps = document.getElementById("dockApps");
  if (!winLayer) return;
  for (let i = 0; i < WIN_SLOTS; i++) {
    const el = document.createElement("div");
    el.className = "win";
    el.style.display = "none";
    el.innerHTML = '<div class="win-bar"><span class="win-title"></span>'
      + '<span class="win-dots"><i data-act="0"></i><i data-act="1"></i><i data-act="2"></i></span></div>'
      + '<canvas class="win-body"></canvas>';
    winLayer.appendChild(el);
    winEls.push({ el, ctx: el.querySelector(".win-body").getContext("2d"), body: el.querySelector(".win-body"), w: 0, h: 0, seq: 0 });
  }
  // 窗控点：红=关闭 黄=最小化 绿=最大化，换算成 guest 逻辑坐标发过去。
  // 用 forEach 的索引而不是 dataset，避免属性读取出错导致点到隔壁按钮。
  for (let i = 0; i < WIN_SLOTS; i++) {
    winEls[i].el.querySelectorAll(".win-dots i").forEach((dot, act) => {
      dot.onclick = (ev) => {
        ev.stopPropagation();
        const A = M.HEAPU32;
        const base = (M._rv_ram_ptr() + (WIN_INFO_PA - 0x80000000)) >>> 2;
        const b = base + i * 9;
        const x = A[b + 6], y = A[b + 7], w = A[b + 1];
        // 与内核 win_chrome_hit 一致：红=x+w-20, 黄=x+w-33, 绿=x+w-46，y+8..y+20
        // 视觉上从左到右是 红/黄/绿，内核从右到左才是 红/黄/绿，所以反过来算
        const k = 2 - act;
        sendGuestClick([x + w - 20 - k * 13 + 4, y + 13]);
      };
    });
  }

  // 汉堡：开始菜单（guest 的任务栏按钮在 8..80, 570..600）
  const launch = document.getElementById("dockLaunch");
  if (launch) launch.onclick = () => sendGuestClick([40, 585]);

  // Dock 上的应用条目
  if (dockApps) {
    for (let i = 0; i < WIN_SLOTS; i++) {
      const d = document.createElement("div");
      d.className = "dock-app";
      d.innerHTML = '<span class="led"></span><span class="txt"></span>';
      d.onclick = () => sendGuestClick(dockClickPoint(i));
      dockApps.appendChild(d);
    }
  }
}

/* Dock 条目的“点击点”：用该窗口位置，让 guest 的命中测试落到它身上 */
function dockClickPoint(i) {
  const A = M.HEAPU32;
  const base = (M._rv_ram_ptr() + (WIN_INFO_PA - 0x80000000)) >>> 2;
  const b = base + i * 9;
  return [A[b + 6] + 20, A[b + 7] + 10];
}

/* 把一次“逻辑坐标点击”发给 guest（按下 + 抬起） */
function sendGuestClick(pt) {
  if (!M) return;
  const wk = (a, v) => M._rv_mem_write32(a, v);
  wk(0x10003044, pt[0]); wk(0x10003048, pt[1]);
  /* 先补一次抬起：内核的按下/抬起是配对状态，任何丢失的 up 都会让它
     永久停在「按住中」，之后所有点击都被忽略。 */
  wk(0x1000304C, 0); wk(0x10003050, 1);
  setTimeout(() => {
    if (!M) return;
    wk(0x1000304C, 1); wk(0x10003050, 1);
    setTimeout(() => { if (!M) return; wk(0x1000304C, 0); wk(0x10003050, 1); }, 60);
  }, 30);
}

function winSync() {
  if (!winLayer || !M) return;
  const A = M.HEAPU32;
  const ramBase = M._rv_ram_ptr();
  const base = (ramBase + (WIN_INFO_PA - 0x80000000)) >>> 2;
  const desk = document.getElementById("desk");
  const L = deskTransform(desk.clientWidth, desk.clientHeight);
  const scale = L.scale, ox = L.ox, oy = L.oy;

  for (let i = 0; i < WIN_SLOTS; i++) {
    const b = base + i * 9;
    const buf = A[b] >>> 0, w = A[b + 1], h = A[b + 2];
    const titleAddr = A[b + 3] >>> 0, focused = A[b + 4], visible = A[b + 5];
    const x = A[b + 6], y = A[b + 7], z = A[b + 8];
    const we = winEls[i];

    if (!visible || !w || !h) { we.el.style.display = "none"; continue; }
    we.el.style.display = "";

    // 位置/大小（按画布比例缩放）
    we.el.style.left = (ox + x * scale) + "px";
    we.el.style.top = (oy + y * scale) + "px";
    we.el.style.width = (w * scale) + "px";
    we.el.style.zIndex = 10 + z;
    we.el.classList.toggle("focused", !!focused);

    // 标题
    const t = winReadStr(titleAddr, 32);
    const tEl = we.el.querySelector(".win-title");
    if (tEl.textContent !== t) tEl.textContent = t;

    // 内容：把 guest 画布贴进来
    if (we.w !== w || we.h !== h) {
      we.w = w; we.h = h;
      we.body.width = w; we.body.height = h;
      we.body.style.width = (w * scale) + "px";
      we.body.style.height = (h * scale) + "px";
      we.seq = 0;
    }

    const off = (ramBase + (buf - 0x80000000)) >>> 2;
    const img = we.ctx.createImageData(w, h);
    const d = img.data;
    let k = 0;
    for (let j = 0; j < w * h; j++) {
      const v = A[off + j];
      d[k++] = (v >> 16) & 255;
      d[k++] = (v >> 8) & 255;
      d[k++] = v & 255;
      d[k++] = 255;
    }
    we.ctx.putImageData(img, 0, 0);
  }

  // Dock 条目状态
  if (dockApps) {
    const kids = dockApps.children;
    for (let i = 0; i < WIN_SLOTS; i++) {
      const b = base + i * 9;
      const d = kids[i];
      if (!d) continue;
      const vis = A[b + 5], foc = A[b + 4];
      d.classList.toggle("active", !!vis && !!foc);
      d.querySelector(".txt").textContent = winReadStr(A[b + 3] >>> 0, 20);
      d.style.opacity = vis ? "1" : ".45";
    }
  }
}

/* 时钟（宿主自己的时间，内核不再画） */
function dockClock() {
  const el = document.getElementById("clock");
  if (!el) return;
  const n = new Date();
  const p = v => String(v).padStart(2, "0");
  el.textContent = p(n.getHours()) + ":" + p(n.getMinutes());
}

function screenReset(){
  for(let i = 0; i < 8; i++) planeSeqs[i] = -1;
}

function blitPlane(i, base){
  const A = M.HEAPU32;
  const addr = A[base + 0];
  const w    = A[base + 3];
  const h    = A[base + 4];
  const stride = A[base + 5];
  const srcY = A[base + 7];
  const seq  = A[base + 11];
  if(!addr || !w || !h) return;
  if(planeSeqs[i] === seq) return;
  planeSeqs[i] = seq;

  /* subarray 用的是 wasm 线性内存的绝对偏移，必须加上 g_ram 的基址 */
  const off = (ramPtr + (addr - 0x80000000)) >>> 2;
  const src = M.HEAPU32.subarray(off, off + stride * (srcY + h));
  const c = planeCanvases[i];
  if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for(let y = 0; y < h; y++){
    const row = (srcY + y) * stride;
    let di = y * w * 4;
    for(let x = 0; x < w; x++){
      const v = src[row + x];
      d[di]   = (v >> 16) & 0xFF;
      d[di+1] = (v >> 8) & 0xFF;
      d[di+2] = v & 0xFF;
      d[di+3] = 255;
      di += 4;
    }
  }
  ctx.putImageData(img, 0, 0);
}

let lastFrameSeq = -1, lastCursorKey = "";
function screenRender(){
  if(!scrCtx || !M || !loaded) return;
  if(!dispPtr){ dispPtr = M._rv_disp_ptr(); ramPtr = M._rv_ram_ptr(); }
  if(!dispPtr) return;

  const A = M.HEAPU32;
  const base = dispPtr >>> 2;
  const sw = A[base + 0], sh = A[base + 1];
  if(!sw || !sh) return;

  /* 没有任何平面更新、光标也没动，就整帧跳过。
     否则每帧都在清屏+合成，把 CPU 吃满（也拖慢自动化工具）。 */
  {
    let dirty = false;
    for(let i = 0; i < 8; i++){
      const pb = base + (0x50 >> 2) + i * (0x40 >> 2);
      if(!A[pb + 3] || !A[pb + 4]) continue;
      if(planeSeqs[i] !== A[pb + 11]) { dirty = true; break; }
    }
    const ck = curInside ? (curX + "," + curY) : "out";
    if(!dirty && ck === lastCursorKey && lastFrameSeq === A[base + 4]){
      return;
    }
    lastCursorKey = ck;
    lastFrameSeq = A[base + 4];
  }
  if(sw !== scrW || sh !== scrH){
    scrW = sw; scrH = sh;
    const cv = document.getElementById("screen");
    cv.width = sw; cv.height = sh;
  }

  scrCtx.fillStyle = "#000";
  scrCtx.fillRect(0, 0, scrW, scrH);

  const order = [];
  for(let i = 0; i < 8; i++){
    const pb = base + (0x50 >> 2) + i * (0x40 >> 2);
    const w = A[pb + 3], h = A[pb + 4];
    if(!w || !h) continue;
    order.push({ i: i, pb: pb, z: A[pb + 9] });
  }
  order.sort(function(a, b){ return a.z - b.z; });

  for(const o of order){
    blitPlane(o.i, o.pb);
    const x = A[o.pb + 1], y = A[o.pb + 2];
    scrCtx.drawImage(planeCanvases[o.i], x, y);
  }

  drawCursor();
}

/* 鼠标指针：由宿主画（一个三角形箭头），guest 零开销。
   窗口内容仍然全部由 guest 光栅化。 */
let curX = 400, curY = 300, curInside = false;
function drawCursor(){
  const cv = document.getElementById("screen");
  if(!curInside) return;
  const sx = scrW / cv.width, sy = scrH / cv.height;
  const x = curX / (sx || 1), y = curY / (sy || 1);
  scrCtx.save();
  scrCtx.beginPath();
  scrCtx.moveTo(x, y);
  scrCtx.lineTo(x, y + 17);
  scrCtx.lineTo(x + 4.5, y + 13);
  scrCtx.lineTo(x + 7.5, y + 19);
  scrCtx.lineTo(x + 10, y + 18);
  scrCtx.lineTo(x + 7, y + 12);
  scrCtx.lineTo(x + 12, y + 12);
  scrCtx.closePath();
  scrCtx.fillStyle = "#ffffff";
  scrCtx.strokeStyle = "#0a0c10";
  scrCtx.lineWidth = 1.2;
  scrCtx.fill();
  scrCtx.stroke();
  scrCtx.restore();
}

function renderFiles(o){
  const list = (o && o.files) || [];
  if(!list.length){ $("files").innerHTML = '<div class="hint">空</div>'; return; }
  let h = "";
  for(const f of list){
    const isDir = f.type === "dir";
    const meta = isDir ? "dir" : (f.size + " B");
    h += `<div class="frow"><b>${isDir ? "\u25b8 " : ""}${f.name}</b>`
       + `<span>${meta}${f.owner ? " \u00b7 " + f.owner : ""}</span></div>`;
  }
  $("files").innerHTML = h;
}

function renderProcs(o){
  let h = '<div class="prow ph"><span>PID</span><span>状态</span><span>PC</span><span>轮</span></div>';
  for(const p of o.procs){
    if(p.state === "UNUSED") continue;
    const cls = p.state==="RUN" ? "run" : p.state==="READY" ? "ready" : "exit";
    h += `<div class="prow ${cls}"><span>${p.pid}</span><span>${p.state}</span>`
       + `<span>${p.pc}</span><span>${p.nrun}</span></div>`;
  }
  $("procs").innerHTML = h;
}

function renderCaps(){
  if(!capsSeen.size) return;
  let h = "";
  for(const [name, v] of capsSeen) h += `<div class="cap"><b>${name}</b><span>${v}</span></div>`;
  $("caps").innerHTML = h;
}

function sniff(s){
  sniffBuf = (sniffBuf + s).slice(-12000);

  /* 取最后一次：缓冲里每次轮询都会追加一份，
     用 match 会永远停在第一次的 ps 结果上（面板冻结）。 */
  const allPs = [...sniffBuf.matchAll(/\{"nproc":\d+,"procs":\[[^\]]*\]\}/g)];
  if(allPs.length){
    try{ renderProcs(JSON.parse(allPs[allPs.length - 1][0])); }catch(e){}
  }

  const re = /\{"cap":"([^"]+)","usage":"([^"]*)"/g;
  let m, before = capsSeen.size;
  while((m = re.exec(sniffBuf)) !== null) capsSeen.set(m[1], m[2]);
  if(capsSeen.size !== before) renderCaps();

  /* 事件行：只取最近一批 */
  const evRe = /^(-?\d+) (-?\d+) (spawn|exit|ecall|restore|reset|snapshot|plan|apply|sbrk|fork|setreg|getpid|yield) (\S+) (\S+) (-?\d+) code=(\d+)/;
  const evRows = [];
  for(const line of sniffBuf.split("\n")){
    const t = line.trim();
    const mm = t.match(evRe);
    if(mm) evRows.push(mm);
  }
  if(evRows.length) renderEvents(evRows.reverse());

  /* 缓冲里可能有多份（每次轮询都会追加一份），必须取最后一个，
     否则会一直显示启动时的空数组。 */
  const allFs = [...sniffBuf.matchAll(/\{"files":\[[^\]]*\]\}/g)];
  if(allFs.length){
    try{ renderFiles(JSON.parse(allFs[allFs.length-1][0])); }catch(e){}
  }

  const allSn = [...sniffBuf.matchAll(/\{"snapshots":\[[^\]]*\]\}/g)];
  const allPl = [...sniffBuf.matchAll(/\{"plans":\[[^\]]*\]\}/g)];
  const msn = allSn.length ? [allSn[allSn.length - 1][0]] : null;
  const mpl = allPl.length ? [allPl[allPl.length - 1][0]] : null;
  if(msn || mpl){
    let sj = null, pj = null;
    try{ if(msn) sj = JSON.parse(msn[0]); }catch(e){}
    try{ if(mpl) pj = JSON.parse(mpl[0]); }catch(e){}
    renderSnaps(sj, pj);
  }
}

/* 只注入，不阻塞：由执行引擎在下一帧处理 */
const _enc = new TextEncoder();
function sendCmd(cmd){
  if(!M || !loaded) return;
  /* 必须按 UTF-8 编码发送：charCodeAt 对中文返回 >255 的码点，
     写进 8 位串口会被截断，中文就变成 "Lb1" 这种乱码。 */
  for(const b of _enc.encode(cmd + "\r")) M._rv_uart_write(b);
}

/* 用户当前是否贴着底部（留 40px 容差） */
let atBottom = true;
function updateAtBottom(){
  const t = term;
  atBottom = (t.scrollHeight - t.scrollTop - t.clientHeight) < 40;
}

let quietOut = false;
function appendOut(s){
  if(quietOut) return;   /* 静默：只喂嗅探，不刷终端 */
  const t=term;
  // 光标一直留在末尾
  const c=t.querySelector(".cursor");
  const span=document.createElement("span");
  span.textContent=s;
  if(c) t.insertBefore(span,c); else t.appendChild(span);
  // 限制长度
  while(t.childNodes.length>1200) t.removeChild(t.firstChild);
  /* 只有用户本来就在底部时才跟随滚动。
     无条件 scrollTop=scrollHeight 会让上滚查看历史的人一直被拽回底部。 */
  if(atBottom) t.scrollTop=t.scrollHeight;
}

/* 启动镜像 */
function boot(bytes,name){
  if(!M)return;
  halt();
  M._rv_reset(); M._rv_uart_clear();
  const p=M._malloc(bytes.length); M.HEAPU8.set(bytes,p);
  const ok=M._rv_load(p,bytes.length); M._free(p);
  if(!ok){setState("加载失败","err");return;}
  loaded=true; total=0;
  /* 重载内核要清掉上一份镜像留下的面板数据，否则会显示旧快照/旧进程 */
  sniffBuf = ""; capsSeen.clear(); atBottom = true;
  screenReset();
  $("procs").innerHTML = '<div class="hint">读取中…</div>';
  $("events").innerHTML = '<div class="hint">读取中…</div>';
  $("snaps").innerHTML = '<div class="hint">读取中…</div>';
  $("caps").innerHTML = '<div class="hint">读取中…</div>';
  $("files").innerHTML = '<div class="hint">读取中…</div>';
  term.innerHTML='<span class="cursor"></span>';
  ["bRun","bStop","bStep","bReset"].forEach(i=>$(i).disabled=false);
  /* 不在 boot 里同步跑几十万步：那会把主线程钉死，浏览器连一次重绘
     都做不了，看起来就是"卡住"。交给分片执行引擎，边跑边渲染。 */
  startTicking();

  /* 进入 shell 后主动问一次能力与进程状态。
     前端不另开通道，就走同一根 UART —— 与「单一权威接口」一致。 */
  /* 能力清单必须读一次（右栏面板要用），但 24 条 JSON 会把首屏淹掉。
     读完之后清屏重开，终端回到干净的提示符。 */
  setTimeout(()=>{
    /* 能力清单只喂右栏，不往终端里贴：首屏应该是桌面而不是 60 行 JSON */
    quietOut = true;
    sendCmd("manifest");
    setTimeout(()=>{ quietOut = false; }, 1800);
  }, 900);
  setTimeout(()=>{
    /* 首屏：清掉启动残留，只留一行欢迎语和提示符。
       不再自动发 ps/log/ls —— 那些属于调试面板，按 F12 才拉。 */
    sendCmd("clear");
    term.innerHTML = '<span class="cursor"></span>';
    curEl = term.querySelector(".cursor");
    total = 0;
    quietOut = true;
    setTimeout(()=>{
      sendCmd("echo rvsim 桌面就绪  -  按 F12 打开调试面板");
      /* 用本地时间：Date.now() 是 UTC，直接丢给内核会差时区 */
      sendCmd("@settime " + Math.floor(Date.now() / 1000 - new Date().getTimezoneOffset() * 60));
      quietOut = false;
    }, 400);
  }, 2600);

  /* 之后每 3 秒轮询一次事件流、快照与计划。
     只在系统停在提示符时问，避免打断用户的输入。 */
  
}
/* 调试面板数据刷新：只在用户打开抽屉时跑一次。
   之前每 8 秒往 UART 插 ps/log/snaps/plans/ls，首屏永远是 JSON，
   而且轮询会和用户输入抢同一根串口。 */
function refreshPanels(){
  if(!M || !loaded) return;
  /* @ 前缀：内核只把结果写 UART，不写窗口网格。
     否则按一次 F12，用户终端就被 ps/log/ls 的 JSON 刷满，而且关抽屉也不消失。 */
  quietOut = true;
  sendCmd("@ps");
  setTimeout(()=>sendCmd("@log last 8"), 260);
  setTimeout(()=>sendCmd("@snaps"), 520);
  setTimeout(()=>sendCmd("@plans"), 780);
  setTimeout(()=>sendCmd("@ls"), 1040);
  setTimeout(()=>{ quietOut = false; }, 1600);
}

async function bootUrl(u,name){
  /* 加时间戳：否则浏览器会缓存旧的 kernel.elf，
     改了内核却看到旧行为，排查时会完全找错方向。 */
  u = u + (u.includes("?") ? "&" : "?") + "t=" + Date.now();
  try{
    setState("加载中…","");
    const r=await fetch(u); if(!r.ok) throw 0;
    boot(new Uint8Array(await r.arrayBuffer()),name);
  }catch(e){setState("镜像不可用","err");}
}

/* 取 UART 输出 */
/* 必须用流式解码：分块读取会切断 UTF-8 多字节序列，
   非流式 decode 会把半个汉字解成乱码（◆◆）。 */
const uartDecoder = new TextDecoder();

function pumpUart(){
  if(!M)return;
  let n; let s="";
  while((n=M._rv_uart_read(ubuf,4096))>0){
    const arr=M.HEAPU8.subarray(ubuf,ubuf+n);
    s+=uartDecoder.decode(arr,{stream:true});
    total+=n;
  }
  if(s){ appendOut(s); tailBuf=(tailBuf+s).slice(-160); }
  if(s) sniff(s);
  /* 提示符可能被拆到相邻两帧，所以用累积窗口判断。
     进 shell 后降到低预算常驻：仍能响应键盘，但不再把 CPU 跑满。 */
  if(speed>1&&tailBuf.indexOf("rvsh>")>=0) speed=1;
  $("txInfo").textContent=total.toLocaleString()+" B";
}

/* ── 分片执行引擎 ──
   每帧只给固定时间预算，跑完立刻让出主线程。这样无论跑 20 万步还是
   2000 万步，页面都不会假死，终端和寄存器也能持续刷新。 */
function stepBudget(ms){
  const t0=performance.now();
  let done=0;
  while(performance.now()-t0<ms){
    for(let k=0;k<400;k++){
      const r=M._rv_step();
      if(r!==0) return {halted:r,n:done};
      done++;
    }
  }
  return {halted:0,n:done};
}

function tick(){
  if(!M||!loaded||!ticking){ticking=false;return;}
  const res=stepBudget(speed>=2?45:1);
  pumpUart();
  winSync();
  dockClock();
  screenRender();
  frameNo++;
  /* 全速阶段最多持续约 600 帧（10 秒）：再久说明镜像不需要那么快，
     强制降到常驻档，避免一个异常镜像把页面 CPU 吃满。 */
  if(speed>1&&frameNo>45) speed=1;
  if(frameNo%10===0) render();
  if(res.halted!==0){
    halt();
    setState(res.halted===1?"PASS":"FAIL",res.halted===1?"ok":"err");
    render();
    return;
  }
  tm=requestAnimationFrame(tick);
}

function startTicking(){
  if(!M||!loaded)return;
  speed=2;
  running=true;
  $("bRun").disabled=true;$("bStep").disabled=true;
  setState("运行中","on");
  if(ticking)return;
  ticking=true;
  tm=requestAnimationFrame(tick);
}

function run(){ startTicking(); }

function halt(){
  running=false;
  ticking=false;
  if(tm){cancelAnimationFrame(tm);tm=null;}
  if(loaded){$("bRun").disabled=false;$("bStep").disabled=false;}
}

/* 键盘 → guest UART */
term.addEventListener("click",()=>term.focus());
term.addEventListener("scroll", updateAtBottom, {passive:true});
term.tabIndex=0;
let lastInputAt = 0;

/* 键盘监听挂在 document 上：用户点的是画布里的终端窗口，
   不该被要求先去点画布下方那条隐藏的 HTML 终端。 */
/* IME / 输入法：input 事件拿到的是已经组合好的文本，
   比 keydown 可靠得多（中文在 keydown 里根本看不到）。
   发走之后立刻清空，当作一个「字符流入口」。 */
document.addEventListener("input", e => {
  if (!loaded || !M) return;
  if (e.target && e.target.id !== "ime") return;
  /* 组合中（拼音还没选字）绝对不能发：否则 "nihao" 会先被写进终端 */
  if (e.isComposing || e.target.isComposing) return;
  const ime = e.target;
  const txt = ime.value;
  if (!txt) return;
  ime.value = "";
  lastInputAt = Date.now();
  for (const b of _enc.encode(txt)) M._rv_uart_write(b);
});

/* 粘贴：中文输入最可靠的方式（不依赖 IME 的 key 事件） */
document.addEventListener("paste", e => {
  if (!loaded || !M) return;
  const t = (e.clipboardData || window.clipboardData);
  if (!t) return;
  const txt = t.getData("text");
  if (!txt) return;
  e.preventDefault();
  lastInputAt = Date.now();
  for (const b of _enc.encode(txt)) M._rv_uart_write(b);
});

document.addEventListener("keydown",e=>{
  if(!loaded||!M)return;
  const isIme = e.target && e.target.id === "ime";
  /* #ime 是输进入口：它的特殊键要正常发，普通字符交给 input 事件 */
  if(!isIme && e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  /* 抽屉开关用 F12：D 是普通字符，mkdir/chmod/guide 都要用。
     之前把 D 拦成热键，等于废掉了终端里所有含 d 的命令。 */
  if(e.key === "F12"){
    document.body.classList.toggle("drawer-open");
    if(document.body.classList.contains("drawer-open")) refreshPanels();
    e.preventDefault();
    return;
  }
  lastInputAt = Date.now();
  if(e.ctrlKey && (e.key==="c" || e.key==="C")){
    /* 提示里写了「Ctrl+C 中断」，那就真的中断 */
    M._rv_uart_write(3);
    e.preventDefault();
    return;
  }
  if(e.key==="Enter"){M._rv_uart_write(13);e.preventDefault();}
  else if(e.key==="Backspace"){M._rv_uart_write(127);e.preventDefault();}
  else if(e.key==="Tab"){M._rv_uart_write(9);e.preventDefault();}
  else if(isIme){ return; }   /* 普通字符由 input 事件负责，避免重复 */
  else if(e.key.length>=1 && [...e.key].length===1){
    /* 同样要走 UTF-8：中文的 charCodeAt 是 >255 的码点，截断就成乱码 */
    for(const b of _enc.encode(e.key)) M._rv_uart_write(b);
    e.preventDefault();
  }
  else return;
  /* 不在这里同步推进：注入后由执行引擎在下一帧处理，
     暂停状态下则自动恢复常驻运行，否则 guest 永远看不到输入。 */
  if(!ticking) startTicking();
});

/* 渲染侧栏 */
let prev={};
let prevCy=0, prevCyT=0;
let regEditing=false;   /* 编辑寄存器时暂停重绘，否则输入框会被 innerHTML 冲掉 */
function render(){
  if(!M||!loaded)return;
  const pc=M._rv_pc()>>>0;
  const cy = M._rv_cycles() >>> 0;
  $("vCy").textContent = cy.toLocaleString();
  /* 模拟器没有独立的指令计数器，原先这里又填了一遍周期数，
     两个数字永远相等、毫无信息量。改成每秒周期数。 */
  const now = performance.now();
  if(prevCy && now > prevCyT + 400){
    const rate = (cy - prevCy) / ((now - prevCyT) / 1000);
    $("vIn").textContent = (rate / 1e6).toFixed(1) + " M/s";
    prevCy = cy; prevCyT = now;
  } else if(!prevCy){ prevCy = cy; prevCyT = now; }
  $("vPc").textContent=hx(pc);
  $("vPv").textContent=PRIV[M._rv_priv()]??"?";

  let r="";
  for(let i=0;i<32;i++){
    const v=M._rv_reg(i)>>>0;
    const chg=(i!==0&&prev[i]!==undefined&&prev[i]!==v)?" chg":"";
    r+=`<div class="rg${chg}" data-r="${i}"><span class="n">${ABI[i]}</span><span class="v">${hx(v)}</span></div>`;
    prev[i]=v;
  }
  if(!regEditing) $("reg").innerHTML=r;

}

/* 事件 */
const _fd = document.getElementById("floatDebug");
if (_fd) _fd.onclick = () => {
  document.body.classList.toggle("drawer-open");
  if (document.body.classList.contains("drawer-open") && typeof refreshPanels === "function") refreshPanels();
};
document.getElementById("dbgToggle").onclick = () => {
  document.body.classList.toggle("drawer-open");
  if(document.body.classList.contains("drawer-open")) refreshPanels();
};
/* 调试面板按钮：逐个判空。
   之前只要有一个 id 对不上就抛 TypeError，整段脚本从 createRvsim 之后全不执行，
   表现是 M 一直是 null、页面停在「未启动」，排查方向会被彻底带偏。 */
try {
$("bKernel").onclick=()=>bootUrl("images/kernel.elf","mini-kernel");
$("bTest").onclick=()=>bootUrl("images/rv32ui-p-add","rv32ui-p-add");
$("bUpload").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];
  if(f)f.arrayBuffer().then(b=>boot(new Uint8Array(b),f.name));};
$("bRun").onclick=run;
$("bStop").onclick=()=>{halt();setState("已停止","");pumpUart();};
$("bStep").onclick=()=>{
  if(!loaded)return;
  const r=M._rv_step();
  if(r!==0){halt();setState(r===1?"PASS":"FAIL",r===1?"ok":"err");}
  pumpUart();render();
};
$("bReset").onclick=()=>{halt();M._rv_reset();M._rv_uart_clear();prev={};total=0;
  term.innerHTML='<span class="cursor"></span>';render();setState("已复位","");};

// 寄存器编辑
$("reg").onclick=e=>{
  const d=e.target.closest(".rg");if(!d||!M)return;
  const i=+d.dataset.r,cur=M._rv_reg(i)>>>0;
  if(i===0) return;    /* x0 恒为 0，不给编辑 */
  const inp=document.createElement("input");
  regEditing=true;
  inp.value=hx(cur);d.querySelector(".v").replaceWith(inp);inp.focus();inp.select();
  const done=()=>{const v=parseInt(inp.value,16);
    regEditing=false;
    if(!isNaN(v)){ M._rv_set_reg(i,v>>>0); }
    render();};
  inp.onblur=done;
  inp.onkeydown=k=>{if(k.key==="Enter")inp.blur();if(k.key==="Escape"){inp.value=hx(cur);inp.blur();}};
};
} catch (e) { console.warn('debug panel bind:', e); }



/* wasm 的缓存破坏由构建脚本处理（文件名带内容哈希），
   这里保持最简单的调用方式——emscripten 的模块化入口不吃外部配置。 */
/* 等 DOM 就绪再初始化。注意不能只挂 load 监听：
   脚本在 body 末尾时 load 可能已经触发过，监听器就永远等不到。 */
function startRvsim(){ createRvsim().then(m=>{
  M=m;ubuf=m._malloc(4096);
  screenInit();
  winInit();
  screenPointerBind();
  if(typeof m._rv_mem_write32 !== "function"){
    setState("wasm 版本过期，请 Ctrl+Shift+R", "err");
  }
  setState("就绪","");
  // 自动启动内核，让用户一打开就看到东西
  bootUrl("images/kernel.elf","mini-kernel");
  // 桌面画出来之后撤掉启动画面
  setTimeout(() => {
    const sp = document.getElementById("splash");
    if (sp) sp.classList.add("gone");
  }, 3500);
}).catch(e => setState("wasm 加载失败: " + e, "err")); }

/* 延一帧再启动：页面还在解析时立刻实例化 wasm，
   在某些浏览器里会让 Promise 长时间 pending（页面卡在「未启动」）。 */
setTimeout(startRvsim, 300);
</script>
