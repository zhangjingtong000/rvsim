<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<!-- 外壳在开发期改动频繁，别让浏览器把旧 HTML 拿来跑 -->
<meta http-equiv="Cache-Control" content="no-store">
<title>rvsim · RISC-V 迷你机</title>
<style>
/* ══════════════════════════════════════════════════════════════
   rvsim 桌面外壳
   分工：内核只发布结构化数据（窗口表 / 字符网格 / 进程表 /
   文件表 / 系统状态），外壳与文字全部由这一层用 CSS 和真字体渲染。
   内核不做任何像素光栅化 —— 它画不出抗锯齿圆角，16x16 点阵中文
   在高分屏上也不可读，硬做就是「伪造古董」。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* ── Fluent 深色 token（对齐 WinUI 3 的 Common_themeresources_any.xaml）──
     文本层级用「纯白 + 透明度」，不是另起一个蓝灰色相：
     #A9B4C4 这类蓝灰在深色底上会偏色，和青绿强调色打架。
     几何一律落在 4px 网格上：标题栏 32、浮层圆角 8、控件圆角 4。 */
  --bg-root:#0A0D12;
  --s0:#12161D;   /* 窗口内容底 */
  --s1:#1A1F27;   /* 标题栏、侧栏 */
  --s2:#20262F;   /* 菜单、卡片 */
  --s3:#282F3A;   /* 悬停 */
  --s4:#323A47;   /* 按下 / 选中 */
  --stroke-sub:var(--active);
  --stroke:var(--stroke);        /* ControlStrokeColorDefault  #12FFFFFF */
  --stroke-strong:rgba(255,255,255,.11); /* ControlStrokeColorSecondary #18FFFFFF */
  --t1:#FFFFFF;                    /* TextFillColorPrimary   */
  --t2:rgba(255,255,255,.77);      /* TextFillColorSecondary #C5FFFFFF */
  --t3:rgba(255,255,255,.53);      /* TextFillColorTertiary  #87FFFFFF */
  --t-disabled:rgba(255,255,255,.36);
  --acc:#2DD4BF;
  /* 状态色取 Win11 Dark 的值（#6CCB5F / #FCE100 / #FF99A4）：
     以前只有终端里的一个 #F87171，别处要用红色就各写各的。 */
  --ok:#6CCB5F; --warn:#FCE100; --err:#FF99A4;

  /* 语义 token：交互态、浮层底、阴影。以前这些值散在各处写死，
     换主题时无处下手。 */
  --hover:var(--hover);
  --active:var(--active);
  --overlay:var(--overlay);
  --overlay-2:var(--overlay-2);
  --sh-1:var(--sh-1);
  --sh-2:var(--sh-2);
  --sh-3:var(--sh-3); --acc-hover:#5EEAD4; --acc-press:#14B8A6; --on-acc:#04211C;
  --ok:#34D399; --warn:#FBBF24; --danger:#F87171; --danger-strong:#C42B1C;
  --info:#60A5FA;

  /* 圆角严格按 WinUI 3：浮层 8 / 控件 4 */
  --r-window:8px; --r-flyout:8px; --r-control:4px; --r-tile:6px;

  --elev-1:0 1px 2px rgba(0,0,0,.30), 0 8px 20px -6px var(--sh-3);
  --elev-2:0 1px 2px rgba(0,0,0,.35), 0 18px 44px -12px rgba(0,0,0,.62);
  --elev-3:0 8px 20px rgba(0,0,0,.30), 0 28px 64px -16px rgba(0,0,0,.70);

  --font-ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  /* 字号阶梯。Fluent 是 Caption 12/16 · Body 14/20 · Body Strong 14/20 SemiBold
     · Body Large 18/24 · Subtitle 20/28 · Title 28/36 · Title Large 40/52。
     我们原来只有 12/13/14 三档小字号，没有任何标题档，层级只能靠加粗硬凑。 */
  --fs-caption:12px; --lh-caption:16px;
  --fs-body:14px;    --lh-body:20px;
  --fs-large:18px;   --lh-large:24px;
  --fs-subtitle:20px;--lh-subtitle:28px;
  --fs-title:28px;   --lh-title:36px;
  --font-mono:"Cascadia Mono","Cascadia Code",Consolas,"Microsoft YaHei UI","Microsoft YaHei",ui-monospace,monospace;

  /* 动效阶梯。原来散成 18 个值（100/120/130/160/167/200/220/250/280/300/
     360/450/500/700…），每个组件各写各的，没有"系统"可言。
     现在对齐 Fluent：100 / 167 / 250 / 333 / 500 五档，启动动画单独一档。
     缓动三条：进入用减速、退出用加速、其余用标准。 */
  --dur-1:100ms;   /* 微交互：hover、按下、焦点环 */
  --dur-2:167ms;   /* 小元素进场/退场 */
  --dur-3:250ms;   /* 中等过渡：菜单、浮层、提示 */
  --dur-4:333ms;   /* 较大位移：窗口吸附、抽屉 */
  --dur-5:500ms;   /* 页面级 */
  --dur-boot:700ms;/* 启动动画，不参与交互阶梯 */
  /* 三条曲线取 Fluent 的定义：进入 = (0,0,0,1)、退出 = (1,0,1,1)、点对点 = (0.55,0.55,0,1) */
  --ease-decel:cubic-bezier(0,0,0,1);
  --ease-std:cubic-bezier(.55,.55,0,1);
  --ease-accel:cubic-bezier(1,0,1,1);

  /* 兼容旧名 */
  --bg:var(--s1); --fg:var(--t1); --fg2:var(--t2); --fg3:var(--t3);
  --line:var(--stroke); --line2:var(--stroke-strong);
  --mono:var(--font-mono); --sans:var(--font-ui); --err:var(--danger);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg-root);color:var(--t1);
  font:400 14px/1.5 var(--font-ui);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
input{font:inherit;color:inherit;background:none;border:0;outline:0}

/* ── 开机画面 ───────────────────────────────────────────────── */
#boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;
  background:radial-gradient(1100px 700px at 50% 40%,#101827,#070A0F 72%);
  transition:opacity var(--dur-5) var(--ease-decel)}
#boot.gone{opacity:0;pointer-events:none}
.boot-in{display:flex;flex-direction:column;align-items:center;width:340px}
.boot-mark{width:96px;height:96px;margin-bottom:26px;
  animation:bootMark var(--dur-boot) var(--ease-decel) both}
@keyframes bootMark{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.boot-mark .chip{animation:chipPulse 2.6s ease-in-out infinite}
@keyframes chipPulse{0%,100%{opacity:.9}50%{opacity:.55}}
.boot-name{font:600 30px/1.1 var(--font-display);letter-spacing:-.02em;
  animation:bootFade var(--dur-5) var(--dur-1) var(--ease-decel) both}
.boot-sub{margin-top:8px;font:400 12px/1.4 var(--font-mono);
  color:var(--t3);letter-spacing:.14em;
  animation:bootFade var(--dur-5) var(--dur-3) var(--ease-decel) both}
.boot-bar{width:100%;height:3px;margin-top:34px;border-radius:2px;
  background:var(--hover);overflow:hidden;
  animation:bootFade var(--dur-5) var(--dur-4) var(--ease-decel) both}
.boot-bar i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--acc-press),var(--acc-hover));
  transition:width var(--dur-4) var(--ease-decel)}
.boot-status{margin-top:14px;height:18px;font:400 12px/18px var(--font-ui);
  color:var(--t3);animation:bootFade var(--dur-5) var(--dur-4) var(--ease-decel) both}
@keyframes bootFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── 桌面 ───────────────────────────────────────────────────── */
#os{position:fixed;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(1150px 760px at 16% 6%, rgba(45,212,191,.17), transparent 62%),
    radial-gradient(1000px 720px at 84% 92%, rgba(59,130,246,.21), transparent 64%),
    radial-gradient(900px 620px at 55% 108%, rgba(45,212,191,.09), transparent 66%),
    radial-gradient(700px 500px at 62% 38%, rgba(124,58,237,.11), transparent 70%),
    linear-gradient(155deg,#101D30 0%,#0B1220 46%,#080B12 100%)}
#wall::after{content:"";position:absolute;inset:0;
  background:radial-gradient(125% 95% at 50% 42%,transparent 52%,rgba(0,0,0,.5) 100%)}

/* 桌面图标 */
#icons{position:absolute;inset:0;z-index:1;padding:18px 14px;
  display:flex;flex-direction:column;flex-wrap:wrap;gap:3px;
  align-content:flex-start;pointer-events:none}
.dicon{pointer-events:auto;width:76px;height:76px;padding:4px 2px 3px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  border-radius:7px;user-select:none;transition:background var(--dur-1),box-shadow var(--dur-1)}
.dicon:hover{background:var(--stroke)}
.dicon.sel{background:rgba(45,212,191,.16);box-shadow:inset 0 0 0 1px rgba(94,234,212,.45)}
.dicon svg{width:44px;height:44px;flex:0 0 auto;
  filter:drop-shadow(0 3px 7px var(--sh-3))}
.dicon span{font:400 12px/16px var(--font-ui);color:var(--t1);text-align:center;
  max-width:76px;overflow:hidden;text-shadow:0 1px 3px var(--sh-3);
  /* 两行再省略：Win11 的桌面图标标签是两行。单行的话
     「rvsim 能力清单」这种名字会被砍成「rvsim 能…」，认不出来。 */
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-all}

/* winlayer 铺满整个桌面，但它只是窗口的容器：
   不给 pointer-events:none 的话，它会挡住下面所有桌面图标的点击
   （实测双击图标完全没反应，因为事件全被这层吃掉了）。 */
#winlayer{position:absolute;inset:0;z-index:5;pointer-events:none}
#winlayer > .win{pointer-events:auto}

/* 吸附预览：Win11 拖到边缘时会先亮出一块半透明占位 */
#snapGhost{position:absolute;z-index:4;pointer-events:none;opacity:0;
  border-radius:var(--r-window);
  background:rgba(45,212,191,.16);
  border:1px solid rgba(94,234,212,.6);
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 14px 36px -10px rgba(0,0,0,.55);
  transition:left var(--dur-1) var(--ease-decel),top var(--dur-1) var(--ease-decel),
             width var(--dur-1) var(--ease-decel),height var(--dur-1) var(--ease-decel),opacity var(--dur-1)}
#snapGhost.on{opacity:1}

/* 吸附布局选择器：悬停最大化按钮 450ms 弹出（Win11 行为） */
#snapPicker{position:absolute;z-index:70;display:none;gap:6px;
  padding:10px;grid-template-columns:1fr 1fr;
  background:var(--overlay-2);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-flyout);
  box-shadow:var(--elev-3);animation:popIn var(--dur-1) var(--ease-decel);
  transform-origin:top left}
#snapPicker.on{display:grid}
.sl{position:relative;width:96px;height:64px;border-radius:var(--r-control);
  background:rgba(255,255,255,.03);border:1px solid var(--stroke);overflow:hidden}
.sl-cell{position:absolute;border-radius:3px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  transition:background var(--dur-1),border-color var(--dur-1)}
.sl-cell:hover{background:rgba(45,212,191,.42);border-color:rgba(94,234,212,.7)}

/* 悬停提示：原生 title 会弹一个浅色系统气泡，在深色界面上非常扎眼 */
#tip{position:absolute;z-index:80;pointer-events:none;opacity:0;
  padding:5px 10px;border-radius:var(--r-control);
  background:rgba(40,47,58,.97);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--stroke);box-shadow:var(--elev-1);
  font:400 12px/16px var(--font-ui);color:var(--t1);white-space:nowrap;
  transition:opacity var(--dur-1) var(--ease-decel)}
#tip.on{opacity:1}

/* 托盘日期面板（点托盘弹出） */
#trayPanel{position:absolute;z-index:72;display:none;width:280px;padding:16px;
  background:var(--overlay-2);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-flyout);
  box-shadow:var(--elev-3);animation:popIn var(--dur-2) var(--ease-decel);
  transform-origin:top right}
#trayPanel.on{display:block}
.tp-time{font:600 26px/1.1 var(--font-display);color:var(--t1);letter-spacing:-.01em}
.tp-date{font:400 12.5px/18px var(--font-ui);color:var(--t2);margin-top:4px}
.tp-sep{height:1px;margin:12px 0;background:var(--stroke)}
.tp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px}
.tp-dow{font:400 10px/16px var(--font-ui);color:var(--t3);text-align:center}
.tp-day{font:400 11.5px/26px var(--font-mono);color:var(--t2);text-align:center;
  border-radius:var(--r-control)}
.tp-day.today{background:var(--acc);color:var(--on-acc);font-weight:600}
.tp-day.dim{color:var(--t-disabled)}

/* 右键菜单 */
#ctxMenu{position:absolute;z-index:75;display:none;min-width:184px;padding:5px;
  background:var(--overlay-2);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-flyout);
  box-shadow:var(--elev-3);animation:popIn var(--dur-1) var(--ease-decel);
  transform-origin:top left}
#ctxMenu.on{display:block}
.ctx-item{padding:7px 12px;border-radius:var(--r-control);
  font:400 13px/18px var(--font-ui);color:var(--t1);cursor:default;white-space:nowrap}
.ctx-item:hover{background:var(--hover)}
.ctx-item.disabled{color:var(--t-disabled);pointer-events:none}
.ctx-sep{height:1px;margin:4px 8px;background:var(--stroke)}

/* 键盘焦点环：Win11 是贴边的 2px 白环，内缩 -2px 避免被 overflow 裁掉 */
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dicon:focus-visible,.dock-app:focus-visible,.dock-btn:focus-visible,
.sm-tile:focus-visible,.sm-ri:focus-visible,.win-ctl button:focus-visible{
  outline:2px solid var(--acc);outline-offset:-2px}
#startBtn:focus-visible,#dbgBtn:focus-visible{outline-offset:-2px}

/* ── 窗口 ───────────────────────────────────────────────────── */
.win{position:absolute;display:flex;flex-direction:column;
  /* 最大化/还原过渡 167ms（Fluent 的「小元素进场」档）。
     拖动和缩放必须关掉，否则窗口会追着鼠标慢慢飘。 */
  transition:left var(--dur-2) var(--ease-decel),top var(--dur-2) var(--ease-decel),
    width var(--dur-2) var(--ease-decel),height var(--dur-2) var(--ease-decel),
    opacity var(--dur-2) var(--ease-decel),transform var(--dur-2) var(--ease-decel);
  border-radius:var(--r-window);
  /* 不写 overflow:hidden：那会把命中区一起裁成圆角，
     窗口最角落的几个像素就点不到了。圆角交给 .win-bar / .win-body。 */
  overflow:visible;
  /* 底色用高不透明度的半透明：窗口是每帧都在变的内容，
     backdrop-filter 会让浏览器每帧重算一次背景模糊 —— 实测吞吐从
     12-19 M/s 掉到 4.9 M/s。视觉上 .94 和 .86+blur 几乎看不出差别。 */
  background:var(--overlay);
  border:1px solid var(--stroke);
  /* Win11 的四层阴影 */
  box-shadow:0 0 0 1px rgba(0,0,0,.12),
             0 2px 4px rgba(0,0,0,.14),
             0 8px 16px rgba(0,0,0,.16),
             0 16px 32px var(--sh-1);
  transition:box-shadow var(--dur-2) var(--ease-decel),border-color var(--dur-2),
             left var(--dur-2) var(--ease-decel),top var(--dur-2) var(--ease-decel),
             width var(--dur-2) var(--ease-decel),height var(--dur-2) var(--ease-decel)}
.win.dragging{transition:box-shadow var(--dur-2) var(--ease-decel),border-color var(--dur-2)}
/* 关闭：淡出 + 轻微缩小（Win11 关闭动画的观感） */
.win.closing{opacity:0;transform:scale(.97);
  transition:opacity var(--dur-1) var(--ease-accel),transform var(--dur-1) var(--ease-accel)}
.win.focused{border-color:rgba(94,234,212,.34);
  box-shadow:0 0 0 1px rgba(94,234,212,.16),
             0 2px 4px rgba(0,0,0,.16),
             0 8px 16px var(--sh-1),
             0 20px 40px var(--sh-2)}
/* 吸附到屏幕边缘时，贴边那侧的圆角收成直角 */
.win.snap-l{border-top-left-radius:0;border-bottom-left-radius:0}
.win.snap-r{border-top-right-radius:0;border-bottom-right-radius:0}
.win.snap-t{border-top-left-radius:0;border-top-right-radius:0}
/* 最小化：向 dock 方向缩小淡出 */
.win.minimizing{opacity:0;transform:scale(.9) translateY(24px);
  transition:opacity var(--dur-2) var(--ease-accel),transform var(--dur-2) var(--ease-accel)}

.win-bar{flex:0 0 32px;height:32px;display:flex;align-items:center;
  border-radius:calc(var(--r-window) - 1px) calc(var(--r-window) - 1px) 0 0;
  gap:8px;padding:0 0 0 12px;user-select:none;
  background:var(--titlebar-bg);
  border-bottom:1px solid var(--stroke)}
.win-ico{width:16px;height:16px;flex:0 0 auto;opacity:.72}
.win.focused .win-ico{opacity:.95}
.win-title{font:400 12px/1 var(--font-ui);color:var(--t2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.focused .win-title{color:var(--t1)}
.win-ctl{margin-left:auto;display:flex;align-self:stretch}
.win-ctl button{width:46px;height:100%;display:grid;place-items:center;
  color:var(--t2);transition:background var(--dur-1),color var(--dur-1)}
.win-ctl button svg{width:10px;height:10px}
.win-ctl button:hover{background:var(--stroke);color:var(--t1)}
.win-ctl button:active{background:var(--active)}
.win-ctl button.close:hover{background:var(--danger-strong);color:#fff}
.win-ctl button.close:active{background:#A4261A;color:#fff}

.win-body{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;
  border-radius:0 0 calc(var(--r-window) - 1px) calc(var(--r-window) - 1px)}
/* 宿主应用的内容长度是固定的，窗口小时要能滚，不能直接裁掉最后一行 */
.host-win .win-body{overflow:auto}
/* 宿主侧窗口（设置/帮助/关于/编辑器）一律不透明。
   原来是半透明（.97）+ 没有模糊，圆角和边缘会把下面的终端文字透出来，
   浅色主题下尤其明显。Win11 的设置窗口也是不透明的。 */
.host-win{background:var(--s1)}
.host-win.solid{background:var(--s1)}

/* 终端：字符网格由内核发布，这里用等宽真字体画 */
.term-dom{padding:10px 12px;overflow-y:auto;overflow-x:hidden;background:var(--s0);user-select:text;
  font-family:var(--font-mono);font-size:14px;line-height:20px;
  color:#D7DCE3;letter-spacing:0}
/* 行盒高度交给 line-height，但空行必须显式给 min-height ——
   一个 textContent 为空的 div 在流式布局里高度是 0，
   整屏内容会往上塌几行，光标位置也跟着错位。 */
.term-line{white-space:pre;line-height:inherit;min-height:var(--lh,20px);/* 不能 overflow:hidden：折行续行的那条竖线画在 left:-7px，会被裁掉。宽字符已经按 2ch 对齐了，不需要靠裁剪防溢出；.term-dom 还有 overflow-x:hidden 兜底。 */
  color:var(--t2)}
/* 终端配色分层。全是白字的话，提示符、命令、输出、JSON 混成一片，
   长输出根本没法扫读。色值取界面 token，不额外引入新颜色。 */
.term-line .ta1{color:var(--acc)}            /* 提示符（内核标记） */
.term-line .ta2{color:#E7ECF3}              /* 用户输入回显（内核标记） */
.term-line .ta5{color:var(--err)}              /* 错误（内核标记） */
.term-line .tc-p{color:var(--acc)}            /* 提示符 rvsh> */
.term-line .tc-in{color:#E7ECF3}              /* 用户敲的命令 */
.term-line .tc-json{color:#7DD3FC}            /* 结构化输出 */
.term-line .tc-log{color:#A78BFA}             /* 内核日志 [S] / [U] */
.term-line .tc-err{color:var(--err)}             /* 错误 */
.term-line.hist{color:var(--t3)}              /* 历史行整体压暗，和实时区分开 */
.term-dom .tcur{position:absolute;width:1ch;height:var(--lh,20px);background:var(--acc);
  opacity:.8;border-radius:1px;pointer-events:none;
  animation:tcur 1.06s steps(1) infinite}
@keyframes tcur{50%{opacity:0}}
.term-dom.nocursor .tcur{display:none}

/* 面板：进程表 / 文件表 */
/* 面板（进程表 / 文件表）必须自己限制高度。
   原来 .panel-dom 是 overflow:auto + display:block，里面的 .fscroll
   带 flex:1 却因为没有 flex 容器而失效，被内容撑到 407px，父容器只有 245px——
   于是整个 body 在滚，而 .fscroll 的 clientHeight == scrollHeight，
   看起来「没有滚动条、后面的文件永远看不到」。 */
.panel-dom{overflow:hidden;background:var(--s0);padding:0 0 6px;
  display:flex;flex-direction:column}
.pscroll,.fscroll{flex:1 1 auto;min-height:0;overflow:auto}
.ptab,.ftab{width:100%;border-collapse:collapse;
  font:400 14px/1 var(--font-mono);table-layout:fixed}
.ptab th,.ftab th{position:sticky;top:0;z-index:1;
  height:32px;padding:0 12px;text-align:left;
  font:600 12px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;
  color:var(--t3);background:var(--s0);
  border-bottom:1px solid var(--stroke-sub);white-space:nowrap}
.ptab td,.ftab td{height:var(--rh,40px);padding:0 12px;
  border-bottom:1px solid rgba(255,255,255,.035);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptab td{color:var(--t2)}
.ptab tr.run td{color:var(--acc-hover)}
.ptab tr.run td:first-child{box-shadow:inset 2px 0 0 var(--acc)}
.ftab td.nm{color:var(--t1);font-family:var(--font-mono)}
.ftab td.r,.ptab .r{text-align:right}
.ftab td.dim{color:var(--t3)}
.ftab tbody tr{cursor:default}
.ftab tbody tr:hover td{background:var(--active)}
.ftab tbody tr.sel td{background:rgba(45,212,191,.16)}
.mono{font-family:var(--font-mono)}

/* ── Dock ───────────────────────────────────────────────────── */
#dock{position:absolute;left:0;right:0;bottom:0;height:48px;z-index:40;
  display:flex;align-items:center;padding:0 10px;user-select:none;
  background:rgba(22,28,38,.94);
  border-top:1px solid var(--stroke);
  box-shadow:0 -8px 24px -12px rgba(0,0,0,.6);
  font:400 12px/16px var(--font-ui);color:var(--t2)}
.dock-center{position:absolute;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:2px}
.dock-btn{width:40px;height:40px;border-radius:var(--r-control);display:grid;place-items:center;
  color:var(--t2);transition:background var(--dur-1),color var(--dur-1)}
.dock-btn:hover{background:var(--hover);color:var(--t1)}
.dock-btn svg{width:17px;height:17px}
.dock-apps{display:flex;gap:6px}
.dock-app{position:relative;width:42px;height:40px;border-radius:var(--r-control);
  display:grid;place-items:center;transition:background var(--dur-1)}
.dock-app:hover{background:var(--hover)}
.dock-app:active{background:var(--active)}
.dock-app svg{width:26px;height:26px;opacity:.66;
  transition:opacity var(--dur-2) var(--ease-decel),transform var(--dur-2) var(--ease-decel)}
.dock-app:hover svg{opacity:1;transform:scale(1.08)}
.dock-app:active svg{transform:scale(.96)}
.dock-app.active svg{opacity:1}
.dock-app .ind{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:5px;height:3px;border-radius:2px;background:transparent;
  transition:width var(--dur-2) var(--ease-decel),background var(--dur-2)}
.dock-app.active .ind{width:16px;background:var(--acc)}
.dock-sep{width:1.5px;height:24px;margin:0 10px;background:var(--stroke-strong);
  border-radius:1px}

.dock-tray{margin-left:auto;display:flex;align-items:center;gap:10px;padding-right:4px}
.tray-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 0 rgba(52,211,153,.5);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.42)}
  70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.tray-rate{font:400 11.5px/1 var(--font-mono);color:var(--t3);
  font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.tray-clock{display:flex;flex-direction:column;align-items:flex-end;
  line-height:15px;font-variant-numeric:tabular-nums;padding-left:2px}
.tray-clock b{font-weight:500;color:var(--t1);font-size:12px}
.tray-clock i{font-style:normal;color:var(--t3);font-size:11px}

/* ── 开始菜单 ───────────────────────────────────────────────── */
#startMenu{position:absolute;left:50%;bottom:60px;
  /* 642 宽 / 距任务栏 12px：Win11 官方给的开始菜单尺寸是 642×724，
     间距 12px。原来是 520 宽、间距 6px，窄了 122px，磁贴也挤。 */
  transform:translateX(-50%);width:642px;height:auto;
  max-height:calc(100vh - 78px);
  padding:22px;z-index:60;display:flex;flex-direction:column;
  background:var(--overlay-2);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-flyout);box-shadow:var(--elev-3);
  font:400 14px/20px var(--font-ui);color:var(--t1);
  animation:smIn var(--dur-3) var(--ease-decel)}
@keyframes smIn{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.985)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
/* 按 px 定位的浮层用这个：不带水平位移，弹出时不会先跳到左边 */
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.97)}
  to{opacity:1;transform:none}}
.sm-search{display:flex;align-items:center;gap:10px;height:36px;
  padding:0 12px;border-radius:var(--r-control);background:var(--s3);
  border:1px solid var(--stroke);color:var(--t3);flex:0 0 auto}
.sm-search svg{width:14px;height:14px;flex:0 0 auto}
.sm-search input{flex:1;color:var(--t1);font:400 13.5px/20px var(--font-ui)}
.sm-search input::placeholder{color:var(--t3)}
.sm-sec{margin:20px 0 10px;font:600 11.5px/16px var(--font-ui);
  color:var(--t2);letter-spacing:.02em;flex:0 0 auto}
.sm-tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;flex:0 0 auto}
.sm-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;aspect-ratio:1;padding:10px 6px;border-radius:var(--r-tile);
  transition:background var(--dur-1)}
.sm-tile:hover{background:var(--stroke)}
.sm-tile svg{width:34px;height:34px}
.sm-tile span{font:400 11.5px/15px var(--font-ui);color:var(--t2);
  max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-recent{display:flex;flex-direction:column;gap:1px;flex:0 0 auto;
  overflow:auto;min-height:0}
.sm-ri{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;
  border-radius:var(--r-control);color:var(--t2);font-family:var(--font-mono);font-size:13px;
  transition:background var(--dur-1),color var(--dur-1)}
.sm-ri:hover{background:var(--stroke);color:var(--t1)}
.sm-ri svg{width:13px;height:13px;opacity:.5;flex:0 0 auto}
.sm-user{display:flex;align-items:center;gap:10px;height:54px;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--stroke-sub);flex:0 0 auto}
.sm-av{width:28px;height:28px;border-radius:50%;background:var(--acc);
  color:var(--on-acc);display:grid;place-items:center;font:600 13px/1 var(--font-ui)}
.sm-user-txt{display:flex;flex-direction:column;line-height:16px}
.sm-user-txt b{font:600 13.5px/18px var(--font-ui);color:var(--t1)}
.sm-user-txt i{font-style:normal;font:400 11.5px/15px var(--font-ui);color:var(--t3)}
.sm-power{margin-left:auto;color:var(--t3);padding:6px;border-radius:6px}
.sm-power:hover{color:var(--t1);background:var(--stroke)}

/* ── 调试抽屉 ───────────────────────────────────────────────── */
#drawer{position:absolute;top:0;right:0;bottom:48px;width:340px;z-index:50;
  display:flex;flex-direction:column;
  background:rgba(17,22,29,.96);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  backdrop-filter:blur(22px) saturate(160%);
  border-left:1px solid var(--stroke);
  transform:translateX(100%);transition:transform var(--dur-3) var(--ease-decel);
  font:400 12px/1.5 var(--font-ui);color:var(--t2)}
body.drawer #drawer{transform:translateX(0)}
.dw-head{flex:0 0 44px;display:flex;align-items:center;gap:8px;
  padding:0 12px 0 16px;border-bottom:1px solid var(--stroke-sub)}
.dw-head b{font:600 12.5px/1 var(--font-ui);color:var(--t1)}
.dw-head .grow{flex:1}
.dw-x{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t3)}
.dw-x:hover{background:var(--hover);color:var(--t1)}
.dw-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px 20px}
.dw-sec{margin:16px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--stroke-sub);
  font:600 10.5px/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.dw-sec:first-child{margin-top:0}
.dw-row{display:flex;gap:6px}
.dw-row button{flex:1;font-size:12px;color:var(--t2);background:var(--s2);
  border:1px solid var(--stroke);border-radius:6px;padding:7px 10px;
  white-space:nowrap;transition:var(--dur-2)}
.dw-row button:hover{background:var(--s3);color:var(--t1)}
.dw-row button:disabled{opacity:.34}
.dw-row button.pri{background:var(--acc);border-color:var(--acc);
  color:var(--on-acc);font-weight:600}
.dw-row button.pri:hover{background:var(--acc-hover)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;
  font-family:var(--font-mono);font-size:11.5px}
.kv .k{color:var(--t3);font-family:var(--font-ui);font-size:11.5px}
.kv .v{color:var(--t1)}
/* 窄窗口里的键值对：space-between 会把中间拉出两百多像素的空档，
   看起来像两张不相关的表。这里改成左对齐 + 固定间距。 */
.kv.tight{justify-content:flex-start;gap:14px;padding:4px 0}
.kv.tight .k{min-width:56px}
#reg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;
  font-family:var(--font-mono);font-size:11.5px}
.rg{display:flex;justify-content:space-between;padding:1.5px 4px;border-radius:3px}
.rg:hover{background:var(--s2)}
.rg .n{color:var(--t3)}
.rg.chg .v{color:var(--warn)}
.rg input{width:64px;background:var(--bg-root);color:var(--acc);
  border:1px solid var(--acc);border-radius:3px;font:11.5px var(--font-mono);padding:0 3px}
#events,#snaps,#caps,#files,#procs{max-height:180px;overflow-y:auto;
  font-family:var(--font-mono);font-size:10.5px}
.ev{display:grid;grid-template-columns:34px 30px 1fr;gap:5px;padding:2px 4px;border-radius:3px}
.ev .t{color:var(--t3)}
.ev.spawn .a{color:var(--acc)}.ev.exit .a{color:var(--danger)}
.hint{font-family:var(--font-ui);font-size:11px;color:var(--t3)}
.cap{padding:2px 4px;border-radius:3px}
.cap b{color:var(--acc);font-weight:500}
.cap span{color:var(--t3);margin-left:6px}
.prow{display:grid;grid-template-columns:30px 50px 1fr 30px;gap:5px;padding:3px 4px;border-radius:3px}
.prow.ph{color:var(--t3);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.prow.run{color:var(--acc)}
.prow.ready{color:var(--t1)}
.prow.exit{color:var(--t3)}
.frow{display:flex;justify-content:space-between;padding:2px 4px;border-radius:3px}
.frow b{color:var(--acc);font-weight:500}
.frow span{color:var(--t3)}
.snap{padding:2px 4px;border-radius:3px}
.snap b{color:var(--acc);font-weight:500}

/* 旧的隐藏终端（appendOut 仍然往里写，作为原始 UART 备份） */
#term{display:none}

/* 输入法入口：必须真实可聚焦，canvas/div 收不到组合事件 */
#ime{position:absolute;left:-9999px;top:0;width:10px;height:10px;opacity:0}

/* 设置窗口内的控件 */
.set-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-radius:6px}
.set-row:hover{background:var(--hover)}
.set-row .lb{font:400 12.5px/18px var(--font-ui);color:var(--t1)}
.set-row .sb{font:400 11px/16px var(--font-ui);color:var(--t3)}
.seg{display:flex;gap:2px;background:var(--s2);padding:2px;border-radius:6px}
.seg button{padding:5px 11px;border-radius:4px;font-size:11.5px;color:var(--t2)}
.seg button.on{background:var(--s4);color:var(--t1)}
.sw{width:36px;height:20px;border-radius:10px;background:var(--s4);
  position:relative;transition:background var(--dur-2)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;
  border-radius:50%;background:var(--t2);transition:var(--dur-2)}
.sw.on{background:var(--acc)}
.sw.on::after{left:19px;background:var(--on-acc)}
.doc{padding:4px 2px;font:400 12.5px/1.75 var(--font-ui);color:var(--t2)}
.doc h4{font:600 13px/1.5 var(--font-ui);color:var(--t1);margin:14px 0 6px}
.doc h4:first-child{margin-top:0}
.doc code{font-family:var(--font-mono);font-size:11.5px;color:var(--acc-hover);
  background:rgba(45,212,191,.09);padding:1px 5px;border-radius:3px}
.doc ul{margin:4px 0 0 16px}
.doc li{margin:2px 0}
.about-hero{display:flex;flex-direction:column;align-items:center;
  padding:16px 0 6px;gap:10px}
.about-hero svg{width:64px;height:64px}
.about-hero b{font:600 17px/1.3 var(--font-display);color:var(--t1)}
.about-hero i{font-style:normal;font:400 11.5px/1.4 var(--font-mono);color:var(--t3)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--stroke-sub);border-radius:6px;overflow:hidden;margin-top:12px}
.about-grid div{background:var(--s0);padding:9px 11px}
.about-grid .k{font:400 10.5px/1.4 var(--font-ui);color:var(--t3)}
.about-grid .v{font:400 12px/1.5 var(--font-mono);color:var(--t1)}

/* ── Files 工具栏 ─────────────────────────────────────────────
   窗口只有 216px 宽，按钮做成纯图标；文字留给 tooltip 和右键菜单。 */
.fbar{display:flex;gap:1px;align-items:center;padding:4px 5px;flex:0 0 auto;
  border-bottom:1px solid var(--stroke)}
.fbar .sep{width:1px;height:15px;margin:0 3px;background:var(--stroke);flex:0 0 auto}
.fbar button{width:23px;height:22px;display:grid;place-items:center;flex:0 0 auto;
  border-radius:var(--r-control);color:var(--t2)}
.fbar button:hover{background:var(--stroke);color:var(--t1)}
.fbar button:disabled{color:var(--t-disabled);pointer-events:none}
.fbar svg{width:14px;height:14px;stroke-width:1.8}
.fbar .grow{flex:1 1 auto}
.fpath{padding:2px 8px;flex:0 0 auto;font:400 11px/15px var(--font-mono);color:var(--t3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--stroke)}
.fscroll{flex:1 1 auto;min-height:0;overflow:auto}

/* 窗口内的小对话框：不用 window.prompt，那个浅色系统弹窗在深色桌面上很突兀 */
.fdlg{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:rgba(8,10,14,.55)}
.fdlg-box{width:190px;padding:10px;border-radius:var(--r-window);
  background:rgba(32,38,47,.99);border:1px solid var(--stroke);box-shadow:var(--elev-2)}
.fdlg-t{font:500 12px/16px var(--font-ui);color:var(--t1);margin-bottom:7px}
.fdlg input{width:100%;height:26px;padding:0 7px;border-radius:var(--r-control);
  background:var(--s3);border:1px solid var(--stroke);color:var(--t1);
  font:400 12px/26px var(--font-mono)}
.fdlg-b{display:flex;gap:6px;justify-content:flex-end;margin-top:9px}
.fdlg-b button{height:24px;padding:0 11px;border-radius:var(--r-control);
  font:400 12px/24px var(--font-ui);color:var(--t1);background:var(--s3);
  border:1px solid var(--stroke)}
.fdlg-b button.pri{background:var(--acc);border-color:transparent;color:var(--on-acc)}

/* ── 文本编辑器 ── */
.ed-wrap{display:flex;flex-direction:column;height:100%;background:var(--s0)}
.ed-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;flex:0 0 auto;
  border-bottom:1px solid var(--stroke)}
.ed-path{flex:1 1 auto;font:400 11px/16px var(--font-mono);color:var(--t3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-bar button{height:24px;padding:0 10px;border-radius:var(--r-control);
  font:400 12px/24px var(--font-ui);color:var(--t1);background:var(--s3);
  border:1px solid var(--stroke)}
.ed-bar button.pri{background:var(--acc);border-color:transparent;color:var(--on-acc)}
.ed-area{flex:1 1 auto;min-height:0;width:100%;resize:none;border:0;outline:none;
  padding:9px 11px;background:transparent;color:var(--t1);
  font:400 12.5px/19px var(--font-mono)}
.ed-st{flex:0 0 auto;padding:4px 10px;font:400 11px/15px var(--font-ui);
  color:var(--t3);border-top:1px solid var(--stroke)}

/* ── 终端查找条 ── */
.term-find{display:flex;align-items:center;gap:8px;padding:6px 10px;flex:0 0 auto;
  background:var(--s2);border-bottom:1px solid var(--stroke)}
.term-find input{flex:1 1 auto;min-width:0;background:var(--s1);border:1px solid var(--stroke);
  border-radius:4px;padding:4px 8px;color:var(--t1);outline:none;
  font:400 12.5px/18px var(--font-ui)}
.term-find input:focus{border-color:var(--acc)}
.term-find .tf-n{font:400 11.5px/16px var(--font-mono);color:var(--t3);flex:0 0 auto}
.term-find button{width:22px;height:22px;border-radius:4px;color:var(--t2);
  display:grid;place-items:center;flex:0 0 auto}
.term-find button:hover{background:var(--s3);color:var(--t1)}
/* 命中的行整行高亮：不改行内 DOM，避免和属性着色、选区打架 */
.term-line.hit{background:rgba(250,204,21,.16)}
/* 折行续行标记。manifest 这种长 JSON 折行后，续行以 ,"desc": 开头，
   和上一条混在一起分不清；左侧一条淡竖线就能把一条内容框起来。
   left:-7px 落在 .term-dom 的 12px 内边距里，不会顶到第一个字符。 */
/* 竖线必须画在行内：.term-dom 有 overflow-x:hidden，画在 left:-7px 会被裁掉
   （实测截图字节级没变，就是因为这个）。用 inset 阴影画在 padding 区，
   再用负 margin 把行左移、padding 把内容推回原位，字符位置不变。 */
.term-line.wrap{margin-left:-6px;padding-left:6px;
  box-shadow:inset 2px 0 0 rgba(255,255,255,.18)}
/* 宽字符必须占满两格。
   Cascadia Mono 的 ASCII 是 9.38px，中文回退到雅黑是 16px，比例 1.707 而不是 2——
   内核按「中文占 2 列」排，渲染出来每行就短一截，中文越多右边缘越参差。
   （MS Gothic / SimSun / SimHei 的 ASCII 恰好 8px、中文 16px，正好 2:1，
   但它们的英文是宋体/日文字形，做终端太丑，所以不改字体，改宽度。） */
.term-line .w2{display:inline-block;width:2ch;text-align:left;vertical-align:top;/* 全角字形只有 1em（16px），而 2ch 是 18.75px，居中会两侧各留 1.4px 空隙，看起来像「字距偏松」。横向拉伸 1.172 倍正好填满格子（2ch/1em 恒定，不随字号变），从左边拉伸所以配 text-align:left。 */transform:scaleX(1.172);transform-origin:left center}

/* ── 窗口切换器（Alt+`）─────────────────────────────────────
   浏览器拿不到系统级的 Alt+Tab（那是 OS 的），所以用 Alt+`，
   也就是 Windows 里「切换同一应用的窗口」那个键。 */
#switcher{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.98);
  display:none;gap:10px;padding:14px;border-radius:12px;
  background:var(--overlay-2);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:200;opacity:0;
  transition:opacity var(--dur-1) var(--ease-decel),transform var(--dur-1) var(--ease-decel)}
#switcher.on{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1)}
.sw-item{width:168px;height:112px;border-radius:8px;background:var(--s2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  border:1px solid transparent;transition:background var(--dur-1),border-color var(--dur-1)}
.sw-item svg{width:32px;height:32px}
.sw-item span{font:400 12.5px/16px var(--font-ui);color:var(--t2);max-width:150px;
  text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-item.sel{background:rgba(45,212,191,.14);border-color:rgba(94,234,212,.5)}
.sw-item.sel span{color:var(--t1)}


/* ── 浅色主题 ────────────────────────────────────────────────
   深色是本命，浅色是一套覆盖：只改 token，不改任何组件规则。
   配色取 Win11 Light 的层次（#F3F3F3 底 / 白卡片 / 89%-62%-45% 文字）
   和 GNOME Light 的中性灰，强调色压深到 #0D9488 保证在浅底上够对比。 */
[data-theme="light"]{
  --s0:#F3F4F6; --s1:#FFFFFF; --s2:#F9FAFB; --s3:#E5E7EB;
  --t1:#111827; --t2:rgba(17,24,39,.72); --t3:rgba(17,24,39,.48);
  --acc:#0D9488;
  --stroke-sub:rgba(0,0,0,.06); --stroke:rgba(0,0,0,.10); --stroke-strong:rgba(0,0,0,.16);
  --hover:rgba(0,0,0,.06); --active:rgba(0,0,0,.10);
  --overlay:rgba(255,255,255,.97); --overlay-2:rgba(255,255,255,.99);
  --sh-1:rgba(0,0,0,.07); --sh-2:rgba(0,0,0,.10); --sh-3:rgba(0,0,0,.16);
  --s4:#D1D5DB; --on-acc:#FFFFFF;
  --titlebar-bg:linear-gradient(180deg,rgba(0,0,0,.035),rgba(0,0,0,.015));
  --sb-thumb:rgba(0,0,0,.22); --sb-thumb-h:rgba(0,0,0,.34); --sb-thumb-a:rgba(0,0,0,.45);
  --ok:#0F7B0F; --warn:#9D5D00; --err:#C42B1C;
}
/* 浅色下终端换成浅底深字（对应 macOS Terminal 的 Basic 方案） */

[data-theme="light"] .term-line{color:rgba(31,35,40,.86)}
[data-theme="light"] .term-line .ta1{color:#0D9488}

[data-theme="light"] .term-line.wrap{box-shadow:inset 2px 0 0 rgba(0,0,0,.16)}
/* 浅色下壁纸的遮罩不要压得太暗 */
[data-theme="light"] #wall::after{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.28))}
[data-theme="light"] .dicon span{text-shadow:0 1px 2px rgba(255,255,255,.95)}
/* ── 滚动条 ───────────────────────────────────────────────────
   默认滚动条是浅色系统组件，放在深色面板上就是一块白胶布。
   按 Win11 / VS Code 深色主题的规格自绘：10px 宽、轨道透明、
   滑块半透明圆角 5px，再用 2px 透明边框把滑块视觉收窄到 6px；
   悬停和按下分两档提亮，让人知道它可拖。
   标准属性给 Firefox，-webkit- 给 Chrome/Edge。 */
/* scrollbar-color 不认 var()（实测回退成 auto），只能用字面值；
   浅色主题在下面单独覆盖。::-webkit-scrollbar-* 那几条用 var 是好的。 */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
[data-theme="light"] *{scrollbar-color:rgba(0,0,0,.22) transparent}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:5px;
  border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-h);background-clip:padding-box}
::-webkit-scrollbar-thumb:active{background:var(--sb-thumb-a);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

/* ── 缩放手柄 ─────────────────────────────────────────────────
   八向。边 6px、角 12px（Win11 的命中区约 4-8px，角上放大一点更好抓）。
   手柄层级低于窗控按钮：右上角那块归关闭按钮，符合真实系统的优先级。 */
/* 最大化：圆角归零，否则四角会露出壁纸 */
.win.max,.win.max .win-bar,.win.max .win-body{border-radius:0}

/* 失焦：标题栏压暗、阴影减一层。三家都有失焦态，我们以前完全没有，
   于是「哪个窗口是当前窗口」只能靠有没有强调色描边去猜。 */
.win:not(.focused) .win-title{color:var(--t3)}
.win:not(.focused){box-shadow:var(--sh-1) 0 2px 6px,var(--sh-2) 0 10px 24px}

.win .rz{position:absolute;z-index:1}

.win .rz-w{left:0;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.win .rz-e{right:0;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.win .rz-nw{top:0;left:0;width:16px;height:16px;cursor:nwse-resize}
.win .rz-ne{top:0;right:0;width:16px;height:16px;cursor:nesw-resize}
.win .rz-sw{bottom:0;left:0;width:16px;height:16px;cursor:nesw-resize}
.win .rz-se{bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize}
.win .win-ctl{position:relative;z-index:2}
.win.resizing,.win.resizing *{user-select:none}
.win.dragging,.win.resizing{transition:none}
/* 最小化：缩放淡出，等动画走完再 display:none */
.win.minimizing{opacity:0;transform:scale(.9)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
</style>

/* 让 div 也能用键盘操作：tab 能到、Enter/Space 触发。
   无障碍要求所有功能可键盘完成，而 .dicon/.dock-app/.sm-tile 都是 div。 */
function makeFocusable(el, onActivate) {
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onActivate(); }
  });
}

function iconsRender() {
  const box = $("icons");
  if (!box || box.dataset.built) return;
  box.dataset.built = "1";
  box.insertAdjacentHTML("beforeend", SVG_DEFS);
  for (const app of APPS) {
    const d = document.createElement("div");
    d.className = "dicon";
    d.dataset.app = app.id;
    d.innerHTML = '<svg viewBox="0 0 44 44">' + app.ico + '</svg><span>' + app.name + '</span>';
    d.onclick = () => {
      box.querySelectorAll(".dicon").forEach((x) => x.classList.remove("sel"));
      d.classList.add("sel");
    };
    d.ondblclick = () => { launch(app.id); };
    makeFocusable(d, () => launch(app.id));
    box.appendChild(d);
  }
}

function dockRender() {
  const box = $("dockApps");
  if (!box || box.dataset.built) return;
  box.dataset.built = "1";
  for (const app of APPS) {
    const d = document.createElement("div");
    d.className = "dock-app";
    d.dataset.app = app.id;
    d.title = app.name;
    d.innerHTML = '<svg viewBox="0 0 44 44">' + app.ico + '</svg><span class="ind"></span>';
    d.onclick = () => launch(app.id);
    d.addEventListener("pointerenter", () => tipShow(d, app.name));
    d.addEventListener("pointerleave", tipHide);
    makeFocusable(d, () => launch(app.id));
    box.appendChild(d);
  }
}

/* 点图标 / Dock / 开始菜单磁贴的统一入口 */
function launch(id) {
  const app = APPS.find((a) => a.id === id);
  if (!app) return;
  if (app.w >= 0) {
    if (!M) return;
    sendWinCmd(app.w * 10 + 5);   /* 5 = 恢复并聚焦 */
    hostWinClose(id === "settings" ? "" : "");
  } else {
    hostWinToggle(id);
  }
  closeStartMenu();
}

/* ══ 主题 ══
   深色是默认；浅色只是换一套 token（见 [data-theme="light"]）。
   存在 localStorage，刷新后保持。 */
function applyTheme(t) {
  const v = t === "light" ? "light" : "dark";
  if (v === "light") document.documentElement.dataset.theme = "light";
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("rvsim.theme", v); } catch (_) {}
  const seg = document.getElementById("setTheme");
  if (seg) for (const b of seg.children) b.classList.toggle("on", b.dataset.t === v);
  /* 换主题后壁纸要跟着换（极光有深浅两版），终端尺寸也可能变 */
  let wi = 0;
  try { wi = +(localStorage.getItem("rvsim.wall") || 0); } catch (_) {}
  applyWallpaper(wi, false);
  if (window.rv && window.rv.ready) requestAnimationFrame(() => termLayout(winEls[0] && winEls[0].body, true));
}
function initTheme() {
  let t = "dark";
  try { t = localStorage.getItem("rvsim.theme") || "dark"; } catch (_) {}
  applyTheme(t);
}

/* ══ 宿主侧应用窗口（Settings / Guide / About）══ */
const hostWins = new Map();   /* id -> { el, app, x, y, w, h, min } */
let hostZ = 30;

function hostWinToggle(id) {
  const ex = hostWins.get(id);
  if (ex) {
    if (ex.el.style.display === "none") { ex.el.style.display = "flex"; ex.min = false; }
    else { ex.el.style.display = "none"; ex.min = true; }
    hostWinFocus(id);
    return;
  }
  hostWinOpen(id);
}
function hostWinClose(id) {
  const w = hostWins.get(id);
  if (!w) return;
  w.el.remove();
  hostWins.delete(id);
}

function hostWinOpen(id) {
  const app = APPS.find((a) => a.id === id);
  const layer = $("winlayer");
  if (!app || !layer) return;
  const size = id === "settings" ? [340, 392] : id === "guide" ? [400, 520] : [330, 344];
  const n = hostWins.size;
  const el = document.createElement("div");
  el.className = "win host-win";
  el.style.width = size[0] + "px";
  el.style.height = size[1] + "px";
  el.style.left = Math.round(140 + n * 28) + "px";
  el.style.top = Math.round(120 + n * 24) + "px";
  el.style.zIndex = ++hostZ;
  el.innerHTML =
    '<div class="win-bar"><span class="win-ico">' + (HOST_ICO[id] || "") + '</span>'
    + '<span class="win-title">' + app.name + '</span>'
    + '<span class="win-ctl">'
    + '<button class="min" title="最小化"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="currentColor" stroke-width="1.2"/></svg></button>'
    + '<button class="close" title="关闭"><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>'
    + '</span></div><div class="win-body"></div>';
  layer.appendChild(el);
  const body = el.querySelector(".win-body");
  body.innerHTML = hostWinBody(id);

  /* 内容比窗口高就把窗口长到内容高度。
     About 原来固定 344px 高、内容 498px，6 格信息里只有 2 格在可视区，
     用户会以为系统只报了 2 项——这不是「能滚动就行」，是默认视图不可信。 */
  requestAnimationFrame(() => {
    if (!el.isConnected) return;
    const need = body.scrollHeight + 34;          /* 34 = 标题栏 32 + 边框 */
    const maxH = window.innerHeight - 90;
    const want = Math.round(Math.min(Math.max(size[1], need), maxH));
    if (Math.abs(want - size[1]) > 2) {
      el.style.height = want + "px";
      const top = parseFloat(el.style.top) || 0;
      if (top + want > window.innerHeight - 16) {
        el.style.top = Math.max(16, window.innerHeight - want - 16) + "px";
      }
    }
  });

  wireHostWin(id, el, size, app);
  if (id === "settings") bindSettings(body);
}

/* 宿主窗口的公共接线：关闭、最小化、聚焦、拖动。
   编辑器和三个内置应用共用这一份，避免两套拖动逻辑各修一遍。 */
function wireHostWin(id, el, size, app) {
  el.querySelector(".close").onclick = (e) => { e.stopPropagation(); hostWinClose(id); };
  el.querySelector(".min").onclick = (e) => {
    e.stopPropagation(); el.style.display = "none";
    const w = hostWins.get(id);
    if (w) w.min = true;
  };
  el.addEventListener("pointerdown", () => hostWinFocus(id), true);

  const bar = el.querySelector(".win-bar");
  bar.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest(".win-ctl")) return;
    ev.stopPropagation();
    const r = el.getBoundingClientRect();
    const os = desk().getBoundingClientRect();
    const dx = ev.clientX - r.left, dy = ev.clientY - r.top;
    const move = (e2) => {
      const x = Math.max(-size[0] + 80, Math.min(os.width - 60, e2.clientX - os.left - dx));
      const y = Math.max(0, Math.min(os.height - 90, e2.clientY - os.top - dy));
      el.style.left = x + "px"; el.style.top = y + "px";
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
  el.addEventListener("pointerdown", () => { hostWinFocus(id); }, true);

  hostWins.set(id, { el, app, min: false });
  hostWinFocus(id);
}

function hostWinFocus(id) {
  const w = hostWins.get(id);
  if (!w) return;
  w.el.style.zIndex = ++hostZ;
  hostWins.forEach((v, k) => v.el.classList.toggle("focused", k === id));
}

function bindSettings(root) {
  const wall = $("setWall"), ic = $("setIcons"), fs = $("setFs"), boot = $("setBoot");
  const th = $("setTheme");
  if (th) {
    let cur = "dark";
    try { cur = localStorage.getItem("rvsim.theme") || "dark"; } catch (e) {}
    th.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.t === cur));
    th.onclick = (e) => {
      const b = e.target.closest("button"); if (!b) return;
      applyTheme(b.dataset.t);
    };
  }
  if (boot) {
    try { if (localStorage.getItem("rvsim.skipBoot") === "1") boot.classList.remove("on"); } catch (e) {}
  }
  try {
    const wv = localStorage.getItem("rvsim.wall");
    if (wv !== null && wv !== "0") {
      applyWallpaper(+wv, false);
      const b = document.querySelector('#setWall button[data-w="' + wv + '"]');
      if (b) { document.querySelectorAll("#setWall button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); }
    }
    const tv = localStorage.getItem("rvsim.termScale");
    if (tv) {
      termScale = +tv;
      const b = document.querySelector('#setFs button[data-f="' + tv + '"]');
      if (b) { document.querySelectorAll("#setFs button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); }
      termLayout(winEls[0] && winEls[0].body, true);
    }
  } catch (e) {}
  if (wall) wall.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    wall.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    applyWallpaper(+b.dataset.w, true);
  };
  if (ic) ic.onclick = () => {
    ic.classList.toggle("on");
    $("icons").style.display = ic.classList.contains("on") ? "" : "none";
  };
  if (fs) fs.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    fs.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    termScale = +b.dataset.f;
    try { localStorage.setItem("rvsim.termScale", String(termScale)); } catch (e) {}
    termLayout(winEls[0] && winEls[0].body, true);
  };
  if (boot) boot.onclick = () => {
    boot.classList.toggle("on");
    try { localStorage.setItem("rvsim.skipBoot", boot.classList.contains("on") ? "0" : "1"); } catch (e) {}
  };
}

/* ══ 窗口层 ══ */
const WIN_SLOTS = 3;
const winEls = [];
let winLayer = null;

/* ── 吸附区域（逻辑坐标 800x600）──
   Win11 的 Snap Layouts：拖到左右边缘 → 半屏，拖到顶部 → 最大化，
   拖到四角 → 1/4 屏。边缘触发距离 26 逻辑像素（约屏幕宽 3%）。 */
const SNAP = {
  top:   [0, 0, 800, 600],
  tl:    [0, 0, 400, 300], tr: [400, 0, 400, 300],
  bl:    [0, 300, 400, 300], br: [400, 300, 400, 300],
  left:  [0, 0, 400, 600], right: [400, 0, 400, 600],
};
const SNAP_EDGE = 26;

/* 吸附判定用屏幕像素，不是逻辑坐标：鼠标走到窗口最左缘时，
   换算出来的逻辑坐标是负的（桌面等比居中，四周有留白），
   拿它跟 0 比永远不成立。底部不吸附 —— Win11 底部是任务栏。 */
/* 窗口命令字统一入口。值加 1：idx=0/act=0 打包成 0 会被内核当成「无命令」，
   关闭第一个窗口的命令就永远发不出去。 */
/* 命令字只有一个槽位，内核每轮主循环读一次并清零。
   宿主连续发三条（比如「关闭全部窗口」）时，后一条会覆盖前一条，
   只有最后一条被执行。这里串行化：发一条，等内核清空，再发下一条。 */
const cmdQueue = [];
let cmdBusy = false;
function sendWinCmd(v) {
  if (!M) return;
  cmdQueue.push(v + 1);
  drainCmd();
}
function drainCmd() {
  if (cmdBusy || !cmdQueue.length || !M) return;
  cmdBusy = true;
  const v = cmdQueue.shift();
  const addr = guestOff(WIN_CMD_PA);
  M.HEAPU32[addr] = v;
  const wait = () => {
    if (!M) { cmdBusy = false; return; }
    if (M.HEAPU32[addr] === 0) {
      cmdBusy = false;
      if (cmdQueue.length) setTimeout(drainCmd, 6);
    } else {
      setTimeout(wait, 6);
    }
  };
  setTimeout(wait, 6);
}

function snapZonePx(px, py, W, H) {
  /* 必须先夹到桌面范围内。拖到顶部/左上角时鼠标已经出了桌面边界，
     坐标是负的——原来的 px < 0 就直接 return null，把吸附判没了，
     用户看到的就是「拖到边上什么都不发生」。 */
  px = Math.max(0, Math.min(W, px));
  py = Math.max(0, Math.min(H, py));
  const L = px <= SNAP_EDGE, R = px >= W - SNAP_EDGE;
  const T = py <= SNAP_EDGE, B = py >= H - SNAP_EDGE;
  if (T && L) return "tl";
  if (T && R) return "tr";
  if (B && L) return "bl";
  if (B && R) return "br";
  if (T) return "top";
  if (L) return "left";
  if (R) return "right";
  return null;
}

/* 拖到另一个窗口的左/右边缘时，吸附到屏幕对应半边 ——
   对方不动，自己贴上去，效果就是并排。比「同时移动两个窗口」简单得多，
   内核协议也不用扩。 */
function snapToNeighbor(px, py, selfIdx, L, osR) {
  const ws = window.rv && window.rv.ready ? window.rv.state.wins : null;
  if (!ws) return null;
  for (let j = 0; j < ws.length; j++) {
    if (j === selfIdx) continue;
    const w = ws[j];
    if (!w.visible) continue;
    const x = L.ox + w.x * L.scale, y = L.oy + w.y * L.scale;
    const ww = w.w * L.scale, wh = w.h * L.scale;
    if (py < y || py > y + wh) continue;
    const NEAR = 40;
    if (Math.abs(px - x) < NEAR) return "left";
    if (Math.abs(px - (x + ww)) < NEAR) return "right";
  }
  return null;
}

function snapShow(zone) {
  if (!zone) { snapHide(); return; }
  snapShowRect(...SNAP[zone]);
}
function snapHide() {
  const g = $("snapGhost");
  if (g) g.classList.remove("on");
}

/* 按逻辑矩形显示占位（布局选择器预览用） */
function snapShowRect(x, y, w, h) {
  const g = $("snapGhost");
  if (!g) return;
  const osR = desk().getBoundingClientRect();
  const L = deskTransform(osR.width, osR.height);
  g.style.left = (L.ox + x * L.scale).toFixed(1) + "px";
  g.style.top = (L.oy + y * L.scale).toFixed(1) + "px";
  g.style.width = (w * L.scale).toFixed(1) + "px";
  g.style.height = (h * L.scale).toFixed(1) + "px";
  g.classList.add("on");
}

/* ── 吸附布局（Win11 Snap Layouts 的 4 种）──
   百分比表示，应用时 ×8 / ×6 换算成 800x600 的逻辑坐标。 */
const SNAP_LAYOUTS = [
  [[0, 0, 50, 100], [50, 0, 50, 100]],                          /* 两列 */
  [[0, 0, 66.7, 100], [66.7, 0, 33.3, 100]],                    /* 2/3 + 1/3 */
  [[0, 0, 33.3, 100], [33.3, 0, 33.3, 100], [66.6, 0, 33.4, 100]], /* 三列 */
  [[0, 0, 50, 50], [50, 0, 50, 50], [0, 50, 50, 50], [50, 50, 50, 50]], /* 四宫格 */
];
let snapPickerFor = -1, snapPickerTimer = null, snapPickerHideTimer = null;

function snapPickerBuild() {
  const p = $("snapPicker");
  if (!p || p.dataset.built) return;
  p.dataset.built = "1";
  for (const cells of SNAP_LAYOUTS) {
    const box = document.createElement("div");
    box.className = "sl";
    for (const [x, y, w, h] of cells) {
      const c = document.createElement("div");
      c.className = "sl-cell";
      c.style.left = x + "%";
      c.style.top = y + "%";
      c.style.width = "calc(" + w + "% - 4px)";
      c.style.height = "calc(" + h + "% - 4px)";
      c.style.margin = "2px";
      c.onpointerenter = () => snapShowRect(x * 8, y * 6, w * 8, h * 6);
      c.onpointerleave = () => snapHide();
      c.onclick = () => {
        const i = snapPickerFor;
        if (i >= 0) {
          setWinRect(i, Math.round(x * 8), Math.round(y * 6), Math.round(w * 8), Math.round(h * 6));
        }
        snapPickerHide();
        snapHide();
      };
      box.appendChild(c);
    }
    p.appendChild(box);
  }
  p.addEventListener("pointerenter", () => clearTimeout(snapPickerHideTimer));
  p.addEventListener("pointerleave", () => {
    snapPickerHideTimer = setTimeout(snapPickerHide, 260);
  });
}

function snapPickerShow(i, anchor) {
  const p = $("snapPicker");
  if (!p) return;
  snapPickerBuild();
  snapPickerFor = i;
  p.classList.add("on");
  const r = anchor.getBoundingClientRect();
  const osR = desk().getBoundingClientRect();
  const pw = p.offsetWidth || 224;
  p.style.left = Math.max(8, Math.min(osR.width - pw - 8, r.right - osR.left - pw)) + "px";
  p.style.top = (r.bottom - osR.top + 6) + "px";
}

function snapPickerHide() {
  const p = $("snapPicker");
  if (p) p.classList.remove("on");
  snapPickerFor = -1;
  snapHide();
}

/* ── 右键菜单 ── */
/* 有些调用点忘了传坐标（终端里右键就是），cx/cy 变成 undefined，
   left/top 算出 NaN，菜单会跑到屏幕左上角。这里用最近一次 contextmenu
   的位置兜底，调用点传不传都对。 */
let lastCtxX = 0, lastCtxY = 0;
document.addEventListener("contextmenu", (e) => {
  lastCtxX = e.clientX; lastCtxY = e.clientY;
}, true);

function showCtx(items, cx, cy) {
  const m = $("ctxMenu");
  if (!m) return;
  if (cx == null || !isFinite(cx)) cx = lastCtxX;
  if (cy == null || !isFinite(cy)) cy = lastCtxY;
  m.innerHTML = "";
  for (const it of items) {
    if (it === "-") {
      const d = document.createElement("div");
      d.className = "ctx-sep";
      m.appendChild(d);
      continue;
    }
    const d = document.createElement("div");
    d.className = "ctx-item" + (it.disabled ? " disabled" : "");
    d.textContent = it.label;
    if (!it.disabled) d.onclick = () => { hideCtx(); it.action(); };
    m.appendChild(d);
  }
  m.classList.add("on");
  const osR = desk().getBoundingClientRect();
  const w = m.offsetWidth || 190, h = m.offsetHeight || 120;
  m.style.left = Math.max(4, Math.min(cx - osR.left, osR.width - w - 8)) + "px";
  m.style.top = Math.max(4, Math.min(cy - osR.top, osR.height - h - 8)) + "px";
}
function hideCtx() {
  const m = $("ctxMenu");
  if (m) m.classList.remove("on");
}

/* 窗口位置回写：只挪位置 / 位置+尺寸（吸附） */
function setWinPos(i, x, y) {
  if (!M) return;
  const b = guestOff(WIN_POS_PA);
  M.HEAPU32[b] = i;
  M.HEAPU32[b + 1] = Math.max(0, Math.min(800, x));
  M.HEAPU32[b + 2] = Math.max(0, Math.min(600, y));
  M.HEAPU32[b + 3] = 0;
  M.HEAPU32[b + 4] = 0;
  posSeq = (posSeq + 1) & 0x7fffffff; if (!posSeq) posSeq = 1;
  M.HEAPU32[b + 5] = posSeq;
}
function setWinRect(i, x, y, w, h) {
  if (!M) return;
  /* 内核里这几个字段是 u32：传负数会变成 4294967295，窗口直接飞出桌面。
     窗口本来也只能待在 800×600 的逻辑桌面里，这里统一夹一次。 */
  x = Math.max(0, Math.min(800, Math.round(x)));
  y = Math.max(0, Math.min(600, Math.round(y)));
  w = Math.max(60, Math.min(800 - x, Math.round(w)));
  h = Math.max(40, Math.min(600 - y, Math.round(h)));
  const b = guestOff(WIN_POS_PA);
  M.HEAPU32[b] = i;
  M.HEAPU32[b + 1] = x;
  M.HEAPU32[b + 2] = y;
  M.HEAPU32[b + 3] = w;
  M.HEAPU32[b + 4] = h;
  posSeq = (posSeq + 1) & 0x7fffffff; if (!posSeq) posSeq = 1;
  M.HEAPU32[b + 5] = posSeq;
}

/* 标题栏图标：16px 下 44px 的彩色图标会糊成一团色块，
   所以单独一套线条版 */
const WIN_ICONS = [
  '<svg viewBox="0 0 16 16" fill="none" stroke="#5EEAD4" stroke-width="1.7" '
    + 'stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.4L6.3 8 3 11.6M7.6 11.6H13"/></svg>',
  '<svg viewBox="0 0 16 16" fill="none" stroke="#A5B4FC" stroke-width="1.7" '
    + 'stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l3.6-4.6 2.8 3.1L12 4.8l2 7.2"/></svg>',
  '<svg viewBox="0 0 16 16" fill="none" stroke="#7DD3FC" stroke-width="1.6" '
    + 'stroke-linejoin="round"><path d="M2 5.3h4.1l1.2 1.6H14v6.1a1.2 1.2 0 01-1.2 1.2H3.2A1.2 1.2 0 012 13V5.3z"/></svg>',
];

function winInit() {
  winLayer = $("winlayer");
  if (!winLayer) return;
  for (let i = 0; i < WIN_SLOTS; i++) {
    const el = document.createElement("div");
    el.className = "win";
    el.style.display = "none";
    el.innerHTML =
      '<div class="win-bar"><span class="win-ico">' + WIN_ICONS[i] + '</span>'
      + '<span class="win-title"></span>'
      + '<span class="win-ctl">'
      + '<button class="min" data-act="1" title="最小化"><svg viewBox="0 0 10 10"><path d="M2 5h6" stroke="currentColor" stroke-width="1.2"/></svg></button>'
      + '<button class="max" data-act="2" title="最大化"><svg viewBox="0 0 10 10"><rect x="2.2" y="2.2" width="5.6" height="5.6" rx=".8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></button>'
      + '<button class="close" data-act="0" title="关闭"><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>'
      + '</span></div>'
      + (i === 0 ? '<div class="win-body term-dom"><div class="tcur"></div></div>'
                 : (i === 2
                    ? '<div class="win-body panel-dom files-body"></div>'
                    : '<div class="win-body panel-dom"></div>'));
    winLayer.appendChild(el);
    const body = el.querySelector(".win-body");
    const we = { el, body, w: 0, h: 0, cx: 0, cy: 0, dragging: false, resizing: false,
                 pending: false, px: 0, py: 0 };
    winEls.push(we);

    /* 点窗口任何地方都该把它提到最前，不只是标题栏。
       放在捕获阶段、且不 preventDefault —— 终端的拖选、
       按钮的点击都还要正常走。 */
    el.addEventListener("pointerdown", () => {
      if (M) sendWinCmd(i * 10 + 5);
    }, true);

    /* ── 八向缩放 ──
       逻辑坐标是 800×600，屏幕上要过 deskTransform，所以拖动期间改的是
       屏幕像素、松手才换算回逻辑坐标写进内核。最小尺寸按逻辑像素给：
       终端要放得下 20 列 × 6 行，面板要放得下表头和两行。 */
    const MIN = i === 0 ? [260, 150] : [150, 110];
    let rzRaf = 0;
    for (const d of ["n", "s", "w", "e", "nw", "ne", "sw", "se"]) {
      const h = document.createElement("div");
      h.className = "rz rz-" + d;
      el.appendChild(h);
      h.addEventListener("pointerdown", (ev) => {
        if (!M) return;
        ev.stopPropagation();
        ev.preventDefault();
        const r0 = el.getBoundingClientRect();
        const osR0 = desk().getBoundingClientRect();
        const L0 = deskTransform(osR0.width, osR0.height);
        const st = { x: r0.left, y: r0.top, w: r0.width, h: r0.height };
        const sx = ev.clientX, sy = ev.clientY;
        we.resizing = true;
        we.pending = false;
        el.classList.add("resizing");
        const minW = MIN[0] * L0.scale, minH = MIN[1] * L0.scale;
        const move = (e2) => {
          const dx = e2.clientX - sx, dy = e2.clientY - sy;
          let x = st.x, y = st.y, w = st.w, h = st.h;
          if (d.indexOf("e") >= 0) w = st.w + dx;
          if (d.indexOf("s") >= 0) h = st.h + dy;
          if (d.indexOf("w") >= 0) { w = st.w - dx; x = st.x + dx; }
          if (d.indexOf("n") >= 0) { h = st.h - dy; y = st.y + dy; }
          if (w < minW) { if (d.indexOf("w") >= 0) x = st.x + st.w - minW; w = minW; }
          if (h < minH) { if (d.indexOf("n") >= 0) y = st.y + st.h - minH; h = minH; }
          x = Math.max(0, x); y = Math.max(0, y);
          w = Math.min(w, osR0.width - x); h = Math.min(h, osR0.height - y);
          const st2 = el.style;
          st2.left = x.toFixed(1) + "px"; st2.top = y.toFixed(1) + "px";
          st2.width = w.toFixed(1) + "px"; st2.height = h.toFixed(1) + "px";
          we.px = x; we.py = y;
          /* 内容跟着窗口走。用 rAF 节流到每帧最多一次：
             不节流的话 pointermove 一次就重排一次，比不重排还慢。 */
          if (!rzRaf) rzRaf = requestAnimationFrame(() => {
            rzRaf = 0;
            if (i === 0) termLayout(el.querySelector(".term-dom"), false);
            panelsRender();
          });
        };
        const up = () => {
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
          we.resizing = false;
          el.classList.remove("resizing");
          const osR1 = desk().getBoundingClientRect();
          const L1 = deskTransform(osR1.width, osR1.height);
          const nx = Math.max(0, Math.min(800, Math.round((parseFloat(el.style.left) - L1.ox) / L1.scale)));
          const ny = Math.max(0, Math.min(600, Math.round((parseFloat(el.style.top) - L1.oy) / L1.scale)));
          const nw = Math.max(60, Math.min(800 - nx, Math.round(parseFloat(el.style.width) / L1.scale)));
          const nh = Math.max(40, Math.min(600 - ny, Math.round(parseFloat(el.style.height) / L1.scale)));
          setWinRect(i, nx, ny, nw, nh);      /* 尺寸也回写内核，内核才是权威 */
          we.pending = true;
          we.pendingUntil = Date.now() + 600;
          if (i === 0) termLayout(el.querySelector(".term-dom"), true);
          panelsRender();
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
      });
    }

    /* ── 拖动：宿主自己搬，不等内核 ──
       旧路径是 pointermove 写鼠标寄存器 → 内核下一轮主循环读 → 改坐标 →
       宿主再读回来改 style，中间隔 1-2 帧，手感是「追着鼠标跳」。
       现在直接改 el.style.left/top，同一帧生效；松手后把最终逻辑坐标
       写回内核（WIN_POS_PA），让内核里的位置仍然是权威。 */
    const bar = el.querySelector(".win-bar");
    bar.addEventListener("pointerdown", (ev) => {
      if (ev.target.closest(".win-ctl")) return;
      ev.stopPropagation();          /* 别再让 #os 给内核发一次按下 */
      if (!M) return;
      /* 点标题栏同时聚焦该窗口 */
      sendWinCmd(i * 10 + 5);

      const r = el.getBoundingClientRect();
      const osR = desk().getBoundingClientRect();
      const offX = ev.clientX - r.left, offY = ev.clientY - r.top;
      /* 拖动阈值：Win11 是 4px（SM_CXDRAG），GNOME 是 8px。
         没有阈值的话手一抖窗口就动，双击标题栏也会先跳一下。 */
      const startX = ev.clientX, startY = ev.clientY;
      let moved = false;
      we.dragging = true;
      we.pending = false;
      hostDragActive = true;
      el.classList.add("dragging");
      we.px = r.left; we.py = r.top;

      const move = (e2) => {
        if (!we.dragging) return;
        if (!moved) {
          if (Math.abs(e2.clientX - startX) < 4 && Math.abs(e2.clientY - startY) < 4) return;
          moved = true;
        }
        /* 只允许在桌面内移动：拖出屏幕会让逻辑坐标变负，而内核存的是 u32。
           真实桌面里窗口也是被夹在屏幕内的。 */
        const x = Math.max(0, Math.min(Math.max(0, osR.width - r.width), e2.clientX - osR.left - offX));
        const y = Math.max(0, Math.min(Math.max(0, osR.height - r.height - 8), e2.clientY - osR.top - offY));
        el.style.left = x + "px";
        el.style.top = y + "px";
        we.px = x; we.py = y;
        el.classList.remove("snap-l", "snap-r", "snap-t");
        /* 拖到屏幕边缘就亮吸附预览（Win11 的 Snap Layouts） */
        const L = deskTransform(osR.width, osR.height);
        const px2 = e2.clientX - osR.left, py2 = e2.clientY - osR.top;
        let z = snapZonePx(px2, py2, osR.width, osR.height);
        if (!z) z = snapToNeighbor(px2, py2, i, L, osR);
        we.zone = z;
        snapShow(we.zone);
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        we.dragging = false;
        hostDragActive = false;
        el.classList.remove("dragging");
        snapHide();
        if (!M) return;
        const L = deskTransform(osR.width, osR.height);
        if (we.zone) {
          /* 吸附：位置和尺寸一起交给内核，去掉 dragging 让 .win 的 transition 接管 */
          const [sx, sy, sw, sh] = SNAP[we.zone];
          setWinRect(i, sx, sy, sw, sh);
          we.pending = false;
          el.classList.remove("snap-l", "snap-r", "snap-t");
          if (we.zone === "left") el.classList.add("snap-l");
          else if (we.zone === "right") el.classList.add("snap-r");
          else if (we.zone === "top") el.classList.add("snap-t");
          else if (we.zone) { el.classList.add(we.zone.includes("l") ? "snap-l" : "snap-r", "snap-t"); }
          we.el.style.left = (L.ox + sx * L.scale) + "px";
          we.el.style.top = (L.oy + sy * L.scale) + "px";
          we.el.style.width = (sw * L.scale) + "px";
          we.el.style.height = (sh * L.scale) + "px";
        } else {
          we.pending = true;
          we.pendingUntil = Date.now() + 600;
          setWinPos(i, Math.round((we.px - L.ox) / L.scale), Math.round((we.py - L.oy) / L.scale));
        }
        we.zone = null;
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    });

    /* 双击标题栏最大化/还原（Win11 标准行为） */
    bar.addEventListener("dblclick", (ev) => {
      if (ev.target.closest(".win-ctl")) return;
      if (M) sendWinCmd(i * 10 + 2);
    });

    /* 窗控按钮：直接下发命令字，不让前端重算命中坐标
       （视觉顺序和内核坐标顺序对不上，试过几轮都有偏差） */
    const maxBtn = el.querySelector(".win-ctl .max");
    if (maxBtn) {
      maxBtn.addEventListener("pointerenter", () => {
        clearTimeout(snapPickerTimer);
        clearTimeout(snapPickerHideTimer);
        snapPickerTimer = setTimeout(() => snapPickerShow(i, maxBtn), 450);
      });
      maxBtn.addEventListener("pointerleave", () => {
        clearTimeout(snapPickerTimer);
        snapPickerHideTimer = setTimeout(snapPickerHide, 260);
      });
    }

    el.querySelectorAll(".win-ctl button").forEach((b) => {
      b.addEventListener("pointerdown", (ev) => ev.stopPropagation());
      b.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (!M) return;
        const act = +b.dataset.act;
        if (act === 0) {
          /* 关闭先播 120ms 动画，否则窗口是「啪」地消失 */
          el.classList.add("closing");
          setTimeout(() => {
            el.classList.remove("closing");
            sendWinCmd(i * 10 + 0);
          }, 120);
        } else if (act === 1) {
          /* 最小化：向 dock 方向缩小淡出 */
          el.classList.add("minimizing");
          setTimeout(() => {
            el.classList.remove("minimizing");
            sendWinCmd(i * 10 + 1);
          }, 167);
        } else {
          sendWinCmd(i * 10 + act);
        }
      });
    });

    /* 标题栏右键：窗口菜单 */
    bar.addEventListener("contextmenu", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      showCtx([
        { label: "还原", action: () => { sendWinCmd(i * 10 + 6); } },
        { label: "最小化", action: () => { sendWinCmd(i * 10 + 1); } },
        { label: "最大化", action: () => { sendWinCmd(i * 10 + 2); } },
        "-",
        { label: "关闭", action: () => {
            el.classList.add("closing");
            setTimeout(() => {
              el.classList.remove("closing");
              sendWinCmd(i * 10 + 0);
            }, 120);
          } },
      ], ev.clientX, ev.clientY);
    });
  }
  const tray = $("dockTray");
  if (tray) {
    tray.addEventListener("pointerdown", (e) => e.stopPropagation());
    tray.addEventListener("click", (e) => { e.stopPropagation(); trayPanelShow(); });
    tray.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      e.stopPropagation();
      trayPanelHide();
      showCtx([
        { label: "调整日期和时间", action: () => launch("settings") },
        { label: "任务栏设置", action: () => launch("settings") },
      ], e.clientX, e.clientY);
    });
  }
  $("startBtn").onclick = (e) => {
    e.stopPropagation();
    if ($("startMenu")) closeStartMenu(); else openStartMenu();
  };
  $("dbgBtn").onclick = (e) => { e.stopPropagation(); toggleDrawer(); };
  $("dwClose").onclick = () => toggleDrawer(false);

  /* 桌面右键菜单 */
  desk().addEventListener("contextmenu", (ev) => {
    if (ev.target.closest(".win,#dock,#startMenu,#drawer")) return;
    ev.preventDefault();
    showCtx([
      { label: "刷新", action: () => { iconsRender(); } },
      "-",
      { label: "新建文本文件…", action: () => {
          filesAsk("新建文本文件", "notes.txt").then((nm) => {
            if (!nm) return;
            window.rv.fsWrite((fsCwd ? fsCwd + "/" : "") + nm, "").then(refreshFiles).catch(refreshFiles);
          });
        } },
      { label: "新建文件夹…", action: () => {
          filesAsk("新建文件夹", "docs").then((nm) => {
            if (!nm) return;
            window.rv.fsMkdir((fsCwd ? fsCwd + "/" : "") + nm).then(refreshFiles).catch(refreshFiles);
          });
        } },
      "-",
      { label: "显示设置", action: () => launch("settings") },
      { label: "关于本机", action: () => launch("about") },
    ], ev.clientX, ev.clientY);
  });

  /* 点桌面空白处关开始菜单 */
  desk().addEventListener("pointerdown", (e) => {
    if (!e.target.closest("#startMenu") && !e.target.closest("#startBtn")) closeStartMenu();
    if (!e.target.closest("#ctxMenu")) hideCtx();
    if (!e.target.closest("#trayPanel") && !e.target.closest("#dockTray")) trayPanelHide();
  }, true);
}

/* 800x600 逻辑桌面在窗口里的等比变换。
   鼠标换算和窗口摆放必须共用同一套，否则命中和视觉会错位。
   availH 只扣掉 dock 本身（48），不再额外扣 —— 扣多了最大化窗口
   会在 dock 上方留一条几十像素的壁纸缝。 */
function deskTransform(w, h) {
  const DOCK = 48;
  const availW = w, availH = h - DOCK;
  const scale = Math.min(availW / 800, availH / 600) * 0.985;
  return { scale, ox: (availW - 800 * scale) / 2, oy: (availH - 600 * scale) / 2 };
}

function winReadStr(addr, max) {
  const B = M.HEAPU8;
  const off = M._rv_ram_ptr() + (addr - 0x80000000);
  let n = 0;
  while (n < max && B[off + n]) n++;
  /* 必须按 UTF-8 解：逐字节 fromCharCode 会把中文拆成 Latin-1 乱码 */
  return _dec.decode(B.subarray(off, off + n));
}

/* 终端字号自适应：按「列数刚好铺满宽度」定字号，再把行高拉伸填满高度。
   这样 61x22 的网格在任何窗口尺寸下都不折行、不留大片空白。 */
let monoRatio = 0;
function monoCharRatio() {
  if (monoRatio) return monoRatio;
  const c = document.createElement("canvas").getContext("2d");
  const fam = getComputedStyle(document.body).getPropertyValue("--font-mono") || "monospace";
  c.font = '400 100px ' + fam;
  const w = c.measureText("MMMMMMMMMM").width / 10 / 100;
  monoRatio = w > 0.2 && w < 1.4 ? w : 0.6;
  return monoRatio;
}

function termLayout(host, force, wPx, hPx) {
  if (!host || !termCols || !termRows) return;
  const padX = 12, padY = 10;
  /* 能传就传：读 clientWidth 会拿到「刚写完 style、还没重排」的旧宽度 */
  const W = (wPx != null ? wPx : host.clientWidth) - padX * 2;
  const H = (hPx != null ? hPx : host.clientHeight) - padY * 2;
  if (W <= 0 || H <= 0) return;
  const ratio = monoCharRatio();
  /* 字号上限 15px：再大就不是终端而是大字报了。
     宽度铺不满时右侧留白，真实终端在宽窗口里也是这样。 */
  let fs = (W / (termCols * ratio)) * termScale;
  /* 上限 16px：对齐 Windows Terminal 的默认 12pt（≈16px）。
     18px 时行高 20.7px，22 行 = 455px，超过可用的 450px，
     终端一启动就多出一条 5px 的滚动缝。 */
  fs = Math.max(7.5, Math.min(16 * termScale, fs));
  const cw = fs * ratio;
  if (cw * termCols > W + 0.5) fs = Math.max(7.5, W / (termCols * ratio));
  /* 行高：优先铺满高度，但压在 1.15–1.55 倍字号之间，避免字大行稀 */
  let lh = H / termRows;
  lh = Math.max(fs * 1.15, Math.min(fs * 1.55, lh));
  const key = fs.toFixed(2) + "|" + lh.toFixed(2);
  if (!force && host.dataset.fsKey === key) return;
  host.dataset.fsKey = key;
  host.style.fontSize = fs.toFixed(2) + "px";
  host.style.lineHeight = lh.toFixed(2) + "px";
  host.style.setProperty("--fs", fs.toFixed(2) + "px");
  host.style.setProperty("--lh", lh.toFixed(2) + "px");
  termCharW = fs * ratio;
  termLineH = lh;
  termMetrics.h = 0;      /* 尺寸变了，缓存作废 */
  termMetrics.ch = 0;
  termPlaceCursor();
}

/* 按内核给的属性字节分段上色。
   内核标了 1=提示符 / 2=输入回显 / 5=错误，其余（0）交给行首启发式。
   以前全靠正则猜行首，猜得中是因为内核输出格式固定；现在提示符和
   用户输入在同一行里，只有内核知道哪几个字符是提示符。 */
/* Unicode 宽字符判定，和内核 fb.c 的 is_wide 保持一致 */
function isWideCp(cp) {
  return (cp >= 0x1100 && cp <= 0x115F) || (cp >= 0x2E80 && cp <= 0x303E)
      || (cp >= 0x3041 && cp <= 0x33FF) || (cp >= 0x3400 && cp <= 0x4DBF)
      || (cp >= 0x4E00 && cp <= 0x9FFF) || (cp >= 0xA000 && cp <= 0xA4CF)
      || (cp >= 0xAC00 && cp <= 0xD7A3) || (cp >= 0xF900 && cp <= 0xFAFF)
      || (cp >= 0xFE30 && cp <= 0xFE4F) || (cp >= 0xFF00 && cp <= 0xFF60)
      || (cp >= 0xFFE0 && cp <= 0xFFE6) || (cp >= 0x1F300 && cp <= 0x1F64F)
      || (cp >= 0x1F900 && cp <= 0x1F9FF) || (cp >= 0x20000 && cp <= 0x3FFFD);
}

function segHtml(cols, getCp, getAttr) {
  /* 找到最后一个非空格的格子，尾部空白不渲染（否则每行都拖一条空格） */
  let last = -1;
  for (let x = cols - 1; x >= 0; x--) {
    const cp = getCp(x);
    if (cp && cp !== 32 && cp !== 0xFFFFFFFF) { last = x; break; }
  }
  if (last < 0) return "";

  let plain = "", maxAttr = 0, cur = -1, buf = "";
  const parts = [];
  const push = (html) => {
    if (cur < 0) cur = 0;
    buf += html;
  };
  for (let x = 0; x <= last; x++) {
    const cp = getCp(x);
    if (cp === 0xFFFFFFFF) continue;            /* 宽字符右半格 */
    const a = getAttr(x) || 0;
    if (a > maxAttr) maxAttr = a;
    const ch = (cp === 0 || cp === 32) ? " " : String.fromCodePoint(cp);
    plain += ch;
    if (a !== cur) {
      if (buf) parts.push({ a: cur, t: buf });
      cur = a; buf = "";
    }
    /* 宽字符包成 2ch 的 inline-block，保证和内核的列数严格对齐 */
    buf += isWideCp(cp) ? '<span class="w2">' + esc(ch) + '</span>' : esc(ch);
  }
  if (buf) parts.push({ a: cur, t: buf });

  /* 整行都是普通色：交给行首启发式认 JSON / 内核日志 */
  if (maxAttr === 0) {
    const html = termLineHtml(plain);
    /* 启发式那版是纯文本转义，宽字符对齐会丢，所以把整行也过一遍 */
    if (html.indexOf('class="w2"') < 0 && plain.length && isWidePlain(plain)) {
      return plain.split("").map((c) => {
        const cp = c.codePointAt(0);
        return isWideCp(cp) ? '<span class="w2">' + esc(c) + '</span>' : esc(c);
      }).join("");
    }
    return html;
  }
  return parts.map((p) => {
    const cls = p.a === 1 ? "ta1" : p.a === 2 ? "ta2" : p.a === 5 ? "ta5" : "";
    return cls ? '<span class="' + cls + '">' + p.t + '</span>' : p.t;
  }).join("");
}

function isWidePlain(t) {
  for (const c of t) if (isWideCp(c.codePointAt(0))) return true;
  return false;
}

/* 一行终端文本 → 带颜色的 HTML。
   纯前端启发式，不改内核协议：提示符、内核日志、JSON、错误各走一色。 */
function termLineHtml(txt) {
  if (!txt) return "";
  const m = /^(rvsh>\s?)([\s\S]*)$/.exec(txt);
  if (m) {
    return '<span class="tc-p">' + esc(m[1]) + '</span>'
         + (m[2] ? '<span class="tc-in">' + esc(m[2]) + '</span>' : "");
  }
  if (/^\s*\[[SU]\]/.test(txt)) return '<span class="tc-log">' + esc(txt) + '</span>';
  if (/^\s*[{[]/.test(txt)) return '<span class="tc-json">' + esc(txt) + '</span>';
  if (/错误|失败|not found|不存在|"ok":false/.test(txt)) return '<span class="tc-err">' + esc(txt) + '</span>';
  return esc(txt);
}

/* ══ 终端网格渲染 ══ */
let termEls = null, termRows = 0, termCols = 0, termSeq = [];
let termHistCount = 0;      /* 当前渲染了多少历史行 */
/* scrollHeight / clientHeight 会强制同步布局。历史行一多（压测到 200 行时
   DOM 有 1400 个节点），每帧读一次就让帧率从 126 掉到 103。
   这两个值只在「历史行追加」和「窗口尺寸变化」时才会变，缓存起来。 */
let termMetrics = { h: 0, ch: 0 };
/* DOM 里最多保留这么多历史行。实测 584 行（3817 个节点）时帧率 117fps、
   清空后回到 136fps——节点数是瓶颈。内核 scrollback 仍是 2000 行，
   这里只限制「同时挂在 DOM 里的行数」，超出就丢最老的。
   800 行 ≈ 4400 个节点，帧率还能保持在 110 以上。 */
const HIST_DOM_MAX = 800;
let termHistBase = 0;      /* DOM 里第一行对应 ring 的偏移 */
let termHistSynced = -1;    /* 上次读到的 scroll_count */
let termCharW = 8.4, termLineH = 20;
let termCurX = 0, termCurY = 0, termCurVis = 0;

function termRender() {
  if (!M) return;
  const A = M.HEAPU32;
  const tb = guestOff(TERM_SYNC_PA);
  if (A[tb] !== 0x54524D31) return;

  const cols = A[tb + 1], rows = A[tb + 2];
  const cellsAddr = A[tb + 3] >>> 0, rowseqAddr = A[tb + 4] >>> 0;
  const cx = A[tb + 5], cy = A[tb + 6], cvis = A[tb + 7];
  const scrollAddr = A[tb + 9] >>> 0, sHead = A[tb + 10], sCount = A[tb + 11], sLines = A[tb + 12];
  const host = winEls[0] && winEls[0].body;
  if (!host || !cols || !rows) return;

  /* 用户是不是贴在底部。回看历史时不能强行拉回去。 */
  const atBottom = host.scrollTop + (termMetrics.ch || host.clientHeight)
    >= (termMetrics.h || host.scrollHeight) - 8;

  if (!termEls || termRows !== rows || termCols !== cols) {
    termRows = rows; termCols = cols;
    termSeq = new Array(rows).fill(-1);
    host.querySelectorAll(".term-line").forEach((n) => n.remove());
    termHistCount = 0; termHistSynced = -1; termHistBase = 0;
    termEls = [];
    for (let y = 0; y < rows; y++) {
      const d = document.createElement("div");
      d.className = "term-line";
      host.appendChild(d);
      termEls.push(d);
    }
    host.dataset.fsKey = "";
    termLayout(host, true);
  }

  /* ── 历史行 ──
     内核的 scrollback 是环形缓冲，按 (head - count + i) 顺序读才是时间顺序。
     count 变少（clear）就整段重建；变多就只追加差的那几行。 */
  const attrAddr = A[tb + 13] >>> 0, scrollAttrAddr = A[tb + 14] >>> 0;
  const wrapAddr = A[tb + 15] >>> 0, scrollWrapAddr = A[tb + 16] >>> 0;
  const B = M.HEAPU8;
  const attrOff = attrAddr ? guestByte(attrAddr) : 0;
  const scrollAttrOff = scrollAttrAddr ? guestByte(scrollAttrAddr) : 0;
  const wrapOff = wrapAddr ? guestByte(wrapAddr) : 0;
  const scrollWrapOff = scrollWrapAddr ? guestByte(scrollWrapAddr) : 0;

  if (scrollAddr && sLines && sCount !== termHistSynced) {
    const offS = guestOff(scrollAddr);
    if (sCount < termHistBase + termHistCount) {
      host.querySelectorAll(".term-line.hist").forEach((n) => n.remove());
      termHistCount = 0;
      termHistBase = 0;
    }
    const want = Math.min(sCount, sLines);
    const add = want - (termHistBase + termHistCount);
    /* 索引基准必须在循环外固定：termHistCount 在循环里会自增，
       如果拿它参与算 ring，每行都会多跳一格（读成 ring[0]、ring[2]、ring[4]…），
       越界的地方渲染成空行——表现就是「一半历史行是空白、内容错位」。 */
    const histBase = termHistBase + termHistCount;
    for (let i = 0; i < add; i++) {
      const ring = ((sHead - want + histBase + i) % sLines + sLines) % sLines;
      const base = ring * cols;
      const abase = scrollAttrOff ? scrollAttrOff + base : 0;
      const d = document.createElement("div");
      d.className = "term-line hist" + (scrollWrapOff && B[scrollWrapOff + ring] ? " wrap" : "");
      d.innerHTML = scrollAttrOff
        ? segHtml(cols, (x) => A[offS + base + x], (x) => B[abase + x])
        : termLineHtml("");
      host.insertBefore(d, termEls[0]);
      termHistCount++;
    }
    termHistSynced = sCount;
    /* 超出上限就丢最老的，并同步偏移 */
    if (termHistCount > HIST_DOM_MAX) {
      const drop = termHistCount - HIST_DOM_MAX;
      const els = host.querySelectorAll(".term-line.hist");
      for (let i = 0; i < drop && i < els.length; i++) els[i].remove();
      termHistCount -= drop;
      termHistBase += drop;
    }
    termMetrics.h = host.scrollHeight;
    termMetrics.ch = host.clientHeight;
  }

  const offC = guestOff(cellsAddr), offR = guestOff(rowseqAddr);
  for (let y = 0; y < rows; y++) {
    const rseq = A[offR + y];
    if (rseq === termSeq[y]) continue;
    termSeq[y] = rseq;
    const rowBase = offC + y * cols;
    const rowAttr = attrOff ? attrOff + y * cols : 0;
    const html = rowAttr
      ? segHtml(cols, (x) => A[rowBase + x], (x) => B[rowAttr + x])
      : termLineHtml("");
    if (wrapOff) termEls[y].classList.toggle("wrap", !!B[wrapOff + y]);
    if (termEls[y].innerHTML !== html) termEls[y].innerHTML = html;
  }

  /* 原来贴在底部就继续贴底：新输出不该把用户顶到上面去 */
  if (atBottom && host.scrollTop + host.clientHeight < host.scrollHeight - 2) {
    host.scrollTop = host.scrollHeight;
  }

  termCurX = cx; termCurY = cy; termCurVis = cvis;
  termPlaceCursor();
}

function termPlaceCursor() {
  const host = winEls[0] && winEls[0].body;
  if (!host) return;
  const cur = host.querySelector(".tcur");
  if (!cur) return;
  host.classList.toggle("nocursor", !termCurVis);
  cur.style.left = (12 + termCurX * termCharW) + "px";
  cur.style.top = (10 + (termHistCount + termCurY) * termLineH) + "px";
  cur.style.width = termCharW.toFixed(2) + "px";
  cur.style.height = termLineH.toFixed(2) + "px";
}

/* ══ 面板渲染（进程表 / 文件表）══ */
let procSig = "", fileSig = "";
let sysInfo = { nproc: 0, nfile: 0, nrun: 0 };

function readStrAt(byteOff, max) {
  const B = M.HEAPU8;
  let n = 0;
  while (n < max && B[byteOff + n]) n++;
  return _dec.decode(B.subarray(byteOff, byteOff + n));
}

/* 往终端发命令之前先确认终端窗口是可见的。
   否则命令确实发出去了，但用户看不到任何反馈。 */
function ensureTerm() {
  if (!M) return;
  const w = window.rv.state.wins[0];
  if (w && !w.visible) sendWinCmd(0 * 10 + 5);
}

/* ══ 文件操作（图形界面入口）══
   内核里 fs_write / fs_remove / fs_rename / fs_mkdir 早就有，
   但在此之前只有 shell 能用它们；图形界面只能看不能改。 */

let fsCwd = "";        /* 当前目录，空串表示根 */

/* 某个名字是不是当前目录的直接子项 */
function fsEntryInCwd(name) {
  if (!fsCwd) {
    const t = name.startsWith("/") ? name.slice(1) : name;
    return t.length > 0 && t.indexOf("/") < 0;
  }
  if (name === fsCwd) return false;
  const pre = fsCwd + "/";
  if (!name.startsWith(pre)) return false;
  const rest = name.slice(pre.length);
  return rest.length > 0 && rest.indexOf("/") < 0;
}

function fsIsDir(name) {
  if (!M) return false;
  const ram = M._rv_ram_ptr(), A = M.HEAPU32;
  const base = (ram + (FILE_SYNC_PA - 0x80000000)) >>> 2;
