<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rvsim · RISC-V 迷你机</title>
<style>
:root{
  --bg:#07080a;--s1:#0c0e12;--s2:#111419;--s3:#171b21;
  --line:#1d222a;--line2:#2b323c;
  --fg:#e9ecf0;--fg2:#98a0ab;--fg3:#565d68;
  --acc:#5eead4;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;
  --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}

header{height:50px;display:flex;align-items:center;gap:14px;padding:0 18px;
       border-bottom:1px solid var(--line);background:var(--s1)}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand i{font-style:normal;font-size:11px;color:var(--fg3);font-family:var(--mono)}
.grow{flex:1}
.pill{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;
      color:var(--fg2);padding:5px 12px;border-radius:18px;background:var(--s2);border:1px solid var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--fg3);transition:.2s}
.pill.on .dot{background:var(--acc);box-shadow:0 0 9px var(--acc)}
.pill.ok .dot{background:var(--ok)}
.pill.err .dot{background:var(--err)}

main{display:grid;grid-template-columns:232px minmax(0,1fr) 274px;height:calc(100% - 50px)}
.col{padding:16px;overflow-y:auto;min-height:0}
.col::-webkit-scrollbar{width:8px}
.col::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px;border:2px solid var(--bg)}

.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg3);
     font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--mono);font-size:10px}

button{font:inherit;font-size:12px;color:var(--fg2);background:var(--s2);border:1px solid var(--line2);
       border-radius:6px;padding:6px 11px;cursor:pointer;transition:.14s;white-space:nowrap}
button:hover{background:var(--s3);color:var(--fg);border-color:#3a424e}
button:active{transform:translateY(.5px)}
button:disabled{opacity:.32;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#04241f;font-weight:600}
button.pri:hover{background:#7df0dd}
button.wide{flex:1}
.row{display:flex;gap:6px}

.kv{display:flex;justify-content:space-between;align-items:baseline;padding:2.5px 0;
    font-family:var(--mono);font-size:12px}
.kv .k{color:var(--fg3);font-family:var(--sans);font-size:11.5px}
.kv .v{color:var(--fg)}

/* 终端：绝对主角 */
.termwrap{display:flex;flex-direction:column;height:100%;padding:0}
.termbar{height:38px;display:flex;align-items:center;gap:10px;padding:0 16px;
         border-bottom:1px solid var(--line);background:var(--s1);font-family:var(--mono);font-size:11px;color:var(--fg3)}
.termbar b{color:var(--fg2);font-weight:500}
#term{flex:1;overflow-y:auto;background:#050608;padding:14px 16px;
      font-family:var(--mono);font-size:12.5px;line-height:1.55;color:#c9d1d9;
      white-space:pre-wrap;word-break:break-all;cursor:text}
#term::-webkit-scrollbar{width:9px}
#term::-webkit-scrollbar-thumb{background:#22272f;border-radius:4px;border:2px solid #050608}
.cursor{display:inline-block;width:7px;height:14px;background:var(--acc);vertical-align:-2px;
        animation:bl 1.05s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* 进程表 */
#procs{font-family:var(--mono);font-size:11.5px}
.pt{display:grid;grid-template-columns:26px 1fr 44px;gap:6px;padding:3px 6px;border-radius:4px;color:var(--fg2)}
.pt:hover{background:var(--s2)}
.pt.run{background:rgba(94,234,212,.08);color:var(--fg)}
.pt .st{font-size:10px;text-align:right;color:var(--fg3)}
.pt.run .st{color:var(--acc)}

#reg{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;font-family:var(--mono);font-size:11.5px}
.rg{display:flex;justify-content:space-between;padding:1.5px 4px;border-radius:3px}
.rg:hover{background:var(--s2)}
.rg .n{color:var(--fg3)}
.rg.chg .v{color:var(--warn)}
.rg input{width:66px;background:var(--bg);color:var(--acc);border:1px solid var(--acc);
          border-radius:3px;font:11.5px var(--mono);padding:0 3px;outline:none}

#hot{display:grid;grid-template-columns:repeat(32,1fr);gap:1px}
#hot i{aspect-ratio:1;background:#0e1115;border-radius:1px;display:block;transition:transform .1s}
#hot i:hover{transform:scale(1.6);outline:1px solid var(--acc);position:relative;z-index:3}
.hint{font-family:var(--mono);font-size:10px;color:var(--fg3);margin-top:7px}

#tip{position:fixed;display:none;background:var(--s3);border:1px solid var(--line2);border-radius:6px;
     padding:7px 10px;font:11px var(--mono);color:var(--fg2);pointer-events:none;z-index:99;
     white-space:pre;box-shadow:0 10px 30px rgba(0,0,0,.7)}
</style>
</head>
<body>

<header>
  <div class="brand"><b>rvsim</b><i>RV32IMA · M/S/U · Sv32</i></div>
  <div class="grow"></div>
  <div class="pill" id="st"><span class="dot"></span><span id="stT">未启动</span></div>
</header>

<main>
  <!-- 左 -->
  <div class="col">
    <div class="lbl">启动</div>
    <div class="row" style="flex-direction:column">
      <button id="bKernel" class="pri">启动迷你内核</button>
      <button id="bTest">运行 riscv-tests</button>
      <button id="bUpload">上传 ELF</button>
    </div>
    <input type="file" id="file" accept=".elf,.bin" hidden>

    <div class="lbl" style="margin-top:20px">执行</div>
    <div class="row">
      <button id="bRun" class="wide" disabled>运行</button>
      <button id="bStop" class="wide" disabled>停止</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="bStep" class="wide" disabled>单步</button>
      <button id="bReset" class="wide" disabled>复位</button>
    </div>

    <div class="lbl" style="margin-top:20px">运行时</div>
    <div class="kv"><span class="k">周期</span><span class="v" id="vCy">0</span></div>
    <div class="kv"><span class="k">指令</span><span class="v" id="vIn">0</span></div>
    <div class="kv"><span class="k">PC</span><span class="v" id="vPc">—</span></div>
    <div class="kv"><span class="k">特权级</span><span class="v" id="vPv">—</span></div>

    <div class="lbl" style="margin-top:20px">输入</div>
    <div class="hint" style="margin-top:0">点终端后直接打字，回车送到 guest。Ctrl+C 中断。</div>
  </div>

  <!-- 中：终端 -->
  <div class="termwrap" style="background:var(--s1);border-left:1px solid var(--line);border-right:1px solid var(--line)">
    <div class="termbar">
      <b>UART</b><span>115200 8N1</span>
      <div class="grow"></div>
      <span id="txInfo">0 B</span>
    </div>
    <div id="term"><span class="cursor"></span></div>
  </div>

  <!-- 右 -->
  <div class="col">
    <div class="lbl">进程</div>
    <div id="procs"><div class="hint">启动内核后显示</div></div>

    <div class="lbl" style="margin-top:20px">寄存器</div>
    <div id="reg"></div>

    <div class="lbl" style="margin-top:20px">热图 <em>4KB×512</em></div>
    <div id="hot"></div>
    <div class="hint" id="hHint">悬停查看</div>
  </div>
</main>

<div id="tip"></div>

<script src="rvsim.js"></script>
<script>
const ABI=["zero","ra","sp","gp","tp","t0","t1","t2","s0","s1","a0","a1","a2","a3","a4","a5","a6","a7",
           "s2","s3","s4","s5","s6","s7","s8","s9","s10","s11","t3","t4","t5","t6"];
const PRIV=["U","S","?","M"];
let M=null,running=false,tm=null,loaded=false,ubuf=0,total=0;
let ticking=false,frameNo=0,speed=2;   /* speed: 2=全速 1=常驻低功耗 */
let tailBuf="";                        /* UART 输出尾部窗口，用于识别提示符 */
const hx=(v,w=8)=>"0x"+(v>>>0).toString(16).padStart(w,"0");
const $=i=>document.getElementById(i);

function setState(t,c){$("stT").textContent=t;$("st").className="pill"+(c?" "+c:"");}

/* 终端输出 */
const term=$("term");
let curEl=term.querySelector(".cursor");
function termWrite(txt){
  if(!txt)return;
  term.textContent=term.textContent.replace(/\u200b|\u2588/g,"");
}
function appendOut(s){
  const t=term;
  // 光标一直留在末尾
  const c=t.querySelector(".cursor");
  const span=document.createElement("span");
  span.textContent=s;
  if(c) t.insertBefore(span,c); else t.appendChild(span);
  // 限制长度
  while(t.childNodes.length>1200) t.removeChild(t.firstChild);
  t.scrollTop=t.scrollHeight;
}

/* 启动镜像 */
function boot(bytes,name){
  if(!M)return;
  halt();
  M._rv_reset(); M._rv_uart_clear();
  const p=M._malloc(bytes.length); M.HEAPU8.set(bytes,p);
  const ok=M._rv_load(p,bytes.length); M._free(p);
  if(!ok){setState("加载失败","err");return;}
  loaded=true; total=0;
  term.innerHTML='<span class="cursor"></span>';
  ["bRun","bStop","bStep","bReset"].forEach(i=>$(i).disabled=false);
  /* 不在 boot 里同步跑几十万步：那会把主线程钉死，浏览器连一次重绘
     都做不了，看起来就是"卡住"。交给分片执行引擎，边跑边渲染。 */
  startTicking();
}
async function bootUrl(u,name){
  try{
    setState("加载中…","");
    const r=await fetch(u); if(!r.ok) throw 0;
    boot(new Uint8Array(await r.arrayBuffer()),name);
  }catch(e){setState("镜像不可用","err");}
}

/* 取 UART 输出 */
function pumpUart(){
  if(!M)return;
  let n; let s="";
  while((n=M._rv_uart_read(ubuf,4096))>0){
    const arr=M.HEAPU8.subarray(ubuf,ubuf+n);
    s+=new TextDecoder().decode(arr);
    total+=n;
  }
  if(s){ appendOut(s); tailBuf=(tailBuf+s).slice(-160); }
  /* 提示符可能被拆到相邻两帧，所以用累积窗口判断。
     进 shell 后降到低预算常驻：仍能响应键盘，但不再把 CPU 跑满。 */
  if(speed>1&&tailBuf.indexOf("rvsh>")>=0) speed=1;
  $("txInfo").textContent=total.toLocaleString()+" B";
}

/* ── 分片执行引擎 ──
   每帧只给固定时间预算，跑完立刻让出主线程。这样无论跑 20 万步还是
   2000 万步，页面都不会假死，终端和寄存器也能持续刷新。 */
function stepBudget(ms){
  const t0=performance.now();
  let done=0;
  while(performance.now()-t0<ms){
    for(let k=0;k<400;k++){
      const r=M._rv_step();
      if(r!==0) return {halted:r,n:done};
      done++;
    }
  }
  return {halted:0,n:done};
}

function tick(){
  if(!M||!loaded||!ticking){ticking=false;return;}
  const res=stepBudget(speed>=2?10:2);
  pumpUart();
  frameNo++;
  /* 全速阶段最多持续约 600 帧（10 秒）：再久说明镜像不需要那么快，
     强制降到常驻档，避免一个异常镜像把页面 CPU 吃满。 */
  if(speed>1&&frameNo>600) speed=1;
  if(frameNo%10===0) render();
  if(res.halted!==0){
    halt();
    setState(res.halted===1?"PASS":"FAIL",res.halted===1?"ok":"err");
    render();
    return;
  }
  tm=requestAnimationFrame(tick);
}

function startTicking(){
  if(!M||!loaded)return;
  speed=2;
  running=true;
  $("bRun").disabled=true;$("bStep").disabled=true;
  setState("运行中","on");
  if(ticking)return;
  ticking=true;
  tm=requestAnimationFrame(tick);
}

function run(){ startTicking(); }

function halt(){
  running=false;
  ticking=false;
  if(tm){cancelAnimationFrame(tm);tm=null;}
  if(loaded){$("bRun").disabled=false;$("bStep").disabled=false;}
}

/* 键盘 → guest UART */
term.addEventListener("click",()=>term.focus());
term.tabIndex=0;
term.addEventListener("keydown",e=>{
  if(!loaded||!M)return;
  if(e.key==="Enter"){M._rv_uart_write(13);e.preventDefault();}
  else if(e.key==="Backspace"){M._rv_uart_write(127);e.preventDefault();}
  else if(e.key==="Tab"){M._rv_uart_write(9);e.preventDefault();}
  else if(e.key.length===1){M._rv_uart_write(e.key.charCodeAt(0));e.preventDefault();}
  else return;
  /* 不在这里同步推进：注入后由执行引擎在下一帧处理，
     暂停状态下则自动恢复常驻运行，否则 guest 永远看不到输入。 */
  if(!ticking) startTicking();
});

/* 渲染侧栏 */
let prev={};
function render(){
  if(!M||!loaded)return;
  const pc=M._rv_pc()>>>0;
  $("vCy").textContent=M._rv_cycles().toLocaleString();
  $("vIn").textContent=M._rv_cycles().toLocaleString();
  $("vPc").textContent=hx(pc);
  $("vPv").textContent=PRIV[M._rv_priv()]??"?";

  let r="";
  for(let i=0;i<32;i++){
    const v=M._rv_reg(i)>>>0;
    const chg=(i!==0&&prev[i]!==undefined&&prev[i]!==v)?" chg":"";
    r+=`<div class="rg${chg}" data-r="${i}"><span class="n">${ABI[i]}</span><span class="v">${hx(v)}</span></div>`;
    prev[i]=v;
  }
  $("reg").innerHTML=r;

  const el=$("hot").children;
  let mx=1;const hs=new Uint32Array(512);
  for(let p=0;p<512;p++){hs[p]=M._rv_hot_r(p)+M._rv_hot_w(p);if(hs[p]>mx)mx=hs[p];}
  for(let p=0;p<512;p++){
    const n=hs[p];
    if(!n){el[p].style.background="#0e1115";continue;}
    el[p].style.background=`rgba(94,234,212,${Math.max(.1,Math.log(n+1)/Math.log(mx+1)).toFixed(3)})`;
    el[p].dataset.n=n;
  }
}

/* 事件 */
$("bKernel").onclick=()=>bootUrl("images/kernel.elf","mini-kernel");
$("bTest").onclick=()=>bootUrl("images/rv32ui-p-add","rv32ui-p-add");
$("bUpload").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];
  if(f)f.arrayBuffer().then(b=>boot(new Uint8Array(b),f.name));};
$("bRun").onclick=run;
$("bStop").onclick=()=>{halt();setState("已停止","");pumpUart();};
$("bStep").onclick=()=>{
  if(!loaded)return;
  const r=M._rv_step();
  if(r!==0){halt();setState(r===1?"PASS":"FAIL",r===1?"ok":"err");}
  pumpUart();render();
};
$("bReset").onclick=()=>{halt();M._rv_reset();M._rv_uart_clear();prev={};total=0;
  term.innerHTML='<span class="cursor"></span>';render();setState("已复位","");};

// 寄存器编辑
$("reg").onclick=e=>{
  const d=e.target.closest(".rg");if(!d||!M)return;
  const i=+d.dataset.r,cur=M._rv_reg(i)>>>0;
  const inp=document.createElement("input");
  inp.value=hx(cur);d.querySelector(".v").replaceWith(inp);inp.focus();inp.select();
  const done=()=>{const v=parseInt(inp.value,16);
    if(!isNaN(v)){i===0?M._rv_set_pc(v):M._rv_set_reg(i,v>>>0);}render();};
  inp.onblur=done;
  inp.onkeydown=k=>{if(k.key==="Enter")inp.blur();if(k.key==="Escape"){inp.value=hx(cur);inp.blur();}};
};

// 热图
$("hot").onmousemove=e=>{
  const d=e.target.closest("#hot i[data-n]");if(!d)return;
  const p=+d.dataset.p;
  const t=$("tip");t.style.display="block";
  t.style.left=(e.clientX+14)+"px";t.style.top=(e.clientY+14)+"px";
  t.textContent=`页 #${p}\n${hx(0x80000000+p*4096)}\n读 ${M._rv_hot_r(p)} · 写 ${M._rv_hot_w(p)}`;
  $("hHint").textContent=`#${p}`;
};
$("hot").onmouseleave=()=>{$("tip").style.display="none";};

createRvsim().then(m=>{
  M=m;ubuf=m._malloc(4096);
  $("hot").innerHTML=Array.from({length:512},(_,p)=>`<i data-p="${p}"></i>`).join("");
  setState("就绪","");
  // 自动启动内核，让用户一打开就看到东西
  bootUrl("images/kernel.elf","mini-kernel");
});
</script>
</body>
</html>
